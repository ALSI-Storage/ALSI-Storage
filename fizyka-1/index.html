:root { --bg:#000; --s1:#0f0f10; --bd:#262628; --tx:#f4f4f4; --mu:#8d8d92; --soft:#d9d9dc;
  --cy:#45d0de; --or:#ff7a1a; --fu:#ff4fc0; --gr:#6a6a70;
  --chip-bg:#0b0b0c; --chip-bd:#3a3a3d; --zone-bd:rgba(255,255,255,.09); --zone-bg:rgba(20,21,25,.42); --zone-sh:inset 0 1px 0 rgba(255,255,255,.05);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
/* Light theme: soft grey paper instead of white, ink instead of black, accents darkened to keep contrast on a light ground */
:root[data-theme=light] { --bg:#e9ecf0; --s1:#f6f7f9; --bd:#cfd4db; --tx:#1c2028; --mu:#586170; --soft:#343b47;
  --cy:#07798c; --or:#b8530a; --fu:#a8256f; --gr:#8a929d;
  --chip-bg:#f6f7f9; --chip-bd:#c4cad3; --zone-bd:rgba(255,255,255,.8); --zone-bg:rgba(255,255,255,.42); --zone-sh:0 12px 32px -16px rgba(40,55,80,.28), inset 0 1px 0 rgba(255,255,255,.9); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html[data-theme=light] { color-scheme:light; }
html { color-scheme:dark; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 var(--mono); transition:background-color .35s, color .35s; }
#kg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }  /* kinetic grid, behind everything */
main { position:relative; z-index:1; margin:0 auto; padding:calc(env(safe-area-inset-top) + 28px) 16px 64px; }
@media (display-mode: fullscreen) { main { padding-top:calc(env(safe-area-inset-top) + 40px); } }  /* installed app runs fullscreen: no system bar above the title */
.hd { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.tg { flex:none; width:48px; height:48px; display:grid; place-items:center; padding:0; color:var(--tx); text-decoration:none; background:var(--chip-bg); border:1.5px solid var(--chip-bd); border-radius:50%; cursor:pointer; transition:border-color .2s, background-color .35s, color .35s; }
body:not(.away) .tg:hover { border-color:var(--ac, var(--cy)); }
.tg svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
h1 { margin:0; font-size:32px; line-height:1.1; font-weight:700; letter-spacing:-.02em; }
.sub { color:var(--mu); font-size:12px; margin:4px 0 26px; }
/* frosted (matte) glass panel: the grid shows through, blurred */
.glass { position:relative; border:1.5px solid var(--zone-bd); border-radius:38px; padding:26px 26px 30px; background:var(--zone-bg);
  backdrop-filter:blur(22px) saturate(1.15); -webkit-backdrop-filter:blur(22px) saturate(1.15); box-shadow:var(--zone-sh);
  transition:border-color .3s ease, box-shadow .3s ease, background-color .35s ease; }

main { max-width:76rem; padding-bottom:96px; }
.hd { margin-bottom:34px; }
.lead { display:flex; align-items:center; gap:16px; min-width:0; }
.lead .sub { margin:6px 0 0; }
.tools { display:flex; align-items:center; gap:28px; margin:0 0 14px; }
.search { position:relative; flex:1; max-width:26rem; color:var(--mu); transition:color .25s; }
.search svg { position:absolute; left:16px; top:50%; width:18px; height:18px; margin-top:-9px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; pointer-events:none; }
.search input { width:100%; height:46px; padding:0 18px 0 44px; font:inherit; font-size:14px; color:var(--tx); background:var(--chip-bg); border:1.5px solid var(--chip-bd); border-radius:999px; outline:none;
  transition:border-color .25s, box-shadow .25s, background-color .35s; }
body:not(.away) .search:hover, .search:focus-within { color:var(--ac); }
body:not(.away) .search input:hover, .search input:focus { border-color:var(--ac); box-shadow:0 0 0 1px var(--ac), 0 0 24px -10px var(--ac); }
.search input::placeholder { color:var(--mu); }
.sort { flex:none; height:46px; display:flex; align-items:center; gap:10px; padding:0 20px 0 16px; font:inherit; font-size:14px; color:var(--soft); cursor:pointer;
  background:var(--chip-bg); border:1.5px solid var(--chip-bd); border-radius:999px; transition:border-color .25s, box-shadow .25s, background-color .35s, color .35s; }
body:not(.away) .sort:hover { border-color:var(--ac); box-shadow:0 0 0 1px var(--ac), 0 0 24px -10px var(--ac); }
.sort svg { width:18px; height:18px; fill:none; stroke:var(--ac); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform .3s ease; }
.sort.asc svg { transform:rotate(180deg); }
.list { padding:18px; border-radius:32px; }
.row { position:relative; display:flex; align-items:center; gap:18px; margin:0 0 10px; padding:14px 22px 14px 30px; color:inherit; text-decoration:none;
  background:var(--s1); border:1px solid var(--bd); border-radius:20px; transition:border-color .2s, transform .2s, background-color .35s; }
.row:last-of-type { margin-bottom:0; }
.row[hidden] { display:none; }
body:not(.away) .row:hover, .row:focus-visible { border-color:var(--ac); transform:translateY(-1px); outline:none; }
.row .bar { position:absolute; left:12px; top:14px; bottom:14px; width:6px; border-radius:6px; background:var(--ac); }
.row .k { flex:none; min-width:7.5rem; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ac); }
.row .nm { flex:1; min-width:0; font-size:17px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .dt { flex:none; color:var(--mu); font-size:13px; }
#none { margin:0; padding:22px 8px; text-align:center; color:var(--mu); }
@media (max-width:760px) {
  h1 { font-size:24px; } .tools { gap:12px; } .sort span { display:none; } .sort { padding:0 15px; }
  .row { flex-wrap:wrap; gap:4px 14px; } .row .nm { order:3; flex-basis:100%; white-space:normal; } .row .k { min-width:0; }
}

<body style="--ac:var(--cy)">
<canvas id="kg" aria-hidden="true"></canvas>
<main>
<div class="hd">
  <div class="lead">
    <a class="tg" href="../index.html" aria-label="Wróć do indeksu" title="Indeks"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h4v-5h4v5h4v-9"/></svg></a>
    <div><h1>Fizyka 1</h1><p class="sub">2 notatki</p></div>
  </div>
  <button class="tg" id="theme" type="button" aria-label="Zmień motyw"></button>
</div>
<div class="tools">
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="search" placeholder="Szukaj notatki…" autocomplete="off" spellcheck="false" aria-label="Szukaj notatki po nazwie"></label>
  <button class="sort" id="sort" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span></span></button>
</div>
<section class="glass list" id="list">
<a class=row href='2026-10-25_fizyka-25-10-2026/index.html' data-f='2026-10-25_fizyka-25-10-2026'><i class=bar></i><span class=k>Notatka</span><span class=nm>Pochodne, całki i kinematyka</span><span class=dt>2026-10-25</span></a>
<a class=row href='2026-10-11_notatka-1/index.html' data-f='2026-10-11_notatka-1'><i class=bar></i><span class=k>Notatka</span><span class=nm>Wektory: działania, bazy i iloczyny</span><span class=dt>2026-10-11</span></a>
<p id="none" hidden>Brak notatek. Wkrótce.</p>
</section>
</main>
<script>
// Theme switch (menu only; lessons stay dark). The choice is remembered in this browser.
const SVG = { sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>', moon: '<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>' };
const tg = document.getElementById('theme');
function setTheme(t, save = true) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#e9ecf0' : '#000000';  // system bar of the installed app = page background
  tg.innerHTML = `<svg viewBox="0 0 24 24">${t === 'light' ? SVG.moon : SVG.sun}</svg>`; tg.title = t === 'light' ? 'Ciemny motyw' : 'Jasny motyw';
  if (save) try { localStorage.setItem('alsi-theme', t); } catch (e) {}
  dirty = true;
}
tg.onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

// Kinetic grid: dots (as dense as the old static pattern) joined by faint lines; near the pointer the grid bends and
// lights up, and the colour flows cyan -> orange -> fuchsia as the pointer travels. Click sends a ripple.
// (Vanilla port of the React KineticGrid, toned down on purpose.)
const kg = document.getElementById('kg'), g = kg.getContext('2d');
const CELL = 32, RADIUS = 200, WARP = 13, LERP = .08, EDGE = 1.5, FLOW = .004;  // FLOW: colour-wheel steps per pixel of pointer travel (3 steps = one full cycle)
const PAR = .15;  // parallax: the grid drifts with a sixth or so of the page scroll
const PAL = { dark:  { line: [255, 255, 255, .035], node: [255, 255, 255, .15], a: .55, brand: [[69, 208, 222], [255, 122, 26], [255, 79, 192]] },
              light: { line: [25, 35, 55, .04],     node: [25, 35, 55, .16],    a: .5,  brand: [[7, 121, 140], [184, 83, 10], [168, 37, 111]] } };
let W = 0, H = 0, dirty = true, phase = 0, mouse = { x: -9999, y: -9999 }, goal = { x: -9999, y: -9999 }, ripples = [];
let amp = 0, on = 0, lastY = scrollY;  // glow strength eases to 'on': 1 while a pointer/pen/finger is over the page, 0 once it is lifted or leaves
const mix = (a, b, t) => a + (b - a) * t;
const rgba = (a, b, t) => `rgba(${[0, 1, 2].map(i => Math.round(mix(a[i], b[i], t)))},${mix(a[3], b[3], t).toFixed(3)})`;
function wheel(brand, p) {  // smooth walk around the three brand colours
  p = ((p % 3) + 3) % 3; const i = Math.floor(p), t = p - i, s = t * t * (3 - 2 * t), a = brand[i], b = brand[(i + 1) % 3];
  return [mix(a[0], b[0], s), mix(a[1], b[1], s), mix(a[2], b[2], s)];
}
function fit() {
  const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  kg.width = W * d; kg.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); dirty = true;
}
function warp(x, y, c, r, cols, rows) {  // displaced point + how close the pointer is (0..1)
  const pin = Math.min(c / EDGE, (cols - 1 - c) / EDGE, 1) ** 2 * Math.min(r / EDGE, (rows - 1 - r) / EDGE, 1) ** 2;  // borders stay put
  const dx = x - mouse.x, dy = y - mouse.y, dist = Math.hypot(dx, dy), near = Math.max(0, 1 - dist / RADIUS) * pin * amp;
  let ox = 0, oy = 0;
  for (const p of ripples) {
    const rx = x - p.x, ry = y - p.y, diff = Math.hypot(rx, ry) - p.r;
    if (Math.abs(diff) < 55) {
      const k = (1 - Math.abs(diff) / 55) * p.o * 12 * pin * (diff < 0 ? 1 : -1), a = Math.atan2(ry, rx);
      ox += Math.cos(a) * k; oy += Math.sin(a) * k;
    }
  }
  if (dist < RADIUS && dist > 0 && pin > 0) {
    const t = dist / RADIUS, w = (1 - t) * (1 - t) * Math.min(1, dist / 60) * WARP * pin * amp, a = Math.atan2(dy, dx);
    ox -= Math.cos(a) * w; oy -= Math.sin(a) * w;
  }
  return { x: x + ox, y: y + oy, near };
}
function frame(now) {
  requestAnimationFrame(frame);
  mouse.x = mix(mouse.x, goal.x, LERP); mouse.y = mix(mouse.y, goal.y, LERP); amp = mix(amp, on, .1);
  const moving = Math.abs(mouse.x - goal.x) + Math.abs(mouse.y - goal.y) > .2 || Math.abs(amp - on) > .004;
  if (!dirty && !moving && !ripples.length) return;  // nothing changes: skip the redraw
  dirty = false;
  const pal = PAL[document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'];
  g.clearRect(0, 0, W, H);
  for (let i = ripples.length - 1; i >= 0; i--) {
    const p = ripples[i], age = (now - p.born) / 1000;
    p.r = Math.max(0, age * 400); p.o = Math.max(0, 1 - age * 1.2);
    if (p.o <= 0) ripples.splice(i, 1);
  }
  const cols = Math.max(2, Math.ceil(W / CELL)) + 1, rows = Math.max(2, Math.ceil(H / CELL)) + 2, cw = W / (cols - 1), ch = H / (rows - 2), P = [];
  // half a cell in from the edges, so no dot is cut in half by the screen edge or the app's title bar; shifted by the scroll (parallax)
  const x0 = cw / 2, y0 = ch / 2 - ((scrollY * PAR) % ch);
  for (let r = 0; r < rows; r++) { P[r] = []; for (let c = 0; c < cols; c++) P[r][c] = warp(x0 + c * cw, y0 + r * ch, c, r, cols, rows); }
  // colour at a point: the wheel position moves with pointer travel, plus a slow spatial offset so the colour flows across the lit area
  const hue = p => { const c = wheel(pal.brand, phase + (p.x * .0016 + p.y * .0011)); c.push(pal.a); return c; };
  // resting lines/dots (almost all of them) go into one batched path each; only the lit ones are drawn one by one
  g.beginPath();
  const lit = [];
  const seg = (a, b) => {
    const n = (a.near + b.near) / 2;
    if (n < .02) { g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); } else lit.push([a, b, n * n * (3 - 2 * n)]);
  };
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (c < cols - 1) seg(P[r][c], P[r][c + 1]);
    if (r < rows - 1) seg(P[r][c], P[r + 1][c]);
  }
  g.strokeStyle = rgba(pal.line, pal.line, 0); g.lineWidth = .8; g.stroke();
  for (const [a, b, t] of lit) {
    g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.strokeStyle = rgba(pal.line, hue(a), t); g.lineWidth = mix(.8, 1.1, t); g.stroke();
  }
  g.beginPath();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const p = P[r][c];
    if (p.near < .02) { g.moveTo(p.x + 1.5, p.y); g.arc(p.x, p.y, 1.5, 0, 7); }  // resting dot, same density as the old static pattern
  }
  g.fillStyle = rgba(pal.node, pal.node, 0); g.fill();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const p = P[r][c];
    if (p.near < .02) continue;
    const t = p.near * p.near * (3 - 2 * p.near), col = hue(p);
    g.beginPath(); g.arc(p.x, p.y, mix(1.5, 2.4, t), 0, 7); g.fillStyle = rgba(pal.node, col, t); g.fill();
  }
  for (const p of ripples) {
    const c = hue(p); g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.strokeStyle = `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${(p.o * .12).toFixed(3)})`; g.lineWidth = 1.5; g.stroke();
  }
}
fit(); addEventListener('resize', fit);
addEventListener('scroll', () => {  // the grid drifts (parallax) and the colour flows with the scrolled distance too
  phase += Math.abs(scrollY - lastY) * FLOW; lastY = scrollY; dirty = true;
}, { passive: true });
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {  // reduced motion: a still grid, no warp, flow or ripples
  const follow = (x, y) => {  // the lit spot follows the pointer, and the colour flows with the distance travelled
    if (goal.x > -9000 && amp > .05) phase += Math.hypot(x - goal.x, y - goal.y) * FLOW;
    if (amp < .05) mouse = { x, y };  // after a lift the glow comes back where the pen/finger lands, not sliding from the old spot
    goal = { x, y }; on = 1;
  };
  addEventListener('pointermove', e => follow(e.clientX, e.clientY), { passive: true });  // mouse, pen hover, pen and finger
  addEventListener('pointerdown', e => follow(e.clientX, e.clientY), { passive: true });
  // a pen or finger drag that scrolls the page cancels pointer events, but touchmove keeps coming
  addEventListener('touchmove', e => { const t = e.touches[0]; if (t) follow(t.clientX, t.clientY); }, { passive: true });
  // lifted finger or pen, pen out of hover range, mouse out of the window: the glow fades away
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') on = 0; });
  addEventListener('touchend', () => { on = 0; }); addEventListener('touchcancel', () => { on = 0; });
  document.addEventListener('pointerout', e => { if (!e.relatedTarget) on = 0; });
  // Chrome on Android sends NOTHING when a hovering pen leaves its range (measured on a Galaxy Tab), while a pen in range reports
  // every ~11 ms even when still. So silence = pen gone: fade the glow and drop the hover highlights (body.away gates every :hover).
  let penIdle = 0;
  const penAlive = e => {
    if (e.pointerType !== 'pen') return;
    document.body.classList.remove('away'); clearTimeout(penIdle);
    penIdle = setTimeout(() => { on = 0; document.body.classList.add('away'); }, 300);
  };
  addEventListener('onpointerrawupdate' in window ? 'pointerrawupdate' : 'pointermove', penAlive, { passive: true });
  addEventListener('pointermove', e => { if (e.pointerType === 'mouse') document.body.classList.remove('away'); }, { passive: true });
  addEventListener('click', e => ripples.push({ x: e.clientX, y: e.clientY, r: 0, o: 1, born: performance.now() }));
}
requestAnimationFrame(frame);
setTheme(document.documentElement.dataset.theme, false);

// Search (accent/diacritics-insensitive) and date sort. Arrow down = newest first, arrow up = oldest first.
const list = document.getElementById('list'), items = [...list.querySelectorAll('.row')], find = document.getElementById('q'), sortBtn = document.getElementById('sort'), none = document.getElementById('none');
const plain = s => s.toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '');
items.forEach(r => { r.dataset.n = plain(r.textContent); });
let newestFirst = true;
function show() {
  const t = plain(find.value.trim());
  items.sort((a, b) => (newestFirst ? -1 : 1) * a.dataset.f.localeCompare(b.dataset.f));
  items.forEach(r => { r.hidden = !!t && !r.dataset.n.includes(t); list.insertBefore(r, none); });
  none.hidden = items.some(r => !r.hidden);
  if (items.length && !none.hidden) none.textContent = 'Brak wyników';
  sortBtn.classList.toggle('asc', !newestFirst);
  sortBtn.lastChild.textContent = newestFirst ? 'Najnowsze' : 'Najstarsze';
  sortBtn.title = sortBtn.ariaLabel = newestFirst ? 'Od najnowszych do najstarszych' : 'Od najstarszych do najnowszych';
}
find.addEventListener('input', show);
sortBtn.onclick = () => { newestFirst = !newestFirst; show(); };
show();
</script>
</body>
