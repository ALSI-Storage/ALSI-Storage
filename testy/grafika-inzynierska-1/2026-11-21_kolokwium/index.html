u nie podaje się, bo wykonawca potrzebuje głębokości wiercenia.", "id": "q22", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#otw-r1", "t": "07.11 · Otwór nieprzelotowy"}], "partial": false}, {"type": "abc", "tag": "wym.otwory", "q": "Otwór przelotowy Ø7 ma od strony powierzchni pogłębienie walcowe Ø16. Który zapis uproszczony jest poprawny?", "options": ["<code>Ø7<\/code> nad <code>⌴Ø16 ↧9<\/code>, gdzie 9 to głębokość pogłębienia mierzona od powierzchni", "<code>Ø7<\/code> nad <code>⌴Ø16 ↧9<\/code>, gdzie 9 to grubość materiału pod pogłębieniem", "<code>Ø7<\/code> nad <code>⌵Ø16×90°<\/code> (symbol pogłębienia stożkowego), czyli średnica i kąt pogłębienia", "<code>Ø16<\/code> nad <code>⌴Ø7 ↧9<\/code>, czyli najpierw średnica pogłębienia"], "answer": 0, "explain": "Pogłębienie walcowe opisuje się średnicą otworu, symbolem ⌴, średnicą pogłębienia i głębokością jego wykonania od powierzchni. Symbol pogłębienia stożkowego ze średnicą i kątem dotyczy pogłębienia stożkowego, a grubości pozostałego materiału się nie podaje.", "id": "q23", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#otw-r3", "t": "07.11 · Otwór dwustopniowy"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#otw-po", "t": "07.11 · Otwór jednym opisem"}], "partial": false}, {"type": "abc", "tag": "wym.promienie_fazy", "q": "Który zapis wymiaru zaokrąglenia narożnika jest poprawny?", "options": ["<svg viewBox=\"0 0 230 165\" role=\"img\" aria-label=\"Płytka z zaokrąglonym narożnikiem i wymiarem zaokrąglenia.\"><path class=\"sh\" d=\"M30,150 L30,30 L130,30 A40,40 0 0 1 170,70 L170,150 Z\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"124.0\" y1=\"70.0\" x2=\"136.0\" y2=\"70.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"64.0\" x2=\"130.0\" y2=\"76.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"70.0\" x2=\"182.3\" y2=\"17.7\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"158.3,41.7 153.2,50.8 149.2,46.8\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"186.3\" y=\"15.7\" text-anchor=\"start\" style=\"font-size:13px\">R20<\/text><\/svg>", "<svg viewBox=\"0 0 230 165\" role=\"img\" aria-label=\"Płytka z zaokrąglonym narożnikiem i wymiarem zaokrąglenia.\"><path class=\"sh\" d=\"M30,150 L30,30 L130,30 A40,40 0 0 1 170,70 L170,150 Z\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"124.0\" y1=\"70.0\" x2=\"136.0\" y2=\"70.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"64.0\" x2=\"130.0\" y2=\"76.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"70.0\" x2=\"182.3\" y2=\"17.7\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"158.3,41.7 153.2,50.8 149.2,46.8\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"186.3\" y=\"15.7\" text-anchor=\"start\" style=\"font-size:13px\">R20<\/text><polygon class=\"ax\" points=\"130.0,70.0 135.1,60.9 139.1,64.9\" style=\"fill:var(--mu)\"/><\/svg>", "<svg viewBox=\"0 0 230 165\" role=\"img\" aria-label=\"Płytka z zaokrąglonym narożnikiem i wymiarem zaokrąglenia.\"><path class=\"sh\" d=\"M30,150 L30,30 L130,30 A40,40 0 0 1 170,70 L170,150 Z\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"124.0\" y1=\"70.0\" x2=\"136.0\" y2=\"70.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"64.0\" x2=\"130.0\" y2=\"76.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"70.0\" x2=\"182.3\" y2=\"17.7\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"158.3,41.7 153.2,50.8 149.2,46.8\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"186.3\" y=\"15.7\" text-anchor=\"start\" style=\"font-size:13px\">20<\/text><\/svg>", "<svg viewBox=\"0 0 230 165\" role=\"img\" aria-label=\"Płytka z zaokrąglonym narożnikiem i wymiarem zaokrąglenia.\"><path class=\"sh\" d=\"M30,150 L30,30 L130,30 A40,40 0 0 1 170,70 L170,150 Z\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"124.0\" y1=\"70.0\" x2=\"136.0\" y2=\"70.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"64.0\" x2=\"130.0\" y2=\"76.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"70.0\" x2=\"182.3\" y2=\"17.7\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"158.3,41.7 153.2,50.8 149.2,46.8\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"186.3\" y=\"15.7\" text-anchor=\"start\" style=\"font-size:13px\">Ø40<\/text><\/svg>"], "answer": 0, "explain": "Promień wymiaruje się linią od środka łuku z jednym grotem na łuku i liczbą poprzedzoną literą R. Grot w środku łuku, brak znaku R albo średnica przy łuku narożnika to błędy.", "id": "q24", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#prom-po", "t": "07.11 · Łuki i ścięcia"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#prom-r1", "t": "07.11 · Środek w obrysie"}], "partial": false}, {"type": "abc", "tag": "wym.promienie_fazy", "q": "Faza na krawędzi wałka ma długość 3 mm i kąt 30°. Jak ją zwymiarować?", "options": ["osobno: wymiar liniowy 3 i wymiar kątowy 30°", "zapisem 3×30° na półce linii odniesienia", "zapisem 30°×3 na linii wymiarowej równoległej do osi", "tylko długością 3, bo kąt fazy jest znormalizowany"], "answer": 0, "explain": "Zapis skrócony „długość × kąt” wolno stosować tylko dla kąta 45° (np. 2×45°). Dla innych kątów podaje się długość i kąt osobno albo dwa wymiary liniowe; „3×30°” na półce to typowy błąd.", "id": "q25", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#prom-r5", "t": "07.11 · Faza pod innym kątem"}], "partial": false}, {"type": "short", "tag": "wym.zbieznosc", "q": "Stożek ścięty ma średnice D = 30 mm i d = 20 mm oraz długość L = 50 mm. Podaj jego zbieżność w postaci 1:x.", "answer": ["1:5", "1/5"], "explain": "Zbieżność to (D − d) : L = 10 : 50 = 1 : 5. Wynik 1:10 dałaby różnica połówek średnic, czyli wzór na pochylenie, a nie na zbieżność.", "id": "q26", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zbiez-r1", "t": "07.11 · Zbieżność 1:x"}], "partial": false}, {"type": "multi", "tag": "wym.zbieznosc", "q": "Stożek ścięty ma długość 50 mm i średnice 30 mm oraz 20 mm. Które zestawy wymiarów określają go jednoznacznie i bez nadmiaru?", "options": ["Ø30, Ø20 i 50", "Ø20, 50 i kąt 5°42' między tworzącą a linią równoległą do osi", "Ø30, 50 i zbieżność 1:5", "Ø30, Ø20, 50 i kąt 5°42'", "Ø30 i Ø20"], "answer": [0, 1, 2], "explain": "Stożek ścięty określają trzy niezależne wymiary: dwie średnice i długość, jedna średnica z długością i kątem tworzącej albo średnica z długością i zbieżnością. Czwarty wymiar jest nadmiarowy, a same dwie średnice nie określają długości.", "id": "q27", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zbiez-r3", "t": "07.11 · Stożek ścięty"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zbiez-r3d", "t": "07.11 · Dwie średnice i 50"}], "partial": false}, {"type": "abc", "tag": "wym.zbieznosc", "q": "Przy sześciokątnym czopie podano wymiar 17 (wymiar „pod klucz”). Co on oznacza?", "options": ["odległość między przeciwległymi bokami, czyli średnicę okręgu wpisanego", "odległość między przeciwległymi wierzchołkami, czyli średnicę okręgu opisanego", "długość boku sześciokąta", "promień okręgu opisanego na sześciokącie"], "answer": 0, "explain": "Wymiar sześciokąta to rozwartość klucza, czyli odległość równoległych boków równa średnicy okręgu wpisanego. Okrąg opisany (przez wierzchołki) jest większy i nie jest wymiarem sześciokąta.", "id": "q28", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zbiez-r4d", "t": "07.11 · Rozwartość klucza 17"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#lacz-r2", "t": "08.11 · Wymiar pod klucz"}], "partial": false}, {"type": "long", "tag": "wym.zasady", "pts": 1, "q": "Wymień i scharakteryzuj cztery podstawowe zasady wymiarowania. Do każdej podaj przykład.", "key": "<b>1 pkt:<\/b> cztery zasady nazwane i poprawnie opisane, przy co najmniej trzech sensowny przykład. <b>0,5 pkt:<\/b> trzy zasady albo cztery z niepełnym opisem lub bez przykładów. <b>0 pkt:<\/b> najwyżej dwie zasady albo pomylenie ich z zasadami rysowania linii. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Zasady są równorzędne i uzupełniają się.<\/li><li><b>Wymiary konieczne:<\/b> zawsze gabaryty; tylko tyle wymiarów, ile potrzeba do jednoznacznego określenia przedmiotu; każdy wymiar daje się zmierzyć przy obróbce; mniejsze wymiary bliżej rzutu, gabarytowe dalej.<\/li><li><b>Grupowanie:<\/b> wymiary jednego szczegółu (rowek: szerokość, głębokość, położenie; otwór; występ) na jednym rzucie, tym, na którym szczegół jest najlepiej widoczny.<\/li><li><b>Niepowtarzanie:<\/b> każdy wymiar podaje się raz, tam gdzie jest najczytelniejszy (np. gabaryt 50 tylko na rzucie głównym).<\/li><li><b>Pomijanie wymiarów oczywistych:<\/b> kąty 0° i 90°, symetryczne rozmieszczenie, kąt rozstawu otworów równomiernie rozmieszczonych na okręgu, stożek po wiertle; wyjątek: wymiar tolerowany lub ważny dla współpracy części podaje się.<\/li><\/ul>", "id": "q29", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-po", "t": "07.11 · Po co zasady"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-kon", "t": "07.11 · Wymiary konieczne"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-gr", "t": "07.11 · Grupowanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-pw", "t": "07.11 · Bez powtórzeń"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-oc", "t": "07.11 · Bez oczywistych"}], "partial": false}, {"type": "long", "tag": "wym.uklady", "pts": 1, "q": "Scharakteryzuj układy wymiarowania: szeregowy, równoległy i mieszany. Wyjaśnij przy tym, czym jest baza wymiarowa i na czym polega zasada otwartego łańcucha wymiarowego.", "key": "<b>1 pkt:<\/b> trzy układy poprawnie opisane, poprawna definicja bazy i zasady otwartego łańcucha (z informacją, który wymiar się pomija). <b>0,5 pkt:<\/b> układy opisane, ale brak definicji bazy albo zasady łańcucha (lub odwrotnie). <b>0 pkt:<\/b> pomylenie układów albo tylko same nazwy. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li><b>Baza wymiarowa:<\/b> element przedmiotu (płaszczyzna, krawędź, oś symetrii, punkt), od którego podaje się położenie innych elementów; bazy konstrukcyjne, technologiczne (obróbkowe), pomiarowe; zwykle duża obrobiona powierzchnia, główna oś lub środek ważnego otworu.<\/li><li><b>Szeregowy (łańcuchowy):<\/b> wymiary jeden za drugim na jednej linii; łańcucha nie wolno zamykać; gabaryt podaje się zawsze.<\/li><li><b>Otwarty łańcuch:<\/b> jeden wymiar łańcucha (najmniej istotny, niekoniecznie najmniejszy) pomija się jako wypadkowy albo podaje w nawiasie jako orientacyjny.<\/li><li><b>Równoległy (od bazy):<\/b> wszystkie wymiary od jednej bazy, zwykle dwóch prostopadłych; bazą nie może być linia skośna ani zakończona łukiem; przy bazie w osi liczby nie mogą tworzyć kolumny.<\/li><li><b>Mieszany:<\/b> połączenie obu, wykorzystuje symetrię; stosowany najczęściej.<\/li><li>Dodatkowo: współrzędnościowy, czyli tabela nr–x–y–Ø (i głębokość) dla wielu nierównomiernie rozmieszczonych otworów.<\/li><\/ul>", "id": "q30", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#bazy-po", "t": "07.11 · Czym jest baza"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#uklady-plan", "t": "07.11 · Plansza: wałek"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#uklady-r1", "t": "07.11 · Szeregowy: bez zamykania"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#uklady-r2", "t": "07.11 · Równoległy: prosta baza"}], "partial": false}, {"type": "sketch", "tag": "wym.okragle", "pts": 1, "q": "Płytka prostokątna 80 × 50 mm o grubości 8 mm ma zaokrąglony prawy górny narożnik promieniem 10 mm i dwa jednakowe otwory przelotowe Ø10. Osie otworów leżą 15 mm od dolnej krawędzi oraz 15 mm i 50 mm od lewej krawędzi. Narysuj jeden rzut (widok z góry) i zwymiaruj płytkę kompletnie, bez rysowania drugiego rzutu.", "key": "<b>Musi być:<\/b><ul><li>zarys linią ciągłą grubą, osie otworów linią punktową cienką, wysunięte nieco poza okręgi;<\/li><li>gabaryty 80 i 50 najdalej od zarysu, mniejsze wymiary bliżej;<\/li><li>położenie otworów od dwóch baz (lewa i dolna krawędź) do osi otworów: 15 i 50 od lewej (równolegle, albo 15 i 35 łańcuchem), 15 od dołu podane raz;<\/li><li>średnica podana raz z krotnością: <code>2×Ø10<\/code>;<\/li><li>R10 linią od środka łuku z grotem na łuku; środka zaokrąglenia narożnika się nie pozycjonuje;<\/li><li>grubość zapisem <code>t = 8<\/code> (albo t=8) na rzucie;<\/li><li>linie wymiarowe i pomocnicze cienkie ciągłe, pomocnicze wysunięte 2–3 mm, jeden rodzaj grotów, liczby czytane od dołu i od prawej.<\/li><\/ul><b>1 pkt:<\/b> wszystko powyżej, najwyżej jedno drobne uchybienie. <b>0,5 pkt:<\/b> rzut i większość wymiarów poprawne, ale brak t albo krotności otworów, wymiar powtórzony lub zamknięty łańcuch (15 + 35 + 30 = 80). <b>0 pkt:<\/b> brak gabarytów lub położenia otworów. <b>Typowe błędy:<\/b> wymiar do krawędzi otworu zamiast do osi, Ø10 przy każdym otworze, R jako Ø, gabaryt bliżej zarysu niż wymiary cząstkowe.", "id": "q31", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#prom-r1", "t": "07.11 · Środek w obrysie"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#kolo-r4", "t": "07.11 · Położenie otworu"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#bazy-plan", "t": "07.11 · Plansza: płytka z bazami"}], "partial": false}, {"type": "sketch", "tag": "wym.lancuchy", "pts": 1, "svg": "<svg viewBox=\"0 0 380 220\" role=\"img\" aria-label=\"Wałek stopniowany o osi poziomej: czop, kołnierz i drugi czop, z fazą na lewym końcu.\"><polygon class=\"sh\" points=\"30.0,74.0 34.0,70.0 150.0,70.0 150.0,30.0 190.0,30.0 190.0,50.0 350.0,50.0 350.0,170.0 190.0,170.0 190.0,190.0 150.0,190.0 150.0,150.0 34.0,150.0 30.0,146.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"34.0\" y1=\"70.0\" x2=\"34.0\" y2=\"150.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"18.0\" y1=\"110.0\" x2=\"362.0\" y2=\"110.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>", "q": "Wałek stopniowany o osi poziomej składa się (od lewej) z czopu Ø20 o długości 30 mm, kołnierza Ø40 o długości 10 mm i czopu Ø30 o długości 40 mm. Lewy koniec ma fazę 1 mm pod kątem 45°. Narysuj widok wałka (rysunek poglądowy obok zachowuje proporcje, ale nie ma wymiarów) i zwymiaruj go, zachowując zasadę otwartego łańcucha wymiarowego.", "key": "<b>Musi być:<\/b><ul><li>oś linią punktową cienką, wysunięta poza zarys;<\/li><li>średnice Ø20, Ø40, Ø30 ze znakiem Ø, linie wymiarowe prostopadłe do osi, liczby przesunięte względem siebie (nie w kolumnie, nie na osi);<\/li><li>gabaryt 80 najdalej od zarysu;<\/li><li>łańcuch otwarty: z wymiarów 30, 10, 40 podane najwyżej dwa (zwykle pomija się szerokość kołnierza 10 albo jeden skrajny) albo trzeci w nawiasie;<\/li><li>faza zapisem <code>1×45°<\/code> na półce linii odniesienia albo wymiarem 1 i kątem 45°;<\/li><li>linie wymiarowe cienkie, pomocnicze wysunięte, mniejsze wymiary bliżej zarysu, jeden rodzaj grotów.<\/li><\/ul><b>1 pkt:<\/b> komplet wymiarów, łańcuch otwarty, poprawne średnice i faza. <b>0,5 pkt:<\/b> zamknięty łańcuch (30 + 10 + 40 + 80) albo brak fazy lub jednej średnicy, przy poprawnej reszcie. <b>0 pkt:<\/b> brak średnic lub gabarytu, średnice jako promienie. <b>Typowe błędy:<\/b> kolumna liczb średnic, oś przecinająca liczby, kreski ukośne na końcach łańcucha.", "id": "q32", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#uklady-plan", "t": "07.11 · Plansza: wałek"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#prom-r4", "t": "07.11 · Faza 45°"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#kolo-r1", "t": "07.11 · Ø także w półwidoku"}], "partial": false}]}, {"id": "06_tolerancje-i-powierzchnia", "kind": "Dział 6", "title": "Tolerancje, pasowania i stan powierzchni", "desc": "Tolerancje wymiarów i obliczenia, zapis tolerancji, pasowania, tolerancje geometryczne i bazy, chropowatość, obróbka cieplna, powłoki, rysunek wykonawczy, MBD/PMI.", "intro": "Test sprawdza tolerowanie wymiarów (z obliczeniami wymiarów granicznych i tolerancji), pasowania, tolerancje geometryczne, oznaczanie chropowatości oraz zapis obróbki cieplnej i powłok. Odpowiedzi liczbowe podawaj w mm, chyba że polecenie mówi inaczej.", "tags": {"tol.wymiary": "Tolerowanie wymiarów i obliczenia", "tol.zapis": "Zapis tolerancji, klasy IT", "tol.pasowania": "Pasowania", "tol.geom": "Tolerancje geometryczne", "tol.bazy_ogolne": "Bazy i tolerancje ogólne", "tol.chropowatosc": "Chropowatość", "tol.obrobka_cieplna": "Obróbka cieplna", "tol.powloki": "Powłoki i modyfikacje powierzchni", "tol.wykonawczy": "Rysunek wykonawczy", "tol.model3d": "Model 3D: MBD, PMI"}, "questions": [{"type": "abc", "tag": "tol.wymiary", "q": "Szerokość rowka (wymiar między dwiema ściankami, materiał po obu stronach) tolerujemy odchyłkami. Jak oznacza się jego odchyłki górną i dolną?", "options": ["ES i EI, bo rowek jest wymiarem wewnętrznym (otworem)", "es i ei, bo rowek nie jest okrągły, więc nie jest otworem", "es i ei, bo jest to wymiar liniowy, a nie średnica", "ES i ei, bo górna granica dotyczy ścianki, a dolna dna rowka"], "answer": 0, "explain": "O „otworze” i „wałku” decyduje położenie materiału, a nie kształt: wymiar wewnętrzny (materiał na zewnątrz) to otwór, oznaczany dużymi literami ES, EI. Kojarzenie otworu wyłącznie ze średnicą to typowy błąd.", "id": "q01", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r1", "t": "07.11 · Wałek i otwór"}], "partial": false}, {"type": "multi", "tag": "tol.wymiary", "q": "Które zdania o wymiarach granicznych, odchyłkach i tolerancji są prawdziwe?", "options": ["Tolerancja to różnica wymiaru granicznego górnego i dolnego: T = B − A = ES − EI.", "Oba wymiary graniczne mogą być większe od wymiaru nominalnego.", "Linia zerowa (wymiar nominalny) nie musi przechodzić przez pole tolerancji.", "Wymiar nominalny zawsze leży między wymiarem granicznym dolnym a górnym.", "Odchyłka dolna jest zawsze ujemna, a górna zawsze dodatnia.", "Tolerancja może mieć wartość ujemną, gdy obie odchyłki są ujemne."], "answer": [0, 1, 2], "explain": "Pole tolerancji może leżeć całkowicie nad lub pod linią zerową (np. es = −10, ei = −30 µm), więc nominał nie musi leżeć między A i B, a odchyłki mogą mieć dowolne znaki. Tolerancja jest różnicą górnej i dolnej granicy, więc zawsze dodatnia.", "id": "q02", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r2", "t": "07.11 · A, B i T"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-plan", "t": "07.11 · Plansza: pola tolerancji"}], "partial": false}, {"type": "short", "tag": "tol.wymiary", "q": "Otwór <b>Ø30H7<\/b>: z tablic układu tolerancji odczytano ES = +21 µm, EI = 0 µm. Podaj <b>górny wymiar graniczny<\/b> otworu w mm.", "answer": ["30,021", "30,021 mm", "30,021mm", "30.021", "30.021 mm", "30.021mm", "Ø30,021", "fi30,021", "⌀30,021", "φ30,021"], "explain": "Odchyłki z tablic są w mikrometrach: +21 µm = +0,021 mm. B = N + ES = 30 + 0,021 = 30,021 mm (dolny A = 30,000 mm).", "id": "q03", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-r4", "t": "07.11 · Odczyt z układu"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}], "partial": false}, {"type": "short", "tag": "tol.wymiary", "q": "Wałek <b>Ø25g5<\/b>: es = −7 µm, ei = −16 µm. Podaj <b>dolny wymiar graniczny<\/b> wałka w mm.", "answer": ["24,984", "24,984 mm", "24,984mm", "24.984", "24.984 mm", "24.984mm", "Ø24,984", "fi24,984", "⌀24,984", "φ24,984"], "explain": "A = N + ei = 25 + (−0,016) = 24,984 mm; górny B = 25 − 0,007 = 24,993 mm. Obie odchyłki ujemne, więc oba wymiary graniczne są mniejsze od nominalnego.", "id": "q04", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-plan", "t": "07.11 · Plansza: pola tolerancji"}], "partial": false}, {"type": "short", "tag": "tol.wymiary", "q": "Wałek <b>Ø20p6<\/b>: es = +35 µm, ei = +22 µm. Podaj <b>tolerancję<\/b> wałka T<sub>w<\/sub> w mm.", "answer": ["0,013", "0,013 mm", "0,013mm", "0.013", "0.013 mm", "0.013mm", "13 µm", "13µm", "13 μm", "13μm", "13 um", "13um", "13 mikrometrów", "13 mikrometry"], "explain": "T<sub>w<\/sub> = es − ei = 0,035 − 0,022 = 0,013 mm. Typowy błąd to dodanie odchyłek (0,057) albo podanie samej odchyłki górnej.", "id": "q05", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r2", "t": "07.11 · A, B i T"}], "partial": false}, {"type": "short", "tag": "tol.wymiary", "q": "Wymiar zapisano jako <b>60 ±0,15<\/b>. Podaj tolerancję tego wymiaru w mm.", "answer": ["0,3", "0,3 mm", "0,3mm", "0.3", "0.3 mm", "0.3mm", "0,30", "0,30 mm", "0,30mm", "0.30", "0.30 mm", "0.30mm"], "explain": "Tolerowanie symetryczne: ES = +0,15, EI = −0,15, więc T = 0,15 − (−0,15) = 0,3 mm (wymiary graniczne 60,15 i 59,85).", "id": "q06", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-plan", "t": "07.11 · Plansza: zapisy wymiaru"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r2", "t": "07.11 · A, B i T"}], "partial": false}, {"type": "short", "tag": "tol.wymiary", "q": "Grubość płytki (wymiar zewnętrzny) zapisano jako <b>80<\/b> z odchyłkami <sup>+0,1<\/sup><sub>−0,25<\/sub>. Podaj <b>dolny wymiar graniczny<\/b> w mm.", "answer": ["79,75", "79,75 mm", "79,75mm", "79.75", "79.75 mm", "79.75mm", "79,750", "79,750 mm", "79,750mm", "79.750", "79.750 mm", "79.750mm"], "explain": "A = 80 + (−0,25) = 79,75 mm; B = 80,1 mm; T = 0,1 − (−0,25) = 0,35 mm. Odchyłka dolna stoi zawsze pod górną.", "id": "q07", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-plan", "t": "07.11 · Plansza: zapisy wymiaru"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}], "partial": false}, {"type": "abc", "tag": "tol.wymiary", "q": "Otwór o wymiarze nominalnym Ø40 ma wymiary graniczne 39,991 mm i 39,975 mm. Jakie są jego odchyłki?", "options": ["ES = −0,009 mm, EI = −0,025 mm", "ES = −0,025 mm, EI = −0,009 mm", "es = −0,009 mm, ei = −0,025 mm", "ES = +0,009 mm, EI = +0,025 mm"], "answer": 0, "explain": "ES = B − N = 39,991 − 40 = −0,009 mm, EI = A − N = 39,975 − 40 = −0,025 mm; dla otworu duże litery. Pole leży całe pod linią zerową, więc obie odchyłki są ujemne, a górna jest bliżej zera.", "id": "q08", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}], "partial": false}, {"type": "abc", "tag": "tol.zapis", "q": "Wałek o wymiarze nominalnym Ø12 ma mieć wymiary graniczne 12,000 mm i 11,982 mm. Który zapis odchyłek jest poprawny wg obecnych zasad?", "options": ["Ø12 <sup>0<\/sup><sub>−0,018<\/sub>", "Ø12 <sub>−0,018<\/sub> (odchyłki zerowej się nie pisze)", "Ø12 <sup>+0,018<\/sup><sub>0<\/sub>", "Ø12 ±0,009"], "answer": 0, "explain": "es = 12,000 − 12 = 0, ei = 11,982 − 12 = −0,018; odchyłkę równą zero obecnie zapisuje się jawnie jako 0. Zapis ±0,009 daje tę samą tolerancję 0,018, ale inne wymiary graniczne (12,009 i 11,991).", "id": "q09", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-r2", "t": "07.11 · Wysokość odchyłek"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-plan", "t": "07.11 · Plansza: zapisy wymiaru"}], "partial": false}, {"type": "multi", "tag": "tol.zapis", "q": "Które zdania o klasach dokładności IT i symbolach tolerancji (np. 20H7) są prawdziwe?", "options": ["Litera określa położenie pola tolerancji względem linii zerowej.", "Cyfra (klasa dokładności) określa szerokość pola tolerancji.", "Klasa IT14 daje większą tolerancję niż IT7 przy tym samym wymiarze nominalnym.", "Wyróżnia się 20 klas dokładności: 01, 0, 1, …, 18.", "Duże litery dotyczą wałków, a małe otworów.", "Im wyższy numer klasy, tym dokładniejsze wykonanie."], "answer": [0, 1, 2, 3], "explain": "Litera (położenie) i cyfra (szerokość pola) to dwie niezależne informacje. Klasy numeruje się w kierunku malejącej dokładności (01 najdokładniejsza, 18 najmniej), a duże litery oznaczają otwory.", "id": "q10", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-r1", "t": "07.11 · Litera i liczba"}], "partial": false}, {"type": "abc", "tag": "tol.zapis", "q": "Dla otworu Ø30H7 odczytano z tablic układu tolerancji odchyłki +0,021 / 0. Który zapis uznaje się za <b>błędny<\/b> według zasad zapisu przyjętych w tym kursie?", "options": ["Ø30 <sup>+0,021<\/sup><sub>0<\/sub> (same odchyłki liczbowo, bez symbolu)", "Ø30H7", "Ø30H7 <sup>(+0,021)<\/sup><sub>(0)<\/sub>", "Ø30H7 i odchyłki w tabelce „Wymiar / Odchyłka” nad tabliczką"], "answer": 0, "explain": "Odchyłek znormalizowanych z układu tolerancji nie wpisuje się jako zapisu liczbowego; dopuszczalny jest zapis symbolowy (z tabelką odchyłek) albo mieszany. Zapis liczbowy służy własnym odchyłkom konstruktora.", "id": "q11", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-r5", "t": "07.11 · Nie wpisywać z tabeli"}], "partial": false}, {"type": "long", "tag": "tol.wymiary", "pts": 1, "q": "Zadanie obliczeniowe. Otwór <b>Ø45H7<\/b>: z tablic ES = +25 µm, EI = 0 µm. Wałek <b>Ø45m6<\/b>: es = +25 µm, ei = +9 µm. a) Zapisz odchyłki obu elementów w mm z właściwymi oznaczeniami. b) Oblicz wymiary graniczne otworu i wałka. c) Oblicz tolerancję (szerokość pola tolerancji) otworu i wałka. d) Określ rodzaj pasowania Ø45H7/m6 i uzasadnij, porównując pola tolerancji.", "key": "<b>1 pkt:<\/b> poprawne a), b), c) z jednostkami i właściwym rodzajem pasowania z uzasadnieniem. <b>0,5 pkt:<\/b> poprawne wymiary graniczne i tolerancje, ale błąd w oznaczeniach (np. es/ei dla otworu), brak zamiany µm→mm w zapisie albo brak lub błędne uzasadnienie pasowania; albo jeden błąd rachunkowy przy poprawnej metodzie. <b>0 pkt:<\/b> błędna metoda (np. T jako suma odchyłek, odchyłki dodane w µm do mm) lub brak obliczeń. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>a) otwór: ES = +0,025 mm, EI = 0; wałek: es = +0,025 mm, ei = +0,009 mm (duże litery otwór, małe wałek; 1 µm = 0,001 mm)<\/li><li>b) otwór: B<sub>o<\/sub> = 45 + 0,025 = 45,025 mm, A<sub>o<\/sub> = 45,000 mm; wałek: B<sub>w<\/sub> = 45,025 mm, A<sub>w<\/sub> = 45,009 mm<\/li><li>c) T<sub>o<\/sub> = ES − EI = 0,025 mm; T<sub>w<\/sub> = es − ei = 0,016 mm<\/li><li>d) pola nachodzą na siebie (wałek 45,009…45,025 częściowo w polu otworu 45,000…45,025) → pasowanie <b>mieszane<\/b>: może wystąpić niewielki luz lub niewielki wcisk; układ stałego otworu (H)<\/li><li>(dodatkowo) luz maks. = B<sub>o<\/sub> − A<sub>w<\/sub> = 0,016 mm, wcisk maks. = B<sub>w<\/sub> − A<sub>o<\/sub> = 0,025 mm<\/li><\/ul>", "id": "q12", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r1", "t": "07.11 · Luz i wcisk"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r4", "t": "07.11 · Stały otwór i wałek"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}], "partial": false}, {"type": "abc", "tag": "tol.pasowania", "q": "Otwór Ø25H7 ma odchyłki +21 / 0 µm, wałek Ø25n6 ma odchyłki +28 / +15 µm. Jakie to pasowanie?", "options": ["mieszane", "ciasne", "luźne", "nie da się ustalić bez wymiarów rzeczywistych"], "answer": 0, "explain": "Pole otworu (0…+21) i pole wałka (+15…+28) nachodzą na siebie, więc zależnie od wymiarów rzeczywistych powstanie niewielki luz albo niewielki wcisk. Pasowanie ciasne wymagałoby, by dolna granica wałka (+15) leżała nad górną granicą otworu (+21).", "id": "q13", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r1", "t": "07.11 · Luz i wcisk"}], "partial": false}, {"type": "abc", "tag": "tol.pasowania", "q": "Rysunek przedstawia pola tolerancji otworu i wałka o tym samym wymiarze nominalnym. Jakie to pasowanie?", "svg": "<svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"Pola tolerancji otworu i wałka względem linii zerowej: pole otworu zaczyna się na linii zerowej i leży nad nią, pole wałka leży w całości pod linią zerową.\"><line class=\"ax\" x1=\"20.0\" y1=\"120.0\" x2=\"340.0\" y2=\"120.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"24.0\" y=\"114.0\" text-anchor=\"start\" style=\"font-size:11px\">linia zerowa<\/text><text class=\"\" x=\"330.0\" y=\"90.0\" text-anchor=\"middle\" style=\"font-size:13px\">+<\/text><text class=\"\" x=\"330.0\" y=\"156.0\" text-anchor=\"middle\" style=\"font-size:13px\">−<\/text><rect class=\"sh\" x=\"130.0\" y=\"76.0\" width=\"70.0\" height=\"44.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.0\" y1=\"78.0\" x2=\"132.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"130.0\" y1=\"86.0\" x2=\"140.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"130.0\" y1=\"94.0\" x2=\"148.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"130.0\" y1=\"102.0\" x2=\"156.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"130.0\" y1=\"110.0\" x2=\"164.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"130.0\" y1=\"118.0\" x2=\"172.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"136.0\" y1=\"120.0\" x2=\"180.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"144.0\" y1=\"120.0\" x2=\"188.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"152.0\" y1=\"120.0\" x2=\"196.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"160.0\" y1=\"120.0\" x2=\"200.0\" y2=\"80.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"168.0\" y1=\"120.0\" x2=\"200.0\" y2=\"88.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"176.0\" y1=\"120.0\" x2=\"200.0\" y2=\"96.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"184.0\" y1=\"120.0\" x2=\"200.0\" y2=\"104.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"192.0\" y1=\"120.0\" x2=\"200.0\" y2=\"112.0\" style=\"stroke-width:.8\"/><text class=\"\" x=\"165.0\" y=\"68.0\" text-anchor=\"middle\" style=\"font-size:13px\">otwór<\/text><rect class=\"sh\" x=\"225.0\" y=\"134.0\" width=\"70.0\" height=\"30.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"294.0\" y1=\"134.0\" x2=\"295.0\" y2=\"135.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"286.0\" y1=\"134.0\" x2=\"295.0\" y2=\"143.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"278.0\" y1=\"134.0\" x2=\"295.0\" y2=\"151.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"270.0\" y1=\"134.0\" x2=\"295.0\" y2=\"159.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"262.0\" y1=\"134.0\" x2=\"292.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"254.0\" y1=\"134.0\" x2=\"284.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"246.0\" y1=\"134.0\" x2=\"276.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"238.0\" y1=\"134.0\" x2=\"268.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"230.0\" y1=\"134.0\" x2=\"260.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"225.0\" y1=\"137.0\" x2=\"252.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"225.0\" y1=\"145.0\" x2=\"244.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"225.0\" y1=\"153.0\" x2=\"236.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"225.0\" y1=\"161.0\" x2=\"228.0\" y2=\"164.0\" style=\"stroke-width:.8\"/><text class=\"\" x=\"260.0\" y=\"182.0\" text-anchor=\"middle\" style=\"font-size:13px\">wałek<\/text><\/svg>", "options": ["luźne, w układzie stałego otworu", "luźne, w układzie stałego wałka", "ciasne, w układzie stałego otworu", "mieszane, w układzie stałego otworu"], "answer": 0, "explain": "Pole wałka leży w całości pod polem otworu, więc zawsze jest luz (pasowanie luźne). Pole otworu zaczyna się na linii zerowej (EI = 0, otwór H), czyli jest to układ stałego otworu; w układzie stałego wałka na linii zerowej kończyłoby się pole wałka (h).", "id": "q14", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r1", "t": "07.11 · Luz i wcisk"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r4", "t": "07.11 · Stały otwór i wałek"}], "partial": false}, {"type": "abc", "tag": "tol.pasowania", "q": "W zapisie pasowania <b>Ø40H7/d8<\/b> cyfra <b>8<\/b> oznacza:", "options": ["klasę dokładności wałka", "klasę dokładności otworu", "położenie pola tolerancji wałka", "tolerancję wałka równą 8 µm"], "answer": 0, "explain": "Najpierw podaje się tolerancję otworu (H = położenie pola, 7 = klasa), po kresce tolerancję wałka (d = położenie pola, 8 = klasa dokładności). Wartość tolerancji odczytuje się z tablic, cyfra jej nie podaje wprost.", "id": "q15", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-r1", "t": "07.11 · Litera i liczba"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r2", "t": "07.11 · Zapis pasowania"}], "partial": false}, {"type": "abc", "tag": "tol.pasowania", "q": "Gdzie poprawnie podaje się pasowanie, np. Ø20H7/g6?", "options": ["na rysunku złożeniowym (zespołu); na rysunku wykonawczym części podaje się tylko Ø20H7 albo tylko Ø20g6", "na rysunku wykonawczym obu części, żeby wykonawca znał partnera współpracy", "tylko w tabelce odchyłek nad tabliczką rysunkową", "na rysunku wykonawczym otworu, a na rysunku wykonawczym wałka sam wymiar nominalny"], "answer": 0, "explain": "Pasowanie opisuje współpracę dwóch części, więc należy do rysunku zespołu. Na rysunku wykonawczym każda część dostaje tylko własną tolerancję, a podanie tam pasowania jest błędem.", "id": "q16", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r3", "t": "07.11 · Pasowanie tylko w zespole"}], "partial": false}, {"type": "long", "tag": "tol.pasowania", "pts": 1, "q": "Scharakteryzuj pasowania: czym jest pasowanie, jakie są jego rodzaje (z położeniem pól tolerancji), czym różni się zasada stałego otworu od zasady stałego wałka i która jest częściej stosowana. Podaj przykład zapisu pasowania i wskaż, na jakim rysunku się go umieszcza.", "key": "<b>1 pkt:<\/b> definicja, trzy rodzaje z poprawnym opisem położenia pól, obie zasady z literą H/h, uzasadnienie wyboru stałego otworu oraz poprawny zapis i miejsce (rysunek złożeniowy). <b>0,5 pkt:<\/b> poprawne rodzaje pasowań i zasady, ale brak położenia pól lub uzasadnienia, albo błąd w zapisie/miejscu (np. pasowanie na rysunku wykonawczym). <b>0 pkt:<\/b> pomylone rodzaje (np. mieszane = zawsze wcisk) lub brak zasad stałego otworu/wałka. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>pasowanie = połączenie dwóch elementów o tym samym wymiarze nominalnym i różnych odchyłkach (otwór i wałek)<\/li><li>luźne: zawsze luz, pole otworu w całości nad polem wałka (A<sub>o<\/sub> &gt; B<sub>w<\/sub>), elementy mogą się przemieszczać<\/li><li>ciasne: zawsze wcisk, pole wałka w całości nad polem otworu (B<sub>o<\/sub> &lt; A<sub>w<\/sub>), elementy pozostają w spoczynku<\/li><li>mieszane: pola się nakładają, niewielki luz lub niewielki wcisk zależnie od wymiarów rzeczywistych<\/li><li>stały otwór: otwór H (EI = 0), różne pasowania przez dobór wałka; stały wałek: wałek h (es = 0), dobiera się otwór<\/li><li>częściej stały otwór, bo otwór trudniej obrabiać; otwór zwykle o klasę mniej dokładny, np. H7/g6<\/li><li>zapis: Ø20H7/g6 (otwór pierwszy), także w postaci ułamka (otwór nad kreską) lub osobno z numerami elementów; tylko na rysunku złożeniowym, na wykonawczym sama tolerancja części<\/li><li>pasowania uprzywilejowane (wyróżnione w tablicach) dobiera się z gotowych tabel<\/li><\/ul>", "id": "q17", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-po", "t": "07.11 · Czym jest pasowanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r1", "t": "07.11 · Luz i wcisk"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r2", "t": "07.11 · Zapis pasowania"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r3", "t": "07.11 · Pasowanie tylko w zespole"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r4", "t": "07.11 · Stały otwór i wałek"}], "partial": false}, {"type": "multi", "tag": "tol.geom", "q": "Które tolerancje geometryczne <b>wymagają<\/b> podania elementu odniesienia (bazy) w ramce?", "options": ["równoległość", "bicie obwodowe", "współosiowość", "prostopadłość", "płaskość", "walcowość"], "answer": [0, 1, 2, 3], "explain": "Tolerancje kształtu (prostoliniowość, płaskość, okrągłość, walcowość) mierzy się w samym elemencie, bez bazy. Tolerancje kierunku, położenia i bicia zawsze odnoszą się do bazy.", "id": "q18", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo-r1", "t": "07.11 · Symbole i rodzaje"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r2", "t": "07.11 · Znak bazy"}], "partial": false}, {"type": "abc", "tag": "tol.geom", "q": "Jaką tolerancję geometryczną zapisano w ramce?", "svg": "<svg viewBox=\"0 0 200 84\" role=\"img\" aria-label=\"Ramka tolerancji geometrycznej z dwoma polami: symbol i wartość 0,01, bez pola bazy.\"><rect class=\"sh\" x=\"40.0\" y=\"30.0\" width=\"34.0\" height=\"24.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"57.0\" cy=\"42.0\" r=\"5.5\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"46.2\" y1=\"47.3\" x2=\"56.2\" y2=\"30.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"57.8\" y1=\"54.0\" x2=\"67.8\" y2=\"36.7\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"74.0\" y=\"30.0\" width=\"54.0\" height=\"24.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"101.0\" y=\"47.0\" text-anchor=\"middle\" style=\"font-size:13px\">0,01<\/text><\/svg>", "options": ["walcowość", "okrągłość", "współosiowość", "bicie obwodowe"], "answer": 0, "explain": "Okrąg z dwiema równoległymi ukośnymi kreskami to symbol walcowości (tolerancja kształtu, stąd brak pola bazy). Okrągłość to sam okrąg, współosiowość dwa okręgi współśrodkowe i wymaga bazy.", "id": "q19", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo-r1", "t": "07.11 · Symbole i rodzaje"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#fa-geo", "t": "07.11 · Tolerancje geometryczne: symbole"}], "partial": false}, {"type": "abc", "tag": "tol.geom", "q": "Jak należy odczytać przedstawioną ramkę tolerancji?", "svg": "<svg viewBox=\"0 0 220 84\" role=\"img\" aria-label=\"Ramka tolerancji geometrycznej z czterema polami: symbol okręgu z krzyżem, wartość Ø0,1, litera A, litera B.\"><rect class=\"sh\" x=\"30.0\" y=\"30.0\" width=\"34.0\" height=\"24.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"47.0\" cy=\"42.0\" r=\"5.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"38.0\" y1=\"42.0\" x2=\"56.0\" y2=\"42.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"47.0\" y1=\"33.0\" x2=\"47.0\" y2=\"51.0\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"64.0\" y=\"30.0\" width=\"66.0\" height=\"24.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"97.0\" y=\"47.0\" text-anchor=\"middle\" style=\"font-size:13px\">Ø0,1<\/text><rect class=\"sh\" x=\"130.0\" y=\"30.0\" width=\"30.0\" height=\"24.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"145.0\" y=\"47.0\" text-anchor=\"middle\" style=\"font-size:13px\">A<\/text><rect class=\"sh\" x=\"160.0\" y=\"30.0\" width=\"30.0\" height=\"24.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"175.0\" y=\"47.0\" text-anchor=\"middle\" style=\"font-size:13px\">B<\/text><\/svg>", "options": ["tolerancja pozycji, pole kołowe o średnicy 0,1 mm; A to baza główna, B drugorzędna", "tolerancja pozycji 0,1 mm względem wspólnej bazy utworzonej przez A i B", "tolerancja współosiowości o promieniu 0,1 mm; A i B są równorzędne", "tolerancja pozycji 0,1 mm; B to baza główna, bo stoi bliżej końca ramki"], "answer": 0, "explain": "Okrąg z krzyżem to pozycja, Ø przed wartością oznacza pole kołowe (średnicowe). Bazy w osobnych polach czyta się w kolejności: trzecie pole baza główna, czwarte drugorzędna; wspólną bazę zapisuje się w jednym polu jako A-B.", "id": "q20", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo-r2", "t": "07.11 · Pola ramki"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r3", "t": "07.11 · Kilka baz"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r6", "t": "07.11 · Dodatkowe znaki"}], "partial": false}, {"type": "abc", "tag": "tol.geom", "q": "Do czego odnosi się tolerancja z ramki na rysunku?", "svg": "<svg viewBox=\"0 0 320 200\" role=\"img\" aria-label=\"Wałek w widoku z osią. Średnica Ø40 zwymiarowana z lewej strony, poza zarysem, na liniach pomocniczych. Nad wymiarem ramka tolerancji; linia łącząca z ramki biegnie pionowo w dół na przedłużeniu linii wymiarowej i kończy się grotem przy grocie wymiaru, z dala od zarysu wałka.\"><line class=\"sh\" x1=\"150.0\" y1=\"90.0\" x2=\"290.0\" y2=\"90.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"150.0\" y1=\"170.0\" x2=\"290.0\" y2=\"170.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"150.0\" y1=\"90.0\" x2=\"150.0\" y2=\"170.0\" style=\"stroke-width:2.6\"/><path class=\"ax\" d=\"M290.0,90.0 Q286.0,100.0 290.0,110.0 Q294.0,120.0 290.0,130.0 Q286.0,140.0 290.0,150.0 Q294.0,160.0 290.0,170.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"132.0\" y1=\"130.0\" x2=\"308.0\" y2=\"130.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"146.0\" y1=\"90.0\" x2=\"94.0\" y2=\"90.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"146.0\" y1=\"170.0\" x2=\"94.0\" y2=\"170.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"100.0\" y1=\"90.0\" x2=\"100.0\" y2=\"170.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"100.0,90.0 102.8,100.0 97.2,100.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"100.0,170.0 97.2,160.0 102.8,160.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"94.0\" y=\"130.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 94.0 130.0)\">Ø40<\/text><rect class=\"sh\" x=\"118.0\" y=\"24.0\" width=\"30.0\" height=\"24.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"125.0\" y1=\"43.0\" x2=\"141.0\" y2=\"43.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"133.0\" y1=\"43.0\" x2=\"133.0\" y2=\"28.0\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"148.0\" y=\"24.0\" width=\"56.0\" height=\"24.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"176.0\" y=\"41.0\" text-anchor=\"middle\" style=\"font-size:13px\">Ø0,1<\/text><rect class=\"sh\" x=\"204.0\" y=\"24.0\" width=\"26.0\" height=\"24.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"217.0\" y=\"41.0\" text-anchor=\"middle\" style=\"font-size:13px\">A<\/text><line class=\"ax\" x1=\"118.0\" y1=\"36.0\" x2=\"100.0\" y2=\"36.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"100.0\" y1=\"36.0\" x2=\"100.0\" y2=\"90.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"100.0,90.0 97.2,80.0 102.8,80.0\" style=\"fill:var(--mu)\"/><\/svg>", "options": ["do osi wałka", "do powierzchni walcowej (tworzącej) wałka", "do górnej krawędzi zarysu wałka", "do lewej płaszczyzny czołowej wałka"], "answer": 0, "explain": "Linia łącząca zakończona na przedłużeniu linii wymiarowej (grot przy grocie wymiaru Ø40) wskazuje oś lub płaszczyznę symetrii elementu. Gdyby tolerancja dotyczyła powierzchni, strzałka stałaby na zarysie wyraźnie odsunięta od linii wymiarowej; Ø przed wartością oznacza walcowe pole tolerancji osi.", "id": "q21", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r1", "t": "07.11 · Wymiar a zarys"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-po", "t": "07.11 · Gdzie strzałka i baza"}], "partial": false}, {"type": "multi", "tag": "tol.bazy_ogolne", "q": "Które zasady oznaczania elementów odniesienia (baz) są poprawne?", "options": ["Bazę oznacza się wielką literą w kwadratowej ramce połączoną z zaczernionym trójkątem.", "Wspólną bazę utworzoną przez dwa elementy zapisuje się w jednym polu ramki jako A-B.", "Do oznaczania baz nie używa się liter I, O, Q, R, X.", "Bazą może być tylko powierzchnia płaska, nigdy oś.", "Litery baz wpisuje się w ramce w kolejności odwrotnej do alfabetycznej.", "Litera bazy wpisana w ramce tolerancji stoi zawsze w drugim polu."], "answer": [0, 1, 2], "explain": "Bazą może być też oś (trójkąt przy grocie linii wymiarowej średnicy), a litery baz w osobnych polach podaje się w kolejności alfabetycznej (główna, drugorzędna). Bazy wpisuje się w trzecim i kolejnych polach; drugie pole zawiera wartość tolerancji.", "id": "q22", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r2", "t": "07.11 · Znak bazy"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r3", "t": "07.11 · Kilka baz"}], "partial": false}, {"type": "abc", "tag": "tol.bazy_ogolne", "q": "W wymaganiach technicznych nad tabliczką rysunkową zapisano <b>ISO 2768-m<\/b>. Co to oznacza?", "options": ["wymiary bez podanych odchyłek mają tolerancje ogólne wg ISO 2768 w klasie średnio dokładnej", "wszystkie wymiary na rysunku podano w milimetrach", "tolerancje ogólne w klasie dokładnej (m od „maksymalna dokładność”)", "chropowatość pozostałych powierzchni wg ISO 2768, wartość średnia"], "answer": 0, "explain": "ISO 2768 narzuca tolerancje ogólne wymiarom, którym nie podano tolerancji. Klasy to f (dokładna), m (średnio dokładna), c (zgrubna), v (bardzo zgrubna); najczęściej stosuje się m.", "id": "q23", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r5", "t": "07.11 · Tolerancje ogólne"}], "partial": false}, {"type": "sketch", "tag": "tol.geom", "pts": 1, "q": "Naszkicuj przekrój płytki o grubości 20 mm z przelotowym otworem Ø20H7 prostopadłym do dolnej powierzchni. Dolną powierzchnię oznacz jako bazę A i podaj dla niej tolerancję płaskości 0,02. Podaj tolerancję prostopadłości <b>osi otworu<\/b> 0,05 względem bazy A. Zwymiaruj średnicę otworu.", "key": "Musi być: <ul><li>przekrój z kreskowaniem pod 45° (cienką linią), otwór niekreskowany, oś otworu cienką linią punktową wysuniętą poza zarys<\/li><li>wymiar Ø20H7 z liniami pomocniczymi i grotami<\/li><li>baza A: wielka litera A w kwadratowej ramce połączona z zaczernionym trójkątem stojącym na zarysie dolnej powierzchni (lub jej przedłużeniu), odsuniętym od linii wymiarowych<\/li><li>ramka płaskości: równoległobok | 0,02, <b>bez bazy<\/b>; strzałka na zarysie dolnej powierzchni, odsunięta od linii wymiarowej<\/li><li>ramka prostopadłości: ⊥ | 0,05 (dopuszczalnie Ø0,05) | A; linia łącząca zakończona strzałką na <b>przedłużeniu linii wymiarowej Ø20H7<\/b> (oś otworu)<\/li><\/ul><b>1 pkt:<\/b> wszystkie elementy. <b>0,5 pkt:<\/b> poprawne ramki i baza, ale jeden błąd wskazania (np. prostopadłość wskazana na tworzącą otworu) lub brak kreskowania/osi. <b>0 pkt:<\/b> płaskość z bazą, brak bazy przy prostopadłości albo pomylone symbole. Typowe błędy: strzałka prostopadłości na ściance otworu zamiast na wymiarze, pusty trójkąt bazy, ramka połączona z trójkątem bazy, oś zakończona na zarysie.", "id": "q24", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-r2", "t": "07.11 · Znak bazy"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo2-po", "t": "07.11 · Gdzie strzałka i baza"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#geo-r2", "t": "07.11 · Pola ramki"}], "partial": false}, {"type": "abc", "tag": "tol.chropowatosc", "q": "Co oznacza zapis <b>Ra 1,6<\/b> przy symbolu chropowatości?", "options": ["średnie arytmetyczne odchylenie profilu od linii średniej nie może przekroczyć 1,6 µm", "średnie arytmetyczne odchylenie profilu od linii średniej ma wynosić dokładnie 1,6 µm", "największa wysokość profilu nie może przekroczyć 1,6 µm", "średnie arytmetyczne odchylenie profilu nie może przekroczyć 1,6 mm"], "answer": 0, "explain": "Ra to średnia z wartości bezwzględnych odchyleń profilu od linii średniej; na rysunku podaje się ją w mikrometrach (bez zamiany na mm) jako górną granicę, a nie wartość do „trafienia”.", "id": "q25", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r5", "t": "07.11 · Falistość i Ra"}], "partial": false}, {"type": "abc", "tag": "tol.chropowatosc", "q": "Który symbol oznacza, że <b>wymagane jest usunięcie materiału<\/b> (np. obróbka skrawaniem)?", "options": ["<svg viewBox=\"0 0 130 70\" role=\"img\" aria-label=\"Symbol chropowatości: symbol V zamknięty poziomą kreską, z półką i zapisem Ra 3,2.\"><line class=\"sh\" x1=\"30.0\" y1=\"62.0\" x2=\"18.5\" y2=\"42.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"30.0\" y1=\"62.0\" x2=\"54.2\" y2=\"20.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"54.2\" y1=\"20.0\" x2=\"100.2\" y2=\"20.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"15.5\" y1=\"35.0\" x2=\"35.5\" y2=\"35.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"18.5\" y1=\"42.0\" x2=\"41.5\" y2=\"42.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"58.2\" y=\"34.0\" text-anchor=\"start\" style=\"font-size:12px\">Ra 3,2<\/text><\/svg>", "<svg viewBox=\"0 0 130 70\" role=\"img\" aria-label=\"Symbol chropowatości: goły symbol V, z półką i zapisem Ra 3,2.\"><line class=\"sh\" x1=\"30.0\" y1=\"62.0\" x2=\"18.5\" y2=\"42.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"30.0\" y1=\"62.0\" x2=\"54.2\" y2=\"20.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"54.2\" y1=\"20.0\" x2=\"100.2\" y2=\"20.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"15.5\" y1=\"35.0\" x2=\"35.5\" y2=\"35.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"58.2\" y=\"34.0\" text-anchor=\"start\" style=\"font-size:12px\">Ra 3,2<\/text><\/svg>", "<svg viewBox=\"0 0 130 70\" role=\"img\" aria-label=\"Symbol chropowatości: symbol V z wpisanym okręgiem, z półką i zapisem Ra 3,2.\"><line class=\"sh\" x1=\"30.0\" y1=\"62.0\" x2=\"18.5\" y2=\"42.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"30.0\" y1=\"62.0\" x2=\"54.2\" y2=\"20.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"54.2\" y1=\"20.0\" x2=\"100.2\" y2=\"20.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"15.5\" y1=\"35.0\" x2=\"35.5\" y2=\"35.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"30.0\" cy=\"48.7\" r=\"6.7\" style=\"stroke-width:1\"/><text class=\"\" x=\"58.2\" y=\"34.0\" text-anchor=\"start\" style=\"font-size:12px\">Ra 3,2<\/text><\/svg>"], "answer": 0, "explain": "Kreska zamykająca V oznacza wymagane usunięcie warstwy materiału. Goły V dopuszcza dowolny sposób wytwarzania, a V z okręgiem zabrania usuwania materiału (np. nagniatanie).", "id": "q26", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r3", "t": "07.11 · Rodzaje symbolu"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pow-r3", "t": "08.11 · Symbol nie narzuca obróbki"}], "partial": false}, {"type": "short", "tag": "tol.chropowatosc", "q": "Na rysunku wykonawczym oznaczono powierzchnie wartościami Ra 0,8, Ra 1,6 i Ra 6,3. Jaką wartość Ra podaje się w oznaczeniu zbiorczym dla pozostałych powierzchni? (sama liczba w µm)", "answer": ["12,5", "12.5", "Ra 12,5", "Ra12,5", "Ra 12.5", "12,5 µm", "12,5 μm", "12,5μm", "12,5 um", "12,5um", "12,5 mikrometra"], "explain": "Bierze się kolejną, gorszą wartość z szeregu Ra po największej użytej: …3,2; 6,3; 12,5. Wartość 12,6 (podwojenie 6,3) nie należy do szeregu.", "id": "q27", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r4", "t": "07.11 · Pozostałe powierzchnie"}], "partial": false}, {"type": "abc", "tag": "tol.chropowatosc", "q": "Nad tabliczką rysunkową zapisano: symbol z <b>Ra 12,5<\/b>, a obok w nawiasie okrągłym sam symbol chropowatości. Co to oznacza?", "options": ["powierzchnie nieoznaczone na rysunku mają Ra 12,5, a na rysunku są też powierzchnie z innymi wartościami", "wszystkie powierzchnie przedmiotu, także oznaczone na rysunku, mają Ra 12,5", "Ra 12,5 to wartość zalecana, a nawias oznacza, że wymaganie jest opcjonalne", "symbol w nawiasie wskazuje, że wartość 12,5 podano w mm, a nie w µm"], "answer": 0, "explain": "Nawias z symbolem informuje, że na rysunku występują jeszcze inne wartości chropowatości, a Ra 12,5 dotyczy pozostałych powierzchni. Bez nawiasu zapis rozumiano by jako obowiązujący wszystkie powierzchnie.", "id": "q28", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r4", "t": "07.11 · Pozostałe powierzchnie"}], "partial": false}, {"type": "abc", "tag": "tol.chropowatosc", "q": "Co jest źle na rysunku?", "svg": "<svg viewBox=\"0 0 360 200\" role=\"img\" aria-label=\"Przedmiot prostokątny w widoku. Symbol Ra 3,2 stoi na górnej krawędzi nad zarysem. Symbol Ra 1,6 stoi na półce linii odniesienia zakończonej strzałką na lewej krawędzi. Symbol Ra 6,3 dotyka wierzchołkiem dolnej krawędzi i leży wewnątrz zarysu przedmiotu.\"><rect class=\"sh\" x=\"120.0\" y=\"70.0\" width=\"200.0\" height=\"100.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"200.0\" y1=\"70.0\" x2=\"188.5\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"200.0\" y1=\"70.0\" x2=\"224.2\" y2=\"28.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"224.2\" y1=\"28.0\" x2=\"270.2\" y2=\"28.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"185.5\" y1=\"43.0\" x2=\"205.5\" y2=\"43.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"188.5\" y1=\"50.0\" x2=\"211.5\" y2=\"50.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"228.2\" y=\"42.0\" text-anchor=\"start\" style=\"font-size:12px\">Ra 3,2<\/text><line class=\"ax\" x1=\"120.0\" y1=\"120.0\" x2=\"70.0\" y2=\"60.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"120.0,120.0 111.4,114.1 115.7,110.5\" style=\"fill:var(--mu)\"/><line class=\"ax\" x1=\"70.0\" y1=\"60.0\" x2=\"20.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"36.0\" y1=\"60.0\" x2=\"24.5\" y2=\"40.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"36.0\" y1=\"60.0\" x2=\"60.2\" y2=\"18.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"60.2\" y1=\"18.0\" x2=\"106.2\" y2=\"18.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"21.5\" y1=\"33.0\" x2=\"41.5\" y2=\"33.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"24.5\" y1=\"40.0\" x2=\"47.5\" y2=\"40.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"64.2\" y=\"32.0\" text-anchor=\"start\" style=\"font-size:12px\">Ra 1,6<\/text><line class=\"sh\" x1=\"230.0\" y1=\"170.0\" x2=\"218.5\" y2=\"150.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"230.0\" y1=\"170.0\" x2=\"254.2\" y2=\"128.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"254.2\" y1=\"128.0\" x2=\"300.2\" y2=\"128.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"215.5\" y1=\"143.0\" x2=\"235.5\" y2=\"143.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"218.5\" y1=\"150.0\" x2=\"241.5\" y2=\"150.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"258.2\" y=\"142.0\" text-anchor=\"start\" style=\"font-size:12px\">Ra 6,3<\/text><\/svg>", "options": ["symbol Ra 6,3 stoi po stronie materiału (wewnątrz zarysu)", "symbolu nie wolno stawiać bezpośrednio na linii zarysu, jak przy Ra 3,2", "wartość parametru powinna stać nad półką symbolu, a nie pod nią", "chropowatości nie wolno podawać na linii odniesienia ze strzałką, jak przy Ra 1,6"], "answer": 0, "explain": "Symbol stoi po stronie zewnętrznej (powietrza), a wierzchołkiem dotyka powierzchni od zewnątrz; symbol po stronie materiału jest błędem. Bezpośrednie postawienie na zarysie i linia odniesienia ze strzałką są poprawne, a zapis pod półką to obecna zasada.", "id": "q29", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r1", "t": "07.11 · Położenie symbolu"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r1d", "t": "07.11 · Dwa położenia"}], "partial": false}, {"type": "abc", "tag": "tol.chropowatosc", "q": "Symbol kierunkowości struktury powierzchni <b>C<\/b> oznacza strukturę:", "options": ["jednokierunkową współśrodkową (okręgi), np. po toczeniu czołowym", "wielokierunkową promieniową, np. po szlifowaniu czołowym", "wielokierunkową skrzyżowaną, np. po dogładzaniu", "wielokierunkową nieuporządkowaną, np. po docieraniu"], "answer": 0, "explain": "C to ślady w postaci okręgów współśrodkowych (toczenie lub frezowanie czołowe). Struktura promieniowa (rozeta od środka) ma symbol R, skrzyżowana X, a nieuporządkowana M.", "id": "q30", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r3", "t": "07.11 · Rodzaje symbolu"}], "partial": true}, {"type": "sketch", "tag": "tol.chropowatosc", "pts": 1, "q": "Bez rysowania przedmiotu naszkicuj: a) symbol chropowatości, który wymaga usunięcia materiału, z wartością Ra 1,6; b) symbol, który zabrania usuwania materiału, z wartością Ra 0,8; c) oznaczenie zbiorcze nad tabliczką dla rysunku, na którym poza powierzchniami z a) i b) występują inne powierzchnie (dobierz ich wartość według reguły szeregu Ra).", "key": "Musi być: <ul><li>a) V o ramionach pod 60° do poziomu, lewe ramię krótsze, z poziomą kreską zamykającą (trójkąt), półka na prawym ramieniu; „Ra 1,6” <b>pod półką<\/b><\/li><li>b) V z okręgiem wpisanym między ramiona, półka, „Ra 0,8” pod półką<\/li><li>c) symbol z <b>Ra 3,2<\/b> (kolejna wartość szeregu po największej użytej 1,6), a obok <b>w nawiasie okrągłym<\/b> sam symbol (lub wypisane wyjątki Ra 1,6 i Ra 0,8)<\/li><li>linie cienkie, zapis „Ra”, spacja, wartość, bez jednostki (µm z definicji)<\/li><\/ul><b>1 pkt:<\/b> wszystkie trzy poprawnie. <b>0,5 pkt:<\/b> a) i b) poprawne, ale w c) brak nawiasu lub zła wartość (np. 12,5 albo 1,6), albo wartość nad półką (stary zapis). <b>0 pkt:<\/b> pomylone symbole a) i b). Typowe błędy: wartość w mm (0,0016), zapis bez nawiasu przy oznaczeniu zbiorczym, wartość 6,4 zamiast 6,3.", "id": "q31", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r3", "t": "07.11 · Rodzaje symbolu"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r4", "t": "07.11 · Pozostałe powierzchnie"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r1", "t": "07.11 · Położenie symbolu"}], "partial": false}, {"type": "abc", "tag": "tol.obrobka_cieplna", "q": "Jaką linią zaznacza się na rysunku obszar powierzchni poddanej obróbce cieplnej (np. hartowaniu)?", "options": ["grubą punktową (kreska–kropka), równolegle do zarysu", "cienką punktową (kreska–kropka), równolegle do zarysu", "grubą kreskową, równolegle do zarysu", "cienką ciągłą z kreskowaniem obszaru"], "answer": 0, "explain": "Obróbkę cieplną i powłoki zaznacza się linią grubą punktową przy wskazanej powierzchni. Cienka punktowa to oś lub płaszczyzna symetrii, a gruba kreskowa nie ma tego zastosowania.", "id": "q32", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#ciepl-r2", "t": "07.11 · Zapis na rysunku"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pow-r1", "t": "08.11 · Zapis jak obróbka cieplna"}], "partial": false}, {"type": "multi", "tag": "tol.obrobka_cieplna", "q": "Na półce linii odniesienia wskazującej grubą linię punktową zapisano <b>h 0,8±0,1 ; 40±2 HRC<\/b>. Które zdania są prawdziwe?", "options": ["h 0,8±0,1 to głębokość (grubość) warstwy obrabianej w mm.", "40±2 HRC to wymagana twardość warstwy w skali Rockwella.", "Zakres twardości podaje się wąski (kilka jednostek), a nie największą twardość z tablic materiału.", "h 0,8±0,1 to wysokość chropowatości po obróbce w µm.", "Bez nazwy obróbki (np. „hartować”) zapis jest niepełny i niedopuszczalny.", "Zapis ten musi stać w tabelce odchyłek, a nie na linii odniesienia."], "answer": [0, 1, 2], "explain": "Kolejność informacji: (nazwa obróbki – opcjonalnie), głębokość warstwy h w mm, twardość z zakresem (HRC, HV lub HB). Nazwę obróbki można dodać, ale zwykle podaje się tylko h i twardość; zapis może też stać w wymaganiach technicznych pod literą.", "id": "q33", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#ciepl-r1", "t": "07.11 · Zakres twardości"}], "partial": false}, {"type": "abc", "tag": "tol.powloki", "q": "Na linii odniesienia przy grubej linii punktowej zapisano powłokę <b>Fe/Zn5/F<\/b>. Co oznacza człon <b>Zn5<\/b>?", "options": ["powłokę cynkową o grubości 5 µm", "powłokę cynkową w klasie twardości 5", "stop żelaza z 5% cynku jako materiał podłoża", "piąty zabieg cynkowania w procesie"], "answer": 0, "explain": "Fe to materiał podłoża (stal), Zn5 to powłoka cynkowa o grubości 5 µm. Zamiast pełnego zapisu na linii odniesienia można dać literę (np. A) i opis „Powłoka A – Fe/Zn5/F” w wymaganiach technicznych.", "id": "q34", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pow-plan", "t": "08.11 · Plansza: wałek z powłoką"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pow-r1", "t": "08.11 · Zapis jak obróbka cieplna"}], "partial": false}, {"type": "multi", "tag": "tol.wykonawczy", "q": "Co zamieszcza się na rysunku wykonawczym części (np. wału)?", "options": ["wymiary z tolerancjami i tabelkę odchyłek dla wymiarów zapisanych symbolowo", "oznaczenia chropowatości z oznaczeniem zbiorczym dla pozostałych powierzchni", "tolerancje geometryczne z oznaczonymi bazami", "wymagania techniczne, np. twardość, ISO 2768-m, „ostre krawędzie zatępić”", "pasowania współpracujących części, np. Ø40H7/k6", "wykaz części zespołu z numerami pozycji"], "answer": [0, 1, 2, 3], "explain": "Rysunek wykonawczy opisuje jedną część: kształt, wymiary z tolerancjami, chropowatość, tolerancje geometryczne i wymagania techniczne. Pasowania i wykaz części należą do rysunku złożeniowego.", "id": "q35", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wyk-po", "t": "08.11 · Co ma rysunek wykonawczy"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wyk-r3", "t": "08.11 · Tolerancja, nie pasowanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#pas-r3", "t": "07.11 · Pasowanie tylko w zespole"}], "partial": false}, {"type": "abc", "tag": "tol.model3d", "q": "Czym jest <b>PMI<\/b> (Product and Manufacturing Information)?", "options": ["informacjami o wymaganiach wytwórczych (wymiary, tolerancje, chropowatość, adnotacje) umieszczonymi bezpośrednio na modelu 3D", "otwartym formatem pliku CAD do wymiany modeli między systemami", "nadrzędnym pojęciem cyfrowej definicji wyrobu, obejmującym wszystkie dane elektroniczne", "programem obróbki generowanym automatycznie z rysunku 2D"], "answer": 0, "explain": "PMI to adnotacje wytwórcze zapisane w modelu 3D, będącym częścią definicji MBD. Otwarty format do eksportu PMI to JT, a nadrzędnym pojęciem jest DPD (cyfrowa definicja wyrobu).", "id": "q36", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#mbd-r3", "t": "08.11 · PMI na modelu"}], "partial": false}]}, {"id": "07_polaczenia-rozlaczne", "kind": "Dział 7", "title": "Połączenia rozłączne", "desc": "Klasyfikacja połączeń, gwinty (budowa, rysowanie, oznaczanie), śruby i nakrętki, połączenia gwintowe, wielowypustowe i wpustowe.", "intro": "Test sprawdza klasyfikację połączeń, rysowanie i oznaczanie gwintów oraz połączenia gwintowe, wielowypustowe i wpustowe. Ostatnie pytania mają formę kolokwium: opis i szkic odręczny.", "tags": {"roz.klasyfikacja": "Klasyfikacja połączeń", "roz.gwint_budowa": "Gwint: budowa i rodzaje", "roz.gwint_rysunek": "Gwint na rysunku", "roz.gwint_oznaczanie": "Oznaczanie gwintu", "roz.sruby": "Śruby, wkręty, nakrętki, podkładki", "roz.pol_gwintowe": "Połączenia gwintowe", "roz.wielowypust": "Połączenia wielowypustowe", "roz.wpust": "Połączenia wpustowe", "roz.inne": "Połączenia kołkowe i klinowe"}, "questions": [{"id": "q01", "type": "abc", "tag": "roz.klasyfikacja", "q": "Jakie kryterium decyduje o zaliczeniu połączenia do rozłącznych albo nierozłącznych?", "options": ["Czy połączenie można rozłączyć bez uszkodzenia łącznika lub łączonych części", "Czy w połączeniu występuje dodatkowy element łączący (łącznik)", "Czy łączone części mogą wykonywać względem siebie ruch", "Czy obciążenie przenosi kształt elementów, czy siła tarcia"], "answer": 0, "explain": "Rozłączne to te, które da się zdemontować bez zniszczenia łącznika ani powierzchni części. Obecność łącznika to inne kryterium: dzieli połączenia na pośrednie i bezpośrednie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pol-r1", "t": "08.11 · Rozłączne i nierozłączne"}], "partial": false}, {"id": "q02", "type": "multi", "tag": "roz.klasyfikacja", "q": "Które z połączeń są <b>rozłączne pośrednie<\/b>?", "options": ["wpustowe", "kołkowe", "śrubowe (śruba z nakrętką)", "wielowypustowe", "nitowe", "gwintowe z gwintem naciętym na samych łączonych częściach"], "answer": [0, 1, 2], "explain": "Pośrednie mają osobny łącznik: wpust, kołek, śrubę. Wielowypustowe i gwint nacięty na samych częściach to połączenia bezpośrednie; nitowe ma łącznik, ale jest nierozłączne.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pol-r2", "t": "08.11 · Pośrednie i bezpośrednie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-r1", "t": "08.11 · Pośrednie i bezpośrednie"}], "partial": false}, {"id": "q03", "type": "abc", "tag": "roz.inne", "q": "Które zdanie o połączeniach <b>kołkowych i klinowych<\/b> jest prawdziwe?", "options": ["Są rozłączne pośrednie, a ich znormalizowane łączniki dobiera się, podobnie jak wpusty, według średnicy", "Są rozłączne bezpośrednie, bo kształt łączący wykonuje się na samych łączonych częściach", "Są nierozłączne pośrednie, tak jak połączenia nitowe", "Są rozłączne pośrednie, a wymiary łączników dobiera się według długości piasty, bez norm"], "answer": 0, "explain": "Kołek i klin są osobnymi łącznikami, które można wybić bez niszczenia części, więc połączenie jest rozłączne pośrednie. Łączniki są znormalizowane i dobiera się je według średnicy, jak wpusty.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#sz-klin", "t": "08.11 · Kliny i kołki"}], "partial": false}, {"id": "q04", "type": "short", "tag": "roz.gwint_budowa", "q": "Gwint <b>dwukrotny<\/b> ma podziałkę P = 1,5 mm. Ile wynosi jego skok (w mm)?", "answer": ["3", "3.0", "3,0", "3mm", "3 mm", "3,0 mm", "3.0 mm", "3 milimetry", "h=3", "h = 3"], "explain": "Skok to przesunięcie tego samego zwoju po pełnym obrocie, podziałka to odległość sąsiednich grzbietów. W gwincie wielokrotnym skok = krotność × podziałka = 2 × 1,5 = 3 mm (por. M20×2(P1): skok 2, podziałka 1).", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gw-r2", "t": "08.11 · Skok, podziałka, krotność"}], "partial": false}, {"id": "q05", "type": "multi", "tag": "roz.gwint_budowa", "q": "Które zestawienia rodzaju gwintu z kątem jego zarysu są poprawne?", "options": ["metryczny – 60°", "calowy (Whitwortha) – 55°", "trapezowy symetryczny – 30°", "metryczny – 55°", "trapezowy symetryczny – 60°", "calowy (Whitwortha) – 60°"], "answer": [0, 1, 2], "explain": "Metryczny ma 60°, calowy Whitwortha 55°, trapezowy symetryczny 30°. Częsta pomyłka to zamiana metrycznego z calowym, bo oba mają zarys trójkątny.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gw-r3", "t": "08.11 · Zarysy gwintów"}], "partial": false}, {"id": "q06", "type": "abc", "tag": "roz.gwint_budowa", "q": "Jaki gwint stosuje się w połączeniach <b>ruchowych<\/b>, np. w śrubach podnośników, wrzecionach zaworów i prasach śrubowych?", "options": ["trapezowy", "metryczny", "okrągły", "rurowy stożkowy"], "answer": 0, "explain": "Gwint trapezowy ma wysoką wytrzymałość i wysoką sprawność, dlatego służy do przenoszenia ruchu. Metryczny jest samohamowny i ma niską sprawność, więc stosuje się go w połączeniach spoczynkowych.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gw-r4", "t": "08.11 · Do czego który"}], "partial": false}, {"id": "q07", "type": "abc", "tag": "roz.gwint_rysunek", "q": "Który rysunek poprawnie przedstawia (w uproszczeniu) wałek z gwintem zewnętrznym wykonanym na części jego długości?", "options": ["<svg viewBox=\"0 0 240 120\" role=\"img\" aria-label=\"Wałek z gwintem zewnętrznym na części długości, widok z boku.\"><line class=\"ax\" x1=\"10.0\" y1=\"60.0\" x2=\"230.0\" y2=\"60.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><polygon class=\"sh\" points=\"20.0,25.0 215.0,25.0 220.0,30.0 220.0,90.0 215.0,95.0 20.0,95.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"215.0\" y1=\"25.0\" x2=\"215.0\" y2=\"95.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"120.0\" y1=\"25.0\" x2=\"120.0\" y2=\"95.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"
