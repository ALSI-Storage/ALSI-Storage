 x=\"125.0\" y=\"35.0\" text-anchor=\"middle\" style=\"font-size:13px\">z góry<\/text><rect class=\"ax\" x=\"88.0\" y=\"98.0\" width=\"74.0\" height=\"32.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"125.0\" y=\"119.0\" text-anchor=\"middle\" style=\"font-size:13px\">z dołu<\/text><rect class=\"ax\" x=\"170.0\" y=\"56.0\" width=\"74.0\" height=\"32.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"207.0\" y=\"77.0\" text-anchor=\"middle\" style=\"font-size:13px\">z lewej<\/text><rect class=\"ax\" x=\"6.0\" y=\"56.0\" width=\"74.0\" height=\"32.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"43.0\" y=\"77.0\" text-anchor=\"middle\" style=\"font-size:13px\">z prawej<\/text><\/svg>"], "answer": 0, "explain": "W metodzie E każdy rzut leży po stronie przeciwnej do kierunku patrzenia: rzut z góry pod rzutem z przodu, z dołu nad nim, z lewej po prawej, z prawej po lewej. Układ odwrotny w obu kierunkach to metoda A. Dwa pozostałe układy mieszają obie metody.", "id": "q11", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-3", "t": "17.10 · Układ rzutów"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-plan", "t": "17.10 · Plansza: E i A"}], "partial": false}, {"type": "abc", "tag": "rzu.metody", "q": "Gdzie w metodzie europejskiej umieszcza się rzut z tyłu?", "options": ["po prawej stronie rzutu z lewej strony (skrajnie po prawej); dopuszczalnie także skrajnie po lewej", "nad rzutem z dołu, na skrajnej górze arkusza", "pod rzutem z góry, na skrajnym dole arkusza", "w miejscu rzutu z prawej strony, który wtedy się pomija"], "answer": 0, "explain": "Rzut z tyłu stoi w rzędzie rzutu głównego: za rzutem z lewej, czyli skrajnie po prawej, a alternatywnie skrajnie po lewej, za rzutem z prawej. W pionie są tylko rzuty z góry i z dołu.", "id": "q12", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-3", "t": "17.10 · Układ rzutów"}], "partial": false}, {"type": "abc", "tag": "rzu.metody", "q": "Na rysunku jest symbol metody rzutowania. Którą metodę oznacza?", "svg": "<svg viewBox=\"0 0 190 100\" role=\"img\" aria-label=\"Symbol metody rzutowania: po lewej dwa współśrodkowe okręgi, po prawej trapez - widok boczny stożka ściętego z mniejszą podstawą po lewej.\"><circle class=\"sh\" cx=\"50.0\" cy=\"50.0\" r=\"25.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"50.0\" cy=\"50.0\" r=\"15.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"18.0\" y1=\"50.0\" x2=\"34.0\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"50.0\" y1=\"18.0\" x2=\"50.0\" y2=\"34.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"36.5\" y1=\"50.0\" x2=\"37.5\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"50.0\" y1=\"36.5\" x2=\"50.0\" y2=\"37.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"40.0\" y1=\"50.0\" x2=\"60.0\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"50.0\" y1=\"40.0\" x2=\"50.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"62.5\" y1=\"50.0\" x2=\"63.5\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"50.0\" y1=\"62.5\" x2=\"50.0\" y2=\"63.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"66.0\" y1=\"50.0\" x2=\"82.0\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"50.0\" y1=\"66.0\" x2=\"50.0\" y2=\"82.0\" style=\"stroke-width:1\"/><polygon class=\"sh\" points=\"105.0,35.0 165.0,25.0 165.0,75.0 105.0,65.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"97.0\" y1=\"50.0\" x2=\"173.0\" y2=\"50.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>", "options": ["metodę A (trzeciego kąta): widok od strony mniejszej podstawy leży po tej stronie, z której się patrzy", "metodę E (pierwszego kąta): widok od strony mniejszej podstawy leży po stronie przeciwnej do kierunku patrzenia", "metodę E, bo w symbolu E okręgi zawsze stoją po lewej stronie trapezu"], "answer": 0, "explain": "Okręgi to widok stożka ściętego od strony mniejszej podstawy (z lewej). W metodzie A ten widok leży po lewej, czyli tam, skąd się patrzy. W symbolu E trapez jest po lewej, a okręgi po prawej.", "id": "q13", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-2", "t": "17.10 · Symbol metody"}], "partial": false}, {"type": "multi", "tag": "rzu.metody", "q": "Rysunek wykonano w metodzie europejskiej. Które rodzaje rzutów mimo to rysuje się w metodzie trzeciego kąta (amerykańskiej)?", "options": ["widoki cząstkowe", "kłady", "widoki cząstkowe w zwiększonej podziałce (szczegóły)", "przekroje", "rzut z tyłu"], "answer": [0, 1], "explain": "Metodą trzeciego kąta rysuje się tylko widoki cząstkowe i kłady. Widoku cząstkowego nie należy mylić ze szczegółem w zwiększonej podziałce, który rysuje się w dowolnym miejscu i opisuje literą z podziałką.", "id": "q14", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-5", "t": "17.10 · Wyjątek: trzeci kąt"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-3", "t": "17.10 · Szczegół"}], "partial": false}, {"type": "abc", "tag": "rzu.widoki", "q": "Do czego służy widok pomocniczy?", "options": ["pokazuje w prawdziwym kształcie powierzchnię nachyloną do rzutni podstawowych; rzutuje się prostopadle do tej powierzchni", "pokazuje drobny szczegół, którego nie da się zwymiarować w podziałce rysunku", "pokazuje przedmiot gięty w postaci przed zgięciem", "pokazuje połowę przedmiotu symetrycznego, żeby zaoszczędzić miejsce"], "answer": 0, "explain": "Powierzchnia ukośna do wszystkich rzutni podstawowych wychodzi w nich skrócona, więc rzutuje się ją w kierunku do niej prostopadłym. Szczegół drobnych elementów to widok cząstkowy w zwiększonej podziałce, a nie widok pomocniczy.", "id": "q15", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-5", "t": "17.10 · Widok pomocniczy"}], "partial": false}, {"type": "abc", "tag": "rzu.widoki", "q": "Nad widokiem pomocniczym kołnierza napisano „A” z łukową strzałką i „45°”. Co to oznacza?", "options": ["widok w kierunku A narysowano po obróceniu o 45°, np. tak, by osie symetrii kołnierza były pionowa i pozioma", "kierunek patrzenia A jest nachylony do rzutni pod kątem 45°", "widok A jest widokiem rozwiniętym, a kołnierz przed zgięciem tworzył kąt 45°", "widok A narysowano w podziałce zmniejszonej, a 45° to kąt kreskowania"], "answer": 0, "explain": "Widok pomocniczy można przenieść w dowolne miejsce i obrócić, żeby nie rysować go ukośnie. Obrót zaznacza się łukiem ze strzałką przy literze i podaje się kąt. Kąt nachylenia kierunku patrzenia wynika ze strzałki na rzucie głównym, a nie z opisu.", "id": "q16", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-5", "t": "17.10 · Rzut obrócony"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-5", "t": "17.10 · Widok pomocniczy"}], "partial": false}, {"type": "abc", "tag": "rzu.widoki", "q": "Jak rozpoznać na rysunku widok cząstkowy (np. kształt rowka na wpust pokazany nad widokiem wałka)?", "options": ["jest rzutowany metodą trzeciego kąta, rysowany linią ciągłą grubą i połączony z widokiem podstawowym linią cienką punktową (osią)", "jest opisany literą i podziałką w nawiasie, np. A (5:1), i ograniczony linią falistą", "jest ograniczony linią cienką odręczną i pokazuje fragment przedmiotu w metodzie europejskiej", "jest oznaczony strzałką z literą przy rzucie głównym, a nad nim powtarza się tę literę"], "answer": 0, "explain": "Widok cząstkowy pokazuje tylko szczegół, leży tam, gdzie wypada w metodzie A (np. widok z góry nad rzutem), i wiąże go z rzutem oś. Opis „A (5:1)” należy do widoku cząstkowego w zwiększonej podziałce, a linia odręczna do widoku częściowego.", "id": "q17", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-2", "t": "17.10 · Widok cząstkowy"}], "partial": false}, {"type": "abc", "tag": "rzu.widoki", "q": "Jaki to rodzaj widoku?", "svg": "<svg viewBox=\"0 0 200 130\" role=\"img\" aria-label=\"Rysunek płytki: lewa część z półokrągłym wycięciem i okrągłym otworem, po prawej stronie zarys urwany cienką linią falistą.\"><path class=\"sh\" d=\"M170,20 L42,20 Q30,20 30,32 L30,51 A14,14 0 0 1 30,79 L30,98 Q30,110 42,110 L170,110\" style=\"stroke-width:2.6\"/><path class=\"ax\" d=\"M170.0,20.0 Q166.0,27.5 170.0,35.0 Q174.0,42.5 170.0,50.0 Q166.0,57.5 170.0,65.0 Q174.0,72.5 170.0,80.0 Q166.0,87.5 170.0,95.0 Q174.0,102.5 170.0,110.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"20.0\" y1=\"65.0\" x2=\"176.0\" y2=\"65.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"30.0\" y1=\"43.0\" x2=\"30.0\" y2=\"87.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><circle class=\"sh\" cx=\"110.0\" cy=\"65.0\" r=\"18.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"84.0\" y1=\"65.0\" x2=\"96.8\" y2=\"65.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"110.0\" y1=\"39.0\" x2=\"110.0\" y2=\"51.8\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"99.3\" y1=\"65.0\" x2=\"100.3\" y2=\"65.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"110.0\" y1=\"54.3\" x2=\"110.0\" y2=\"55.3\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"102.8\" y1=\"65.0\" x2=\"117.2\" y2=\"65.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"110.0\" y1=\"57.8\" x2=\"110.0\" y2=\"72.2\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"119.7\" y1=\"65.0\" x2=\"120.7\" y2=\"65.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"110.0\" y1=\"74.7\" x2=\"110.0\" y2=\"75.7\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"123.2\" y1=\"65.0\" x2=\"136.0\" y2=\"65.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"110.0\" y1=\"78.2\" x2=\"110.0\" y2=\"91.0\" style=\"stroke-width:1\"/><\/svg>", "options": ["widok częściowy", "widok cząstkowy", "półwidok", "widok cząstkowy w zwiększonej podziałce"], "answer": 0, "explain": "Widok częściowy pokazuje fragment przedmiotu i jest ograniczony linią ciągłą cienką odręczną albo zygzakową. Nie może być jedynym rzutem, jeśli nie da się na nim podać wszystkich wymiarów. Półwidok kończy się na osi symetrii, a nie na linii falistej.", "id": "q18", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-1", "t": "17.10 · Podstawowy, kompletny"}], "partial": false}, {"type": "abc", "tag": "rzu.widoki", "q": "Rysunek główny wałka wykonano w podziałce 1:2. Obok narysowano szczegół podcięcia opisany „A (5:1)”. Co oznacza ten opis?", "options": ["szczegół A narysowano 5 razy większy od rzeczywistego przedmiotu", "szczegół A narysowano 5 razy większy niż na rysunku głównym", "szczegół A narysowano w podziałce zmniejszającej, 5 razy mniejszy od przedmiotu", "widok A narysowano po obróceniu o 5° względem rzutu głównego"], "answer": 0, "explain": "Podziałkę szczegółu podaje się zawsze względem rzeczywistych wymiarów przedmiotu, a nie względem rysunku głównego. Przy rysunku 1:2 szczegół w 5:1 jest więc 10 razy większy od jego obrazu na rysunku głównym.", "id": "q19", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-3", "t": "17.10 · Szczegół"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#p-1", "t": "17.10 · Podziałka"}], "partial": false}, {"type": "abc", "tag": "rzu.widoki", "q": "Podcięcie wałka pokazano dodatkowo w szczególe A (5:1). Gdzie podaje się jego wymiary?", "options": ["na szczególe, bez powtarzania ich na innych rzutach", "na rysunku głównym; szczegół pokazuje tylko kształt", "na obu rzutach, żeby wymiar łatwo było znaleźć", "na szczególe, w wartościach pomnożonych przez 5"], "answer": 0, "explain": "Każdy wymiar podaje się na rysunku tylko raz, a szczegół powstał po to, żeby drobne elementy dało się zwymiarować, więc wymiary idą na niego. Liczby wymiarowe zawsze podają wymiar rzeczywisty, niezależnie od podziałki.", "id": "q20", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-3", "t": "17.10 · Szczegół"}], "partial": false}, {"type": "abc", "tag": "rzu.widoki", "q": "Co przedstawia widok rozwinięty?", "options": ["przedmiot gięty (np. z blachy) przed zgięciem albo rozwiniętą powierzchnię przedmiotu walcowego lub stożkowego", "wszystkie sześć rzutów rozłożonych na jednej płaszczyźnie arkusza", "rzut powierzchni nachylonej, obrócony tak, by był rysowany poziomo", "przedmiot rozłożony na części składowe w rysunku złożeniowym"], "answer": 0, "explain": "Widok rozwinięty ułatwia wymiarowanie elementów blaszanych i prętów: długości i miejsca gięcia podaje się na kształcie płaskim, a linie gięcia rysuje się cienko. Rozłożenie sześciu rzutni to rysunek rzutowy, a nie widok rozwinięty.", "id": "q21", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-6", "t": "17.10 · Widok rozwinięty"}], "partial": false}, {"type": "abc", "tag": "rzu.polwidok", "q": "Kiedy można zastosować ćwierćwidok?", "options": ["gdy przedmiot jest symetryczny względem dwóch płaszczyzn symetrii", "gdy przedmiot jest symetryczny względem jednej płaszczyzny symetrii", "gdy przedmiot jest bryłą obrotową, niezależnie od kształtu", "gdy przedmiot jest zbyt duży, by zmieścić się na arkuszu w podziałce 1:1"], "answer": 0, "explain": "Półwidok wymaga jednej płaszczyzny symetrii, a ćwierćwidok dwóch, bo pokazuje jedną czwartą przedmiotu. Przy jednej płaszczyźnie symetrii można narysować najwyżej półwidok.", "id": "q22", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-4", "t": "17.10 · Półwidok"}], "partial": false}, {"type": "abc", "tag": "rzu.polwidok", "q": "Jak zaznacza się na półwidoku, że narysowano tylko połowę przedmiotu?", "options": ["na obu końcach osi symetrii rysuje się po dwie krótkie, równoległe, cienkie kreski prostopadłe do osi", "przy osi symetrii rysuje się strzałkę z literą, a nad rzutem powtarza tę literę", "wzdłuż osi symetrii rysuje się linię falistą cienką", "oś symetrii rysuje się linią punktową grubą"], "answer": 0, "explain": "Znak symetrii (dwie krótkie kreski, ok. 3,5 mm) stawia się na obu końcach każdej osi, wzdłuż której przedmiot obcięto. Linia falista ogranicza widok częściowy, a linia punktowa gruba oznacza ślad płaszczyzny przekroju.", "id": "q23", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-4", "t": "17.10 · Półwidok"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#u-3", "t": "17.10 · Symetria"}], "partial": false}, {"type": "abc", "tag": "rzu.polwidok", "q": "Na półwidoku płytki prostokątnej z otworem w środku podano wymiary. Który wymiar jest błędny?", "svg": "<svg viewBox=\"0 0 330 130\" role=\"img\" aria-label=\"Półwidok płytki prostokątnej z otworem w środku: górna połowa nad poziomą osią symetrii, wymiary 100, 60 i R12.\"><polyline class=\"sh\" points=\"60.0,100.0 60.0,40.0 260.0,40.0 260.0,100.0\" style=\"stroke-width:2.6\"/><path class=\"sh\" d=\"M136,100 A24,24 0 0 1 184,100\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"42.0\" y1=\"100.0\" x2=\"278.0\" y2=\"100.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"46.0\" y1=\"94.0\" x2=\"46.0\" y2=\"106.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"50.0\" y1=\"94.0\" x2=\"50.0\" y2=\"106.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"270.0\" y1=\"94.0\" x2=\"270.0\" y2=\"106.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"274.0\" y1=\"94.0\" x2=\"274.0\" y2=\"106.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"160.0\" y1=\"68.0\" x2=\"160.0\" y2=\"108.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"60.0\" y1=\"40.0\" x2=\"60.0\" y2=\"13.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"260.0\" y1=\"40.0\" x2=\"260.0\" y2=\"13.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"60.0\" y1=\"18.0\" x2=\"260.0\" y2=\"18.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"60.0,18.0 70.0,15.2 70.0,20.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"260.0,18.0 250.0,20.8 250.0,15.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"160.0\" y=\"14.0\" text-anchor=\"middle\" style=\"font-size:13px\">100<\/text><line class=\"ax\" x1=\"262.0\" y1=\"40.0\" x2=\"298.0\" y2=\"40.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"292.0\" y1=\"40.0\" x2=\"292.0\" y2=\"114.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"292.0,40.0 294.8,50.0 289.2,50.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"287.0\" y=\"76.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 287.0 76.0)\">60<\/text><line class=\"ax\" x1=\"160.0\" y1=\"100.0\" x2=\"192.2\" y2=\"73.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"178.4,84.6 172.5,93.1 168.9,88.9\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"196.2\" y=\"71.0\" text-anchor=\"start\" style=\"font-size:13px\">R12<\/text><\/svg>", "options": ["R12 przy otworze: otwór jest pełnym okręgiem, więc wymiaruje się go średnicą Ø24", "60: w półwidoku podaje się tylko wymiar narysowanej połowy, czyli 30", "60: wymiaru nie wolno wyprowadzać za oś symetrii, więc przy takim wymiarze trzeba narysować całą płytkę", "100: szerokości nie wymiaruje się na półwidoku, tylko na drugim rzucie"], "answer": 0, "explain": "Na półwidoku wymiary dotyczą całego przedmiotu: wymiar 60 wyciąga się za oś symetrii i kończy jednym grotem, a otwór, choć narysowany w połowie, opisuje się średnicą. Wymiar połowy (30) to typowa pomyłka.", "id": "q24", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-4", "t": "17.10 · Półwidok"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-3", "t": "18.10 · Wymiar całkowity"}], "partial": false}, {"type": "long", "tag": "rzu.zasady", "pts": 1, "q": "Opisz zasady doboru rzutu głównego i liczby rzutów na rysunku technicznym oraz dopuszczalne odstępstwa od nich.", "key": "<b>1 pkt:<\/b> co najmniej 5 poprawnych elementów, w tym: rzut główny zawsze, minimum rzutów, położenie użytkowe lub strona najbardziej charakterystyczna, oraz co najmniej jedno odstępstwo. <b>0,5 pkt:<\/b> 3–4 poprawne elementy albo brak odstępstw. <b>0 pkt:<\/b> mniej niż 3 elementy albo błąd zasadniczy (np. „zawsze trzy rzuty”, „rzut główny z najwięcej krawędzi niewidocznych”). <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>rysuje się tylko rzuty niezbędne do jednoznacznego określenia kształtu i wymiarów, zwykle 2–3; rzut główny (z przodu) występuje zawsze<\/li><li>rzut główny pokazuje przedmiot w położeniu użytkowym (lub roboczym, montażowym), od strony najbardziej charakterystycznej, z jak największą liczbą krawędzi widocznych<\/li><li>przedmiot ustawia się tak, by większość jego powierzchni płaskich i osi była równoległa lub prostopadła do rzutni; przedmiot stawia się stabilnie (np. stożek na podstawie, nie na wierzchołku)<\/li><li>rzuty rysuje się w normalnym układzie; rzut z lewej ma pierwszeństwo przed rzutem z prawej, a z góry przed rzutem z dołu<\/li><li>dla przedmiotów obrotowych rysuje się osie, dla symetrycznych płaszczyzny symetrii; rzuty rozmieszcza się równomiernie na arkuszu; linii rzutujących między rzutami się nie rysuje<\/li><li>odstępstwa: przedmioty długie (wały, osie) rysuje się poziomo, z dolną częścią po prawej stronie; przedmioty bez wyraźnego położenia użytkowego rysuje się poziomo lub pionowo; rzut można umieścić w dowolnym miejscu arkusza, jeśli oznaczy się kierunek patrzenia strzałką z literą i opisze rzut tą literą<\/li><li>półwidoki, półprzekroje i przekroje pozwalają zmniejszyć liczbę rzutów<\/li><\/ul>", "id": "q25", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-1", "t": "17.10 · Rzut główny"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-2", "t": "17.10 · Tylko niezbędne"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-3", "t": "17.10 · Rzut przesunięty"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-4", "t": "17.10 · Podstawowy układ"}], "partial": false}, {"type": "long", "tag": "rzu.metody", "pts": 1, "q": "Wyjaśnij różnicę między metodą europejską (E) a amerykańską (A) rzutowania prostokątnego: ułożenie obserwatora, przedmiotu i rzutni, rozmieszczenie rzutów, oznaczenie metody na rysunku.", "key": "<b>1 pkt:<\/b> poprawne ułożenie obserwator–przedmiot–rzutnia w obu metodach, poprawne położenie co najmniej rzutu z góry i rzutu z lewej w obu metodach oraz opis symbolu albo liter E/A. <b>0,5 pkt:<\/b> poprawna tylko część (np. samo rozmieszczenie bez zasady rzutowania albo bez oznaczenia) lub jeden błąd strony. <b>0 pkt:<\/b> zamienione metody albo brak treści merytorycznej. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>E = metoda pierwszego kąta: przedmiot leży między obserwatorem a rzutnią (rzutnia za przedmiotem); obowiązuje w Polsce i Europie<\/li><li>A = metoda trzeciego kąta: rzutnia leży między obserwatorem a przedmiotem; stosowana w dokumentacji na rynek amerykański<\/li><li>E: rzut z góry pod rzutem z przodu, z dołu nad nim, z lewej po prawej stronie, z prawej po lewej, z tyłu skrajnie po prawej (lub skrajnie po lewej)<\/li><li>A: rzut z góry nad rzutem z przodu, z dołu pod nim, z lewej po lewej stronie, z prawej po prawej (rzut leży po stronie, z której się patrzy)<\/li><li>podstawowy układ w E: rzut z przodu, z góry i z lewej strony<\/li><li>oznaczenie: litera E lub A albo symbol stożka ściętego; w E trapez po lewej, okręgi po prawej, w A odwrotnie; symbol umieszcza się w tabliczce<\/li><li>w rysunku metodą E kłady i widoki cząstkowe rysuje się metodą trzeciego kąta<\/li><\/ul>", "id": "q26", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-1", "t": "17.10 · Kolejność"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-2", "t": "17.10 · Symbol metody"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-3", "t": "17.10 · Układ rzutów"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-5", "t": "17.10 · Wyjątek: trzeci kąt"}], "partial": false}, {"type": "long", "tag": "rzu.widoki", "pts": 1, "q": "Scharakteryzuj trzy rodzaje widoków: widok pomocniczy, widok cząstkowy oraz widok cząstkowy w zwiększonej podziałce. Dla każdego podaj, kiedy się go stosuje, jak się go rzutuje i jak oznacza.", "key": "<b>1 pkt:<\/b> wszystkie trzy widoki z poprawnym zastosowaniem i oznaczeniem, bez pomylenia widoku cząstkowego ze szczegółem. <b>0,5 pkt:<\/b> dwa widoki poprawnie albo trzy z jednym brakiem (np. bez metody rzutowania widoku cząstkowego). <b>0 pkt:<\/b> jeden widok lub pomylenie widoku cząstkowego ze szczegółem w zwiększonej podziałce. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li><b>pomocniczy:<\/b> dla powierzchni nachylonej do rzutni podstawowych; rzutuje się prostopadle do niej, więc pokazuje ją w prawdziwym kształcie; zwykle rysuje się tylko ten fragment; kierunek patrzenia oznacza strzałka z wielką literą, nad widokiem ta sama litera; można go obrócić, wtedy przy literze łuk ze strzałką i kąt (np. 45°); jednakowe widoki z kilku kierunków opisuje się wspólnie (A1, A2)<\/li><li><b>cząstkowy:<\/b> pokazuje tylko szczegół (np. kształt rowka na wpust, otworu w piaście); rzutowany metodą trzeciego kąta, czyli po stronie, z której się patrzy; rysowany linią ciągłą grubą i połączony z widokiem podstawowym linią cienką punktową (osią)<\/li><li><b>cząstkowy w zwiększonej podziałce (szczegół):<\/b> dla drobnych elementów (podcięcia, podtoczenia, rowki), których nie da się przedstawić i zwymiarować w podziałce rysunku; miejsce na rzucie zaznacza się cienkim okręgiem i literą; szczegół w dowolnym miejscu arkusza z opisem np. A (5:1); podziałka względem przedmiotu rzeczywistego; urwanie linią falistą lub zygzakową; wymiarów ze szczegółu nie powtarza się na innych rzutach<\/li><\/ul>", "id": "q27", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-5", "t": "17.10 · Widok pomocniczy"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-2", "t": "17.10 · Widok cząstkowy"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-3", "t": "17.10 · Szczegół"}], "partial": false}, {"type": "sketch", "tag": "rzu.krok", "pts": 1, "q": "Bryła na rysunku to prostopadłościan o szerokości 80, głębokości 40 i wysokości 50. Od góry ma prostokątny rowek o szerokości 30 i głębokości 20, na środku szerokości, przez całą głębokość bryły. W ścianie przedniej jest okrągły otwór przelotowy Ø16 (od przodu do tyłu), na środku szerokości, z osią na wysokości 15. Naszkicuj w metodzie E rzut z przodu, rzut z góry i rzut z lewej strony, z krawędziami niewidocznymi i osiami (bez wymiarów).", "svg": "<svg viewBox=\"0 0 250 230\" role=\"img\" aria-label=\"Bryła w izometrii: prostopadłościan 80 na 40 na 50 z prostokątnym rowkiem od góry przez całą głębokość i okrągłym otworem przelotowym w ścianie przedniej.\"><polygon class=\"sh\" points=\"143.8,84.9 177.4,65.5 123.7,34.5 90.1,53.9\" style=\"fill:var(--s2);stroke-width:2\"/><polygon class=\"sh\" points=\"143.8,115.9 90.1,84.9 90.1,53.9 143.8,84.9\" style=\"fill:var(--s2);stroke-width:2\"/><polygon class=\"sh\" points=\"103.6,139.1 143.8,115.9 90.1,84.9 49.9,108.1\" style=\"fill:var(--s2);stroke-width:2\"/><polygon class=\"sh\" points=\"70.0,205.0 177.4,143.0 177.4,65.5 143.8,84.9 143.8,115.9 103.6,139.1 103.6,108.1 70.0,127.5\" style=\"fill:var(--s2);stroke-width:2\"/><polygon class=\"sh\" points=\"70.0,205.0 16.3,174.0 16.3,96.5 70.0,127.5\" style=\"fill:var(--s2);stroke-width:2\"/><polygon class=\"sh\" points=\"70.0,127.5 103.6,108.1 49.9,77.1 16.3,96.5\" style=\"fill:var(--s2);stroke-width:2\"/><polyline class=\"sh\" points=\"134.4,144.6 134.1,141.6 133.0,139.2 131.3,137.6 129.1,136.9 126.5,137.2 123.7,138.3 120.9,140.4 118.3,143.1 116.1,146.4 114.4,149.9 113.3,153.5 113.0,156.9 113.3,159.9 114.4,162.3 116.1,163.9 118.3,164.6 120.9,164.3 123.7,163.2 126.5,161.1 129.1,158.4 131.3,155.1 133.0,151.6 134.1,148.0 134.4,144.6\" style=\"stroke-width:2\"/><line class=\"ax\" x1=\"182.8\" y1=\"164.7\" x2=\"158.6\" y2=\"150.8\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"158.6,150.8 168.7,153.3 165.9,158.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"188.8\" y=\"178.7\" text-anchor=\"middle\" style=\"font-size:13px\">przód<\/text><\/svg>", "key": "<b>Musi być:<\/b><ul><li>układ E: rzut z góry pod rzutem z przodu, rzut z lewej po prawej stronie rzutu z przodu; zgodne szerokości (przód–góra) i wysokości (przód–lewa); głębokość rzutu z góry równa szerokości rzutu z lewej<\/li><li>rzut z przodu: zarys w kształcie „U” 80×50 z rowkiem 30×20, okrąg Ø16 ze środkiem na wysokości 15 i dwiema osiami linią punktową cienką<\/li><li>rzut z góry: prostokąt 80×40 z dwiema ciągłymi liniami krawędzi rowka (w odstępie 30); otwór jako dwie linie kreskowe cienkie w odstępie 16 przez całą głębokość i jego oś punktowa<\/li><li>rzut z lewej: prostokąt 40×50; dno rowka jako linia kreskowa na wysokości 30 (zasłonięte ścianą); otwór jako dwie linie kreskowe na wysokościach 7 i 23 i oś na wysokości 15<\/li><li>zarys linią ciągłą grubą, krawędzie niewidoczne kreskową cienką, osie punktową cienką wysuniętą nieco poza zarys; bez linii rzutujących między rzutami<\/li><\/ul><b>1 pkt:<\/b> trzy rzuty we właściwym układzie, wszystkie elementy powyżej, najwyżej jeden drobny błąd linii. <b>0,5 pkt:<\/b> poprawny układ i zarysy, ale brak krawędzi niewidocznych lub osi w jednym rzucie albo jeden błąd wymiaru. <b>0 pkt:<\/b> układ metody A lub rzuty niezgodne ze sobą (różne szerokości lub wysokości). <b>Typowe błędy:<\/b> rzut z lewej po lewej stronie; dno rowka w rzucie z lewej linią ciągłą; otwór w rzucie z góry linią ciągłą; brak osi otworu.", "id": "q28", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rx-plan", "t": "17.10 · Plansza: bryła z otworem"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rx-3", "t": "17.10 · Bryła"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-3", "t": "17.10 · Układ rzutów"}], "partial": false}, {"type": "sketch", "tag": "rzu.polwidok", "pts": 1, "q": "Płytka o grubości 8 ma kształt trapezu równoramiennego (rysunek: pełny widok z góry z wymiarami). Narysuj ten widok jako <b>półwidok<\/b> i podaj na nim wymiary 100, 60, 50 i Ø20 (otwory Ø8 mają osie w rozstawie 70, na wysokości 10 od dolnej krawędzi). Odpowiedz też jednym zdaniem: czy dla tej płytki można zastosować ćwierćwidok?", "svg": "<svg viewBox=\"0 0 340 210\" role=\"img\" aria-label=\"Płytka w kształcie trapezu równoramiennego, grubość 8: podstawa 100, góra 60, wysokość 50, otwór Ø20 w połowie wysokości na osi, dwa otwory Ø8 w rozstawie 70 na wysokości 10.\"><polygon class=\"sh\" points=\"60.0,150.0 260.0,150.0 220.0,50.0 100.0,50.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"160.0\" y1=\"36.0\" x2=\"160.0\" y2=\"164.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><circle class=\"sh\" cx=\"160.0\" cy=\"100.0\" r=\"20.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"132.0\" y1=\"100.0\" x2=\"146.0\" y2=\"100.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"160.0\" y1=\"72.0\" x2=\"160.0\" y2=\"86.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"148.5\" y1=\"100.0\" x2=\  x2=\"295.0\" y2=\"150.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"260.0\" y1=\"50.0\" x2=\"295.0\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"290.0\" y1=\"150.0\" x2=\"290.0\" y2=\"50.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"290.0,150.0 287.2,140.0 292.8,140.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"290.0,50.0 292.8,60.0 287.2,60.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"286.0\" y=\"100.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 286.0 100.0)\">50<\/text><line class=\"ax\" x1=\"174.1\" y1=\"114.1\" x2=\"121.8\" y2=\"61.8\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"145.9,85.9 154.9,90.9 150.9,94.9\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"174.1,114.1 165.1,109.1 169.1,105.1\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"136.0\" y=\"70.3\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(45.0 136.0 70.3)\">Ø20<\/text><line class=\"ax\" x1=\"86.0\" y1=\"123.0\" x2=\"48.0\" y2=\"100.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"48.0\" y1=\"100.0\" x2=\"10.0\" y2=\"100.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"86.0,123.0 76.0,120.2 78.9,115.4\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"29.0\" y=\"96.0\" text-anchor=\"middle\" style=\"font-size:13px\">2×Ø8<\/text><\/svg>", "key": "<b>Musi być:<\/b><ul><li>połowa płytki po jednej stronie pionowej osi symetrii; oś linią punktową cienką<\/li><li>na obu końcach osi znak symetrii: dwie krótkie równoległe cienkie kreski prostopadłe do osi (albo zarys wyciągnięty nieco za oś)<\/li><li>zarys linią ciągłą grubą; otwór Ø20 jako półokrąg na osi; otwór Ø8 po narysowanej stronie z osiami<\/li><li>wymiary 100 i 60 jako wymiary całkowite: linia wymiarowa wyprowadzona za oś symetrii, z jednym grotem; otwór opisany Ø20 (nie R10)<\/li><li>wymiar 50 (wysokość płytki, mierzona wzdłuż osi symetrii) podany bez zmian, z dwoma grotami<\/li><li>ćwierćwidok nie jest możliwy: płytka ma tylko jedną płaszczyznę symetrii (trapez nie jest symetryczny góra–dół)<\/li><\/ul><b>1 pkt:<\/b> wszystkie elementy. <b>0,5 pkt:<\/b> poprawny półwidok, ale błąd wymiarowania (np. 50 zamiast 100, czyli wymiar połowy szerokości; R10 zamiast Ø20; brak wymiaru 50) albo brak znaków symetrii lub odpowiedzi o ćwierćwidoku. <b>0 pkt:<\/b> narysowana cała płytka albo połowa ucięta wzdłuż złej osi (poziomej). <b>Typowe błędy:<\/b> wymiar połowy szerokości; promień zamiast średnicy otworu; oś linią ciągłą; brak znaków symetrii.", "id": "q29", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-4", "t": "17.10 · Półwidok"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-4r", "t": "17.10 · Wymiar całości"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-3", "t": "18.10 · Wymiar całkowity"}], "partial": false}, {"type": "sketch", "tag": "rzu.polwidok", "pts": 1, "q": "Tuleja z kołnierzem (rysunek: widok z przodu z krawędziami niewidocznymi): kołnierz Ø80 o wysokości 15, część walcowa Ø50, wysokość całkowita 60, otwór przelotowy Ø30. Naszkicuj jej rzut z przodu jako <b>półwidok-półprzekrój<\/b> (oś pionowa, kołnierz na dole). Tuleja jest bryłą obrotową, więc ten jeden rzut wystarcza.", "svg": "<svg viewBox=\"0 0 330 220\" role=\"img\" aria-label=\"Tuleja z kołnierzem w widoku z przodu, oś pionowa: kołnierz Ø80 wysokości 15, część walcowa Ø50, wysokość całkowita 60, otwór przelotowy pokazany liniami kreskowymi.\"><polyline class=\"sh\" points=\"70.0,170.0 230.0,170.0 230.0,140.0 200.0,140.0 200.0,50.0 100.0,50.0 100.0,140.0 70.0,140.0 70.0,170.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"120.0\" y1=\"50.0\" x2=\"120.0\" y2=\"170.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"180.0\" y1=\"50.0\" x2=\"180.0\" y2=\"170.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/> roszczenia", "kind": "Dział 3", "title": "Przekroje, kłady i uproszczenia", "desc": "Kreskowanie, oznaczanie płaszczyzny przekroju, przekroje proste, stopniowe, łamane i cząstkowe, półwidok-półprzekrój, kłady, uproszczenia i radełkowanie.", "intro": "Test sprawdza, jak przedstawia się wnętrze przedmiotu: kreskowanie, oznaczanie śladu, rodzaje przekrojów i kładów oraz uproszczenia rysunkowe. Część pytań to odczyt rysunku: szukasz w nim jednego błędu albo rozpoznajesz rodzaj przekroju.", "tags": {"prz.kreskowanie": "Kreskowanie", "prz.oznaczanie": "Oznaczanie płaszczyzny przekroju", "prz.proste": "Przekrój prosty, półwidok-półprzekrój", "prz.stopniowy": "Przekrój stopniowy", "prz.lamany": "Przekrój łamany", "prz.czesciowy": "Przekrój cząstkowy", "prz.klady": "Kłady", "prz.uproszczenia": "Uproszczenia, elementy nieprzecinane", "prz.radelkowanie": "Radełkowanie"}, "questions": [{"id": "q01", "type": "abc", "tag": "prz.kreskowanie", "q": "Jaką linią i pod jakim kątem kreskuje się pola przekroju części metalowej?", "options": ["linią ciągłą cienką, zwykle pod 45° do podstawy rysunku, zarysu lub osi przedmiotu", "linią ciągłą grubą, zwykle pod 45° do podstawy rysunku, zarysu lub osi przedmiotu", "linią kreskową cienką, zwykle pod 45° do podstawy rysunku, zarysu lub osi przedmiotu", "linią ciągłą cienką, zwykle prostopadle do najdłuższego zarysu pola przekroju"], "answer": 0, "explain": "Kreskowanie to linia ciągła cienka, zwykle pod 45° względem podstawy (tabliczki), zarysu albo osi. Linia gruba jest zarezerwowana dla zarysu pola przekroju.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pr-2", "t": "17.10 · Kreskowanie"}], "partial": false}, {"id": "q02", "type": "abc", "tag": "prz.kreskowanie", "q": "Rysunek przedstawia przekrój poprzeczny piasty osadzonej na pełnym wale. Co jest na nim źle?", "svg": "<svg viewBox=\"0 0 240 200\" role=\"img\" aria-label=\"Przekrój poprzeczny piasty osadzonej na pełnym wale; pierścień ębów, nie na całej wysokości wypustów.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gwr-r4", "t": "08.11 · Wewnętrzny: kreskowanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#roz-wiel", "t": "08.11 · Dlaczego wielowypust inaczej"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wiel-r2", "t": "08.11 · Przekrój inny niż gwint"}], "partial": false}, {"id": "q07", "type": "long", "tag": "prz.kreskowanie", "pts": 1, "q": "Opisz zasady kreskowania pól przekroju: rodzaj linii, kąt, podziałkę, kreskowanie sąsiednich części oraz to, czego się nie kreskuje.", "key": "<b>1 pkt<\/b>: co najmniej 5 poprawnych elementów z listy, w tym linia, kąt i sąsiednie części. <b>0,5 pkt<\/b>: 3–4 elementy albo brak zasady dla sąsiednich części. <b>0 pkt<\/b>: mniej niż 3 elementy lub błąd zasadniczy (np. kreskowanie linią grubą, kreskowanie otworów).<br><b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>linia ciągła cienka;<\/li><li>kąt zwykle 45° do podstawy rysunku (tabliczki), zarysu lub osi przedmiotu; gdy zarys biegnie pod 45°, zmienia się kąt (np. 30° lub 60°);<\/li><li>podziałka równomierna, 0,5–5 mm: gęściej dla małych pól, rzadziej dla dużych; zbyt gęste kreskowanie czerni rysunek i może być odczytane jako spoina;<\/li><li>sąsiednie części kreskuje się w przeciwnych kierunkach albo z różną podziałką;<\/li><li>ta sama część jest kreskowana jednakowo na wszystkich przekrojach, a kreskowanie przerwane np. przez nit kontynuuje się w tej samej linii;<\/li><li>kreskuje się tylko materiał przecięty płaszczyzną: otwory, rowki, wolne przestrzenie zostają puste;<\/li><li>duże pola można kreskować tylko wzdłuż zarysu;<\/li><li>nie kreskuje się żeber przeciętych wzdłużnie ani łączników, wałów i osi przeciętych wzdłuż osi;<\/li><li>wzór zależy od materiału (metal: pojedyncze linie ukośne; masy plastyczne: siatka; beton, drewno, płyny, szkło: wzory własne).<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pr-2", "t": "17.10 · Kreskowanie"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pr-5", "t": "17.10 · Zespół i duże pola"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pr-4", "t": "17.10 · Znaki materiałów"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#sp-5", "t": "18.10 · Kreskowanie"}], "partial": false}, {"id": "q08", "type": "abc", "tag": "prz.oznaczanie", "q": "Jak zaznacza się w widoku położenie płaszczyzny przekroju?", "options": ["krótkimi odcinkami linii grubej (kreska–kropka–kreska) na końcach i w załamaniach śladu, ze strzałkami kierunku patrzenia i literami", "jedną ciągłą linią grubą przez cały przedmiot, ze strzałkami kierunku patrzenia na obu końcach", "linią punktową cienką na całej długości, bez pogrubień, z literami na obu końcach", "krótkimi odcinkami linii kreskowej grubej, ze strzałkami wskazującymi część odrzuconą"], "answer": 0, "explain": "Ślad to krótkie odcinki linii grubej z długą kreską i kropką przecinające zarys, na końcach (i w załamaniach). Strzałki pokazują kierunek patrzenia, a litery stoją na przedłużeniu śladu.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pk-1", "t": "17.10 · Ślad płaszczyzny"}], "partial": false}, {"id": "q09", "type": "multi", "tag": "prz.oznaczanie", "q": "Których liter nie wolno używać do oznaczania przekrojów?", "options": ["A", "I", "O", "R", "S", "Q", "X", "D"], "answer": [1, 2, 3, 5, 6], "explain": "Do oznaczeń przekrojów nie stosuje się liter I, O, R, Q, X. Pozostałe wielkie litery alfabetu łacińskiego są dozwolone, ale nie mogą się powtarzać na rysunku.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pk-2", "t": "17.10 · Strzałki i litery"}], "partial": false}, {"id": "q10", "type": "abc", "tag": "prz.oznaczanie", "q": "Kiedy przy przekroju można pominąć oznaczenie literowe (np. A–A)?", "options": ["gdy położenie płaszczyzny przekroju jest jednoznaczne, np. pokrywa się z osią symetrii przedmiotu", "gdy przekrój jest złożony (stopniowy lub łamany), bo jego ślad i tak jest załamany", "gdy przekrój narysowano w dowolnym miejscu arkusza, z dala od widoku", "gdy na rysunku jest kilka przekrojów, bo wystarczy ich kolejność na arkuszu"], "answer": 0, "explain": "Opis literowy pomija się, gdy położenie płaszczyzny jest oczywiste (jeden przekrój, ślad na osi symetrii). Przekrój przeniesiony w dowolne miejsce arkusza musi być oznaczony, bo inaczej nie wiadomo, skąd pochodzi.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pk-2", "t": "17.10 · Strzałki i litery"}], "partial": false}, {"id": "q11", "type": "abc", "tag": "prz.oznaczanie", "q": "Co jest źle na rysunku (widok płyty i jej przekrój A–A)?", "svg": "<svg viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Po lewej widok płyty z trzema otworami przelotowymi: dwa mniejsze jeden nad drugim przy lewej krawędzi i większy przesunięty w prawo; po prawej wąski przekrój A–A z dwiema przerwami w kreskowaniu w miejscach mniejszych otworów. W widoku nie ma żadnego oznaczenia.\"><rect class=\"sh\" x=\"20.0\" y=\"30.0\" width=\"160.0\" height=\"120.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"60.0\" cy=\"65.0\" r=\"12.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"40.0\" y1=\"65.0\" x2=\"49.2\" y2=\"65.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"60.0\" y1=\"45.0\" x2=\"60.0\" y2=\"54.2\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"51.7\" y1=\"65.0\" x2=\"52.7\" y2=\"65.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"60.0\" y1=\"56.7\" x2=\"60.0\" y2=\"57.7\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"55.2\" y1=\"65.0\" x2=\"64.8\" y2=\"65.0\" style=\"stroke-wi \" points=\"42.9,169.8 35.5,162.6 40.3,159.8\" style=\"fill:var(--soft)\"/><text class=\"\" x=\"26.1\" y=\"177.6\" text-anchor=\"middle\" style=\"font-size:13px\">A<\/text><\/svg>", "options": ["przekrój łamany", "przekrój stopniowy", "przekrój prosty ukośny", "kład przesunięty oznaczony"], "answer": 0, "explain": "Ślad składa się z dwóch odcinków przecinających się w środku tarczy pod kątem rozwartym, więc to przekrój łamany. W przekroju stopniowym odcinki śladu są równoległe i połączone pod kątem prostym.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pk-6", "t": "17.10 · Łamany"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lm-1", "t": "18.10 · Ślad łamany"}], "partial": false}, {"id": "q20", "type": "abc", "tag": "prz.lamany", "q": "Czym przekrój łamany rozwinięty różni się od skróconego?", "options": ["w rozwiniętym część pochyłą obraca się do płaszczyzny rzutu (rzeczywista długość, symbol obrotu), w skróconym rzutuje się ją bezpośrednio", "w skróconym część pochyłą obraca się do płaszczyzny rzutu (z symbolem obrotu), w rozwiniętym rzutuje się ją bezpośrednio", "w skróconym pomija się część przekroju leżącą w płaszczyźnie pochyłej, w rozwiniętym rysuje się ją w całości", "rozwinięty rysuje się w dowolnym miejscu arkusza, a skrócony w miejscu odpowiedniego widoku"], "answer": 0, "explain": "W rozwiniętym część pochyłą obraca się do płaszczyzny bazowej, więc przekrój ma rzeczywistą długość i jest dłuższy niż widok. W skróconym rzutuje się ją wprost, a długość przekroju równa się gabarytowi widoku.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lm-2", "t": "18.10 · Skrócony i rozwinięty"}], "partial": false}, {"id": "q21", "type": "long", "tag": "prz.lamany", "pts": 1, "q": "Porównaj przekrój stopniowy i przekrój łamany: przebieg płaszczyzn tnących, oznaczenie śladu, sposób rzutowania i to, co widać (lub czego nie widać) w samym przekroju.", "key": "<b>1 pkt<\/b>: poprawny przebieg płaszczyzn obu przekrojów, oznaczenie śladu i co najmniej jedna cecha rzutowania każdego z nich (brak linii stopnia; obrót części pochyłej). <b>0,5 pkt<\/b>: poprawnie opisany tylko jeden z przekrojów albo oba bez cech rzutowania. <b>0 pkt<\/b>: pomylenie przekrojów (np. łamany jako równoległe płaszczyzny).<br><b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>oba są przekrojami złożonymi (wielopłaszczyznowymi), stosowanymi, gdy szczegóły wnętrza nie leżą w jednej płaszczyźnie;<\/li><li>stopniowy: dwie lub więcej płaszczyzn równoległych, ślad załamany pod kątem prostym; płaszczyznę prowadzi się przez osie otworów, a stopień w materiale, nie po krawędzi;<\/li><li>łamany: płaszczyzny przecinają się pod kątem rozwartym, z przedziału (90°, 180°);<\/li><li>ślad: kreska–kropka–kreska linią grubą na końcach i w załamaniach, strzałki kierunku patrzenia, litery (np. A–A) na przedłużeniu śladu i nad przekrojem;<\/li><li>w przekroju stopniowym nie rysuje się linii w miejscu stopnia, pole kreskowania jest ciągłe;<\/li><li>łamany rozwinięty: część pochyłą obraca się do płaszczyzny rzutu, przekrój ma rzeczywistą długość, przy przekroju umieszcza się symbol obrotu; łamany skrócony: część pochyłą rzutuje się bezpośrednio;<\/li><li>w obu krawędzie niewidoczne, które płaszczyzna ujawnia, rysuje się linią grubą, a linii kreskowych się nie rysuje.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pk-5", "t": "17.10 · Stopniowy"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#sp-2", "t": "18.10 · Ślad z uskokiem"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lm-1", "t": "18.10 · Ślad łamany"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lm-2", "t": "18.10 · Skrócony i rozwinięty"}], "partial": false}, {"id": "q22", "type": "abc", "tag": "prz.czesciowy", "q": "Jaką linią ogranicza się przekrój cząstkowy (wyrwanie)?", "options": ["linią ciągłą cienką falistą (odręczną) lub zygzakową", "linią ciągłą grubą falistą (odręczną)", "linią punktową cienką, jak oś symetrii", "linią kreskową cienką, jak krawędź niewidoczna"], "answer": 0, "explain": "Granica wyrwania to cienka linia falista od ręki albo zygzak. Linia gruba oznaczałaby rzeczywistą krawędź przedmiotu.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-6", "t": "17.10 · Odręczna i zygzak"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-4", "t": "18.10 · Wyrwanie"}], "partial": false}, {"id": "q23", "type": "multi", "tag": "prz.czesciowy", "q": "W których przypadkach właściwym rozwiązaniem jest przekrój cząstkowy?", "options": ["pokazanie otworu nieprzelotowego lub nakiełka na końcu wałka", "pokazanie gniazda w łbie śruby (np. imbusowej), której trzpienia się nie przecina", "pokazanie budowy wewnętrznej tylko fragmentu dużego elementu", "symetryczna tuleja z otworem przelotowym na całej długości", "pokazanie kształtu przekroju poprzecznego ramienia bez tego, co leży za płaszczyzną"], "answer": [0, 1, 2], "explain": "Wyrwanie pokazuje wnętrze tylko tam, gdzie to potrzebne. Symetryczny łącznik z otworem przelotowym przedstawia się raczej półwidokiem-półprzekrojem, a sam kształt poprzeczny bez tła to kład.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-4", "t": "18.10 · Wyrwanie"}], "partial": false}, {"id": "q24", "type": "abc", "tag": "prz.klady", "q": "Czym kład różni się od przekroju?", "options": ["w kładzie rysuje się tylko figurę leżącą w płaszczyźnie cięcia, bez elementów leżących za nią", "kład rysuje się bez kreskowania, a przekrój z kreskowaniem", "kład stosuje się tylko dla przedmiotów symetrycznych, a przekrój dla dowolnych", "w kładzie elementy leżące za płaszczyzną rysuje się liniami kreskowymi"], "answer": 0, "explain": "Kład to sama figura z płaszczyzny cięcia obrócona o 90°; w przekroju rysuje się też to, co widać za płaszczyzną. Kład jest kreskowany tak samo jak przekrój.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-1", "t": "18.10 · Kład a przekrój"}], "partial": false}, {"id": "q25", "type": "abc", "tag": "prz.klady", "q": "Jakimi liniami rysuje się zarysy kładów?", "options": ["kład miejscowy: linią ciągłą cienką; kład przesunięty: linią ciągłą grubą", "kład miejscowy: linią ciągłą grubą; kład przesunięty: linią ciągłą cienką", "oba rodzaje kładów: linią ciągłą grubą", "oba rodzaje kładów: linią ciągłą cienką"], "answer": 0, "explain": "Kład miejscowy leży na widoku, więc jego cienki zarys nie myli się z zarysem przedmiotu; kład przesunięty leży poza widokiem i ma zarys gruby.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-4", "t": "18.10 · Miejscowy i przesunięty"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pk-8", "t": "17.10 · Kłady"}], "partial": false}, {"id": "q26", "type": "abc", "tag": "prz.klady", "q": "Co przedstawiono pod widokiem wałka?", "svg": "<svg viewBox=\"0 0 260 220\" role=\"img\" aria-label=\"Widok wałka od strony rowka pod wpust (podłużne wycięcie z zaokrąglonymi końcami); pod widokiem zakreskowany okrąg z prostokątnym wycięciem u góry, narysowany linią grubą i połączony z widokiem tylko pionową linią punktową cienką, bez liter.\"><rect class=\"sh\" x=\"30.0\" y=\"40.0\" width=\"180.0\" height=\"60.0\" style=\"stroke-width:2.6\"/><path class=\"sh\" d=\"M119,61 L161,61 A9,9 0 0 1 161,79 L119,79 A9,9 0 0 1 119,61 Z\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"18.0\" y1=\"70.0\" x2=\"222.0\" y2=\"70.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><clipPath id=\"rh9\"><path d=\"M149.0,143.4 L153.0,144.9 L156.7,14 02.0\" x2=\"170.0\" y2=\"172.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"146.0\" y1=\"202.0\" x2=\"170.0\" y2=\"178.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"152.0\" y1=\"202.0\" x2=\"170.0\" y2=\"184.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"158.0\" y1=\"202.0\" x2=\"170.0\" y2=\"190.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"164.0\" y1=\"202.0\" x2=\"170.0\" y2=\"196.0\" style=\"stroke-width:.8\"/><\/g><polygon class=\"sh\" points=\"149.0,143.4 153.0,144.9 156.7,147.0 160.0,149.6 163.0,152.7 165.5,156.1 167.5,159.9 168.9,163.9 169.7,168.1 170.0,172.3 169.7,176.6 168.7,180.7 167.2,184.7 165.1,188.4 162.6,191.8 159.5,194.8 156.1,197.3 152.4,199.3 148.4,200.8 144.2,201.7 140.0,202.0 135.8,201.7 131.6,200.8 127.6,199.3 123.9,197.3 120.5,194.8 117.4,191.8 114.9,188.4 112.8,184.7 111.3,180.7 110.3,176.6 110.0,172.3 110.3,168.1 111.1,163.9 112.5,159.9 114.5,156.1 117.0,152.7 120.0,149.6 123.3,147.0 127.0,144.9 131.0,143.4 131.0,149.5 149.0,149.5\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"140.0\" y1=\"30.0\" x2=\"140.0\" y2=\"212.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"100.0\" y1=\"172.0\" x2=\"180.0\" y2=\"172.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>", "options": ["kład przesunięty nieoznaczony", "kład miejscowy", "przekrój poprzeczny oznaczony A–A", "przekrój cząstkowy (wyrwanie)"], "answer": 0, "explain": "Figura leży poza widokiem, ma zarys gruby, nie pokazuje niczego za płaszczyzną i jest połączona z widokiem tylko linią punktową, bez liter: to kład przesunięty nieoznaczony. Kład miejscowy leżałby na widoku i miał zarys cienki.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-4", "t": "18.10 · Miejscowy i przesunięty"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#pk-8", "t": "17.10 · Kłady"}], "partial": false}, {"id": "q27", "type": "long", "tag": "prz.klady", "pts": 1, "q": "Wyjaśnij, czym kład różni się od przekroju, i scharakteryzuj rodzaje kładów (położenie, linia zarysu, oznaczanie, typowe zastosowanie).", "key": "<b>1 pkt<\/b>: definicja z różnicą względem przekroju oraz poprawnie opisane kłady miejscowy i przesunięty (położenie i linia zarysu). <b>0,5 pkt<\/b>: poprawna różnica kład/przekrój, ale rodzaje kładów niepełne, albo zamienione linie zarysu. <b>0 pkt<\/b>: brak różnicy kład/przekrój lub kład opisany jak przekrój.<br><b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>kład to zarys figury płaskiej leżącej w płaszczyźnie przekroju poprzecznego, obrócony o 90° do płaszczyzny rysunku;<\/li><li>w kładzie nie rysuje się niczego, co leży za płaszczyzną cięcia; w przekroju rysuje się też widoczne elementy za płaszczyzną;<\/li><li>kład miejscowy: na widoku przedmiotu, zarys linią ciągłą cienką;<\/li><li>kład przesunięty: poza widokiem, zarys linią ciągłą grubą;<\/li><li>kład przesunięty nieoznaczony: połączony z widokiem linią punktową cienką (osią);<\/li><li>kład przesunięty oznaczony: ślad jak przy przekroju (kreska–kropka–kreska, strzałki, litery), opis A–A, może leżeć w dowolnym miejscu arkusza;<\/li><li>pole kładu kreskuje się jak przekrój;<\/li><li>zastosowanie: rowki pod wpust na wałach, kształt ramion, haków, żeber, prętów; kład jest czytelniejszy od przekroju, bo nie pokazuje stopni wału leżących dalej.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-1", "t": "18.10 · Kład a przekrój"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-2", "t": "18.10 · Metoda i położenie"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-3", "t": "18.10 · Obrót i pominięcia"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-4", "t": "18.10 · Miejscowy i przesunięty"}], "partial": false}, {"id": "q28", "type": "multi", "tag": "prz.uproszczenia", "q": "Które elementy przecięte wzdłużnie (wzdłuż swojej płaszczyzny lub osi) rysuje się w przekroju bez kreskowania?", "options": ["żebro", "śruba", "nit", "wał pełny", "piasta koła", "tuleja"], "answer": [0, 1, 2, 3], "explain": "Żebra oraz łączniki, osie i wały pełne przecięte wzdłużnie zostawia się niekreskowane (w widoku). Piasta i tuleja są częściami drążonymi, których wnętrze pokazuje się właśnie przekrojem.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-7", "t": "17.10 · Łączniki w widoku"}], "partial": true}, {"id": "q29", "type": "abc", "tag": "prz.uproszczenia", "q": "Rysunek przedstawia przekrój płyty z tuleją i dwoma żebrami, z płaszczyzną tnącą prowadzoną wzdłuż żeber. Co jest źle?", "svg": "<svg viewBox=\"0 0 240 165\" role=\"img\" aria-label=\"Przekrój podłużny płyty z tuleją pośrodku i dwoma trójkątnymi żebrami po obu stronach tulei; płaszczyzna tnąca przechodzi przez oś tulei i wzdłuż żeber; zakreskowane są płyta, ścianki tulei i oba żebra.\"><clipPath id=\"rh10\"><path d=\"M20.0,120.0 L20.0,140.0 L110.0,140.0 L110.0,40.0 L100.0,40.0 L100.0,120.0 Z\" clip-rule=\"evenodd\"/><\/clipPath><g clip-path=\"url(#rh10)\"><line class=\"ax\" x1=\"20.0\" y1=\"43.0\" x2=\"23.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"50.0\" x2=\"30.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"57.0\" x2=\"37.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"64.0\" x2=\"44.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"71.0\" x2=\"51.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"78.0\" x2=\"58.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"85.0\" x2=\"65.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"92.0\" x2=\"72.0\" y2=\"40.0\" style=\"stroke-width:.8\"/><line ciwne kierunki kreskowania", "brakuje linii kreskowych krawędzi leżących za płaszczyzną", "żeber przeciętych wzdłużnie nie rysuje się wcale, nawet zarysu"], "answer": 0, "explain": "Żebro przecięte wzdłużnie rysuje się samym zarysem, bez kreskowania. Płyta i tuleja to jedna część, więc mają jedno kreskowanie, a zarys żebra zostaje narysowany linią grubą.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-7", "t": "17.10 · Łączniki w widoku"}], "partial": true}, {"id": "q30", "type": "multi", "tag": "prz.uproszczenia", "q": "Które zasady upraszczania rysunku są poprawne?", "options": ["przerwanie długiego przedmiotu o stałym przekroju zaznacza się linią ciągłą cienką falistą (odręczną) lub zygzakiem", "z jednakowych, powtarzających się otworów rysuje się jeden (lub pierwszy i ostatni), a pozostałe zaznacza liniami cienkimi (krzyżykami środków lub osiami)", "okrąg, na którym rozmieszczono powtarzające się otwory, rysuje się linią punktową cienką", "liczbę powtórzeń podaje się przy linii odniesienia, np. „6×Ø10”", "przy przedmiocie przerwanym podaje się długość taką, jaka wychodzi na rysunku po skróceniu", "przerwanie zaznacza się linią punktową grubą, jak ślad płaszczyzny przekroju"], "answer": [0, 1, 2, 3], "explain": "Przerwanie to linia cienka falista lub zygzak, a wymiar długości podaje się rzeczywisty (całkowity). Powtarzalne elementy rysuje się raz, resztę zaznacza liniami cienkimi (krzyżyki środków), a liczbę podaje zapisem typu 6×Ø.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#u-2", "t": "17.10 · Powtarzające się"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#up-1", "t": "18.10 · Przerwanie"}], "partial": false}, {"id": "q31", "type": "abc", "tag": "prz.radelkowanie", "q": "Co oznacza zapis „Radełkowanie A 0,8 PN-74/M-02498” umieszczony na linii odniesienia?", "options": ["radełkowanie proste o podziałce 0,8 mm", "radełkowanie krzyżowe wypukłe o podziałce 0,8 mm", "radełkowanie proste o głębokości rowków 0,8 mm", "radełkowanie śrubowe prawe o podziałce 0,8 mm"], "answer": 0, "explain": "Litera określa wzór (A: radełkowanie proste, B/C: śrubowe prawe/lewe, F/G: krzyżowe), liczba to podziałka t w mm (odległość wierzchołków), a na końcu jest numer normy.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#u-4", "t": "17.10 · Radełkowanie"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#rd-2", "t": "18.10 · Zapis na półce"}], "partial": false}, {"id": "q32", "type": "sketch", "tag": "prz.proste", "pts": 1, "q": "Tuleja z kołnierzem ma korpus Ø50, kołnierz Ø80 grubości 15, wysokość całkowitą 75 i otwór przelotowy Ø30 (widok obok). Naszkicuj ją jako półwidok-półprzekrój, z osią pionową: lewa połowa jako widok, prawa jako przekrój. Podaj wymiary średnic.", "svg": "<svg viewBox=\"0 0 300 215\" role=\"img\" aria-label=\"Widok tulei z kołnierzem o osi pionowej: korpus Ø50, kołnierz Ø80 grubości 15 u dołu, wysokość całkowita 75, otwór przelotowy Ø30 pokazany liniami kreskowymi.\"><polygon class=\"sh\" points=\"110.0,40.0 190.0,40.0 190.0,136.0 214.0,136.0 214.0,160.0 86.0,160.0 86.0,136.0 110.0,136.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"126.0\" y1=\"40.0\" x2=\"126.0\" y2=\"160.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"sh\" x1=\"174.0\" y1=\"40.0\" x2=\"174.0\" y2=\"160.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"150.0\" y1=\"26.0\" x2=\"150.0\" y2=\"174.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"86.0\" y1=\"160.0\" x2=\"86.0\" y2=\"189.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"214.0\" y1=\"160.0\" x2=\"214.0\" y2=\"189.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"86.0\" y1=\"184.0\" x2=\"214.0\" y2=\"184.0\" style=\"stroke-width:1\"/><polygon class=\
