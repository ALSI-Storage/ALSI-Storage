e:13px\" transform=\"rotate(-90.0 234.0 100.0)\">75<\/text><\/svg>", "key": "<b>1 pkt<\/b>: poprawny podział na widok i przekrój, poprawne linie i kreskowanie, bez błędów z listy. <b>0,5 pkt<\/b>: kształt i podział poprawne, ale jeden błąd z listy (np. linie kreskowe w półwidoku, gruba granica). <b>0 pkt<\/b>: przekrój całkowity zamiast połówkowego, zakreskowany otwór albo brak osi.<br><b>Musi być:<\/b><ul><li>oś symetrii pionowa linią punktową cienką, wysunięta poza zarys; to ona jest granicą widoku i przekroju;<\/li><li>lewa połowa: zarys korpusu i kołnierza linią grubą, bez linii kreskowych otworu;<\/li><li>prawa połowa: ścianka korpusu i kołnierza zakreskowana linią ciągłą cienką pod 45°, w jednym kierunku i z jedną podziałką (jedna część), jako jedno ciągłe pole;<\/li><li>zarys otworu Ø30 w prawej połowie linią grubą; otwór niekreskowany;<\/li><li>bez znaku symetrii na końcach osi i bez śladu płaszczyzny (położenie jednoznaczne);<\/li><li>wymiary średnic całkowite (Ø80, Ø50, Ø30), dla Ø30 linia wymiarowa przedłużona za oś z jednym grotem.<\/li><\/ul><b>Typowe błędy:<\/b> granica narysowana linią ciągłą grubą; linie kreskowe w półwidoku; zakreskowany otwór; dwa kierunki kreskowania w jednej części; wymiar R zamiast Ø.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-pl", "t": "18.10 · Plansza: półwidok-półprzekrój"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-2", "t": "18.10 · Układ i oznaczenie"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-3", "t": "18.10 · Wymiar całkowity"}], "partial": false}, {"id": "q33", "type": "sketch", "tag": "prz.klady", "pts": 1, "q": "Wałek Ø40 o długości 120 ma rowek pod wpust szerokości 12, głębokości 5 i długości 40. Widok obok pokazuje wałek od strony rowka. Naszkicuj ten widok i pod nim kład przesunięty nieoznaczony przez środek rowka.", "svg": "<svg viewBox=\"0 0 260 150\" role=\"img\" aria-label=\"Widok wałka Ø40 o długości 120 od strony rowka pod wpust: rowek długości 40 widoczny jako podłużne wycięcie z zaokrąglonymi końcami.\"><rect class=\"sh\" x=\"30.0\" y=\"40.0\" width=\"180.0\" height=\"60.0\" style=\"stroke-width:2.6\"/><path class=\"sh\" d=\"M119,61 L161,61 A9,9 0 0 1 161,79 L119,79 A9,9 0 0 1 119,61 Z\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"18.0\" y1=\"70.0\" x2=\"222.0\" y2=\"70.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"30.0\" y1=\"100.0\" x2=\"30.0\" y2=\"129.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"210.0\" y1=\"100.0\" x2=\"210.0\" y2=\"129.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"30.0\" y1=\"124.0\" x2=\"210.0\" y2=\"124.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"30.0,124.0 40.0,121.2 40.0,126.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"210.0,124.0 200.0,126.8 200.0,121.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"120.0\" y=\"120.0\" text-anchor=\"middle\" style=\"font-size:13px\">120<\/text><line class=\"ax\" x1=\"110.0\" y1=\"70.0\" x2=\"110.0\" y2=\"21.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"170.0\" y1=\"70.0\" x2=\"170.0\" y2=\"21.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"110.0\" y1=\"26.0\" x2=\"170.0\" y2=\"26.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"110.0,26.0 120.0,23.2 120.0,28.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"170.0,26.0 160.0,28.8 160.0,23.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"140.0\" y=\"22.0\" text-anchor=\"middle\" style=\"font-size:13px\">40<\/text><line class=\"ax\" x1=\"210.0\" y1=\"40.0\" x2=\"237.0\" y2=\"40.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"210.0\" y1=\"100.0\" x2=\"237.0\" y2=\"100.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"232.0\" y1=\"40.0\" x2=\"232.0\" y2=\"100.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"232.0,40.0 234.8,50.0 229.2,50.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"232.0,100.0 229.2,90.0 234.8,90.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"228.0\" y=\"70.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 228.0 70.0)\">Ø40<\/text><\/svg>", "key": "<b>1 pkt<\/b>: kład poza widokiem, z grubym zarysem, kreskowaniem, poprawnym wycięciem rowka i połączeniem osią. <b>0,5 pkt<\/b>: kład poprawny co do kształtu, ale jeden błąd (np. zarys cienki, brak osi łączącej, dorysowane elementy za płaszczyzną). <b>0 pkt<\/b>: brak kładu, kład bez rowka lub narysowany jak przekrój z krawędziami za płaszczyzną.<br><b>Musi być:<\/b><ul><li>widok wałka z osią poziomą (linia punktowa cienka) i rowkiem widocznym jako podłużne wycięcie 40×12 z zaokrąglonymi końcami;<\/li><li>kład poza widokiem (pod nim, na przedłużeniu pionowej osi przez środek rowka): okrąg Ø40 z prostokątnym wycięciem 12×5 po stronie rowka (po obrocie o 90° zwykle u góry; strony wycięcia nie oceniać surowo, jeśli wynika z przyjętego obrotu);<\/li><li>zarys kładu linią ciągłą grubą;<\/li><li>pole kładu zakreskowane linią ciągłą cienką pod 45°, wycięcie rowka niekreskowane;<\/li><li>połączenie kładu z widokiem linią punktową cienką (osią), bez liter i bez śladu z pogrubieniami;<\/li><li>osie symetrii kładu (linie punktowe cienkie);<\/li><li>w kładzie nic poza figurą z płaszczyzny cięcia (żadnych okręgów ani krawędzi leżących dalej).<\/li><\/ul><b>Typowe błędy:<\/b> zarys kładu linią cienką (tak jest tylko przy kładzie miejscowym); dodanie liter A–A bez śladu w widoku; rysowanie krawędzi za płaszczyzną; zakreskowanie wycięcia rowka.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-pl", "t": "18.10 · Plansza: wałek z kładem"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#kl-4", "t": "18.10 · Miejscowy i przesunięty"}], "partial": false}]}, {"id": "04_geometria-wykreslna", "kind": "Dział 4", "title": "Geometria wykreślna", "desc": "Rzuty Monge'a, punkt, prosta i płaszczyzna (ślady, położenia szczególne), przekroje i punkty przebicia wielościanów, przenikanie wielościanów i walców, krzywe płaskie.", "intro": "Test sprawdza czytanie i budowanie rzutów Monge'a oraz konstrukcje na wielościanach i bryłach obrotowych. Rzutnie nazywane są opisowo: pozioma (rzut ′) i pionowa (rzut ″).", "tags": {"gw.monge": "Rzuty Monge'a, ćwiartki, odwzorowanie punktu", "gw.prosta_plaszczyzna": "Prosta i płaszczyzna: ślady, położenia szczególne", "gw.przekroj_wieloscianu": "Przekrój wielościanu płaszczyzną", "gw.przebicia": "Punkty przebicia wielościanu prostą", "gw.przenikanie_wielosc": "Przenikanie wielościanów", "gw.przenikanie_obrot": "Przenikanie brył obrotowych", "gw.krzywe": "Krzywe płaskie"}, "questions": [{"type": "abc", "tag": "gw.monge", "q": "Na czym polega metoda Monge'a?", "options": ["Na rzutowaniu prostokątnym na co najmniej dwie wzajemnie prostopadłe rzutnie, które sprowadza się potem do jednej płaszczyzny rysunku", "Na rzutowaniu środkowym na jedną rzutnię z jednego, skończenie odległego środka rzutów", "Na rzutowaniu ukośnym na jedną rzutnię, z którego odczytuje się wszystkie trzy wymiary", "Na rzutowaniu prostokątnym na jedną rzutnię, przy którym wysokości punktów dopisuje się liczbami"], "answer": 0, "explain": "Jeden rzut daje figurę płaską, z której nie da się odczytać wszystkich wymiarów (np. wysokości), dlatego Monge rzutuje prostokątnie na co najmniej dwie prostopadłe rzutnie. Rzut ukośny na jedną rzutnię to aksonometria, a nie metoda Monge'a.", "id": "q01", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-po", "t": "18.10 · Po co Monge"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-1", "t": "18.10 · Rzutnie"}], "partial": false}, {"type": "abc", "tag": "gw.monge", "noshuffle": true, "q": "Punkt leży nad rzutnią poziomą i za rzutnią pionową. W której ćwiartce leży?", "options": ["I", "II", "III", "IV"], "answer": 1, "explain": "Nad rzutnią poziomą: wysokość dodatnia; za rzutnią pionową: głębokość ujemna. Para (w +, g −) to II ćwiartka. IV ćwiartka ma odwrotnie: w −, g +.", "id": "q02", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-3", "t": "18.10 · Wysokość i głębokość"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-2", "t": "18.10 · Ćwiartki"}], "partial": false}, {"type": "abc", "tag": "gw.monge", "noshuffle": true, "q": "Który z punktów pokazanych w rzutach Monge'a leży w <b>III ćwiartce<\/b>?", "svg": "<svg viewBox=\"0 0 360 215\" role=\"img\" aria-label=\"Rzuty Monge'a czterech punktów P, Q, R, S na osobnych prostych odnoszących; oś x pozioma.\"><line class=\"ax\" x1=\"15.0\" y1=\"110.0\" x2=\"340.0\" y2=\"110.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"344.0\" y=\"114.0\" text-anchor=\"start\" style=\"font-size:13px\">x<\/text><line class=\"ax\" x1=\"60.0\" y1=\"50.0\" x2=\"60.0\" y2=\"160.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"60.0\" cy=\"50.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"60.0\" cy=\"160.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"67.0\" y=\"55.0\" text-anchor=\"start\" style=\"font-size:13px\">P″<\/text><text class=\"\" x=\"67.0\" y=\"165.0\" text-anchor=\"start\" style=\"font-size:13px\">P′<\/text><line class=\"ax\" x1=\"140.0\" y1=\"45.0\" x2=\"140.0\" y2=\"170.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"140.0\" cy=\"170.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"140.0\" cy=\"45.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"147.0\" y=\"175.0\" text-anchor=\"start\" style=\"font-size:13px\">Q″<\/text><text class=\"\" x=\"147.0\" y=\"50.0\" text-anchor=\"start\" style=\"font-size:13px\">Q′<\/text><line class=\"ax\" x1=\"220.0\" y1=\"40.0\" x2=\"220.0\" y2=\"110.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"220.0\" cy=\"80.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"220.0\" cy=\"40.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"227.0\" y=\"85.0\" text-anchor=\"start\" style=\"font-size:13px\">R″<\/text><text class=\"\" x=\"227.0\" y=\"45.0\" text-anchor=\"start\" style=\"font-size:13px\">R′<\/text><line class=\"ax\" x1=\"300.0\" y1=\"110.0\" x2=\"300.0\" y2=\"185.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"300.0\" cy=\"140.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"300.0\" cy=\"185.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"307.0\" y=\"145.0\" text-anchor=\"start\" style=\"font-size:13px\">S″<\/text><text class=\"\" x=\"307.0\" y=\"190.0\" text-anchor=\"start\" style=\"font-size:13px\">S′<\/text><\/svg>", "options": ["P", "Q", "R", "S"], "answer": 1, "explain": "W III ćwiartce wysokość i głębokość są ujemne: rzut pionowy Q″ leży pod osią x, a rzut poziomy Q′ nad nią, czyli odwrotnie niż w I ćwiartce (punkt P). Punkty R i S mają oba rzuty po jednej stronie osi (II i IV ćwiartka).", "id": "q03", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-3", "t": "18.10 · Wysokość i głębokość"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-4", "t": "18.10 · Złożenie rzutni"}], "partial": false}, {"type": "abc", "tag": "gw.monge", "q": "Gdzie w przestrzeni leży punkt A pokazany na rysunku?", "svg": "<svg viewBox=\"0 0 340 180\" role=\"img\" aria-label=\"Rzuty Monge'a punktu A: rzut pionowy na osi x, rzut poziomy pod osią x na tej samej odnoszącej.\"><line class=\"ax\" x1=\"30.0\" y1=\"90.0\" x2=\"320.0\" y2=\"90.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"324.0\" y=\"94.0\" text-anchor=\"start\" style=\"font-size:13px\">x<\/text><line class=\"ax\" x1=\"180.0\" y1=\"90.0\" x2=\"180.0\" y2=\"150.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"180.0\" cy=\"90.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"180.0\" cy=\"150.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"188.0\" y=\"82.0\" text-anchor=\"start\" style=\"font-size:13px\">A″<\/text><text class=\"\" x=\"188.0\" y=\"155.0\" text-anchor=\"start\" style=\"font-size:13px\">A′<\/text><\/svg>", "options": ["Na rzutni poziomej, przed rzutnią pionową", "Na rzutni pionowej, nad rzutnią poziomą", "Na osi x", "W IV ćwiartce, tuż pod rzutnią poziomą"], "answer": 0, "explain": "Rzut pionowy A″ na osi x oznacza wysokość równą zeru, więc punkt leży na rzutni poziomej; rzut poziomy A′ pod osią to głębokość dodatnia (przed rzutnią pionową). Punkt na osi x miałby oba rzuty na osi.", "id": "q04", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-3", "t": "18.10 · Wysokość i głębokość"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-5", "t": "18.10 · Oznaczenia"}], "partial": false}, {"type": "long", "tag": "gw.monge", "pts": 1, "q": "Co to jest geometria wykreślna? Opisz metodę rzutów Monge'a: rzutnie, oś x, ćwiartki, sprowadzenie rzutni do płaszczyzny rysunku i sposób odwzorowania punktu.", "key": "<b>1 pkt:<\/b> poprawna definicja geometrii wykreślnej oraz co najmniej cztery elementy metody Monge'a, w tym dwa rzuty punktu na jednej odnoszącej prostopadłej do osi x. <b>0,5 pkt:<\/b> sama ogólna idea (rzutowanie prostokątne na dwie prostopadłe rzutnie) bez opisu odwzorowania punktu albo z jednym istotnym błędem (np. pomylone ćwiartki, rzutowanie ukośne). <b>0 pkt:<\/b> brak związku z rzutowaniem prostokątnym, pomylenie z aksonometrią. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Geometria wykreślna: dział geometrii zajmujący się odwzorowaniem obiektów przestrzennych na płaszczyźnie i rozwiązywaniem zadań przestrzennych konstrukcyjnie na rysunku; wywodzą się z niej rzuty prostokątne stosowane w rysunku technicznym.<\/li><li>Jeden rzut nie wystarcza, bo z figury płaskiej nie odczyta się wszystkich wymiarów; stąd rzutowanie prostokątne na co najmniej dwie wzajemnie prostopadłe rzutnie (rzuty Monge'a).<\/li><li>Rzutnia pozioma π1 i rzutnia pionowa π2; przecinają się wzdłuż osi x (osi rzutów), która dzieli każdą rzutnię na dwie półrzutnie.<\/li><li>Rzutnie dzielą przestrzeń na cztery ćwiartki I–IV.<\/li><li>Rzutnię poziomą obraca się o 90° wokół osi x, tak że dodatnia półrzutnia pozioma nakrywa ujemną półrzutnię pionową (pod osią x).<\/li><li>Punkt A ma rzut poziomy A′ i pionowy A″; po obrocie leżą one na jednej prostej odnoszącej prostopadłej do osi x; dwa rzuty wyznaczają punkt jednoznacznie.<\/li><li>Wysokość = odległość od rzutni poziomej, głębokość = odległość od rzutni pionowej; ich znaki określają ćwiartkę.<\/li><\/ul>", "id": "q05", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#g-pro", "t": "17.10 · Po co geometria"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-1", "t": "18.10 · Rzutnie"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-2", "t": "18.10 · Ćwiartki"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-4", "t": "18.10 · Złożenie rzutni"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-5", "t": "18.10 · Oznaczenia"}], "partial": false}, {"type": "sketch", "tag": "gw.monge", "pts": 1, "q": "Narysuj oś x i rzuty Monge'a (poziomy i pionowy) czterech punktów, każdy na osobnej odnoszącej; podpisz rzuty: <b>A<\/b> – wysokość 20, głębokość 30; <b>B<\/b> – wysokość 30, głębokość −15; <b>C<\/b> – wysokość 0, głębokość 20; <b>D<\/b> – wysokość −10, głębokość 25 (mm). Przy każdym punkcie zapisz, gdzie leży (ćwiartka albo rzutnia).", "key": "<b>Musi być:<\/b><ul><li>oś x linią cienką, każdy punkt na własnej odnoszącej prostopadłej do osi x (linia cienka), punkty jako małe kółka, rzuty opisane primami (A′ poziomy, A″ pionowy);<\/li><li>A: A″ 20 nad osią, A′ 30 pod osią – I ćwiartka;<\/li><li>B: B″ 30 nad osią, B′ 15 nad osią (oba nad osią) – II ćwiartka;<\/li><li>C: C″ na osi x, C′ 20 pod osią – punkt na rzutni poziomej przed rzutnią pionową;<\/li><li>D: D″ 10 pod osią, D′ 25 pod osią (oba pod osią) – IV ćwiartka.<\/li><\/ul><b>1 pkt:<\/b> wszystkie cztery punkty poprawnie, z podpisami. <b>0,5 pkt:<\/b> jeden punkt błędnie albo brak opisu rzutów. <b>0 pkt:<\/b> dwa lub więcej punktów błędnie. <b>Typowe błędy:<\/b> odkładanie głębokości dodatniej nad osią; zamiana A′ z A″; brak odnoszącej prostopadłej do osi x.", "id": "q06", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-3", "t": "18.10 · Wysokość i głębokość"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-4", "t": "18.10 · Złożenie rzutni"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-5", "t": "18.10 · Oznaczenia"}], "partial": false}, {"type": "multi", "tag": "gw.prosta_plaszczyzna", "q": "Które z wymienionych zestawów elementów wyznaczają płaszczyznę?", "options": ["trzy punkty niewspółliniowe", "prosta i punkt, który na niej nie leży", "dwie proste przecinające się", "dwie proste równoległe", "dwie proste skośne", "trzy punkty leżące na jednej prostej"], "answer": [0, 1, 2, 3], "explain": "Płaszczyznę wyznaczają cztery zestawy: trzy punkty niewspółliniowe, prosta i punkt poza nią, dwie proste przecinające się, dwie proste równoległe. Proste skośne nie leżą w jednej płaszczyźnie, więc żadnej nie wyznaczają.", "id": "q07", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#g-4", "t": "17.10 · Co wyznacza płaszczyznę"}], "partial": false}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Co wskazuje strzałka na rysunku prostej m?", "svg": "<svg viewBox=\"0 0 340 250\" role=\"img\" aria-label=\"Rzuty Monge'a prostej m: rzut pionowy opada w prawo i przecina oś x, rzut poziomy opada w dół w prawo; dwie odnoszące; strzałka wskazuje punkt na rzucie poziomym pod osią x.\"><line class=\"ax\" x1=\"20.0\" y1=\"120.0\" x2=\"320.0\" y2=\"120.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"324.0\" y=\"124.0\" text-anchor=\"start\" style=\"font-size:13px\">x<\/text><line class=\"sh\" x1=\"35.0\" y1=\"25.4\" x2=\"320.0\" y2=\"156.9\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"35.0\" y1=\"79.6\" x2=\"300.0\" y2=\"222.3\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"110.0\" y1=\"60.0\" x2=\"110.0\" y2=\"120.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"240.0\" y1=\"120.0\" x2=\"240.0\" y2=\"190.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"110.0\" cy=\"60.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"110.0\" cy=\"120.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"240.0\" cy=\"120.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><circle class=\"sh\" cx=\"240.0\" cy=\"190.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"50.0\" y=\"20.0\" text-anchor=\"start\" style=\"font-size:13px\">m″<\/text><text class=\"\" x=\"58.0\" y=\"110.0\" text-anchor=\"start\" style=\"font-size:13px\">m′<\/text><line class=\"cy\" x1=\"300.0\" y1=\"236.0\" x2=\"247.0\" y2=\"196.0\" style=\"stroke-width:1.6\"/><polygon class=\"cy\" points=\"243.0,193.0 252.7,196.8 249.3,201.2\" style=\"fill:var(--cy)\"/><\/svg>", "options": ["ślad poziomy prostej H<sub>m<\/sub>", "ślad pionowy prostej V<sub>m<\/sub>", "rzut pionowy śladu poziomego H″<sub>m<\/sub>", "rzut poziomy śladu pionowego V′<sub>m<\/sub>"], "answer": 0, "explain": "Ślad poziomy znajduje się tam, gdzie m″ przecina oś x (wysokość 0): ten punkt na osi to H″<sub>m<\/sub>, a odnosząca w dół do m′ daje sam ślad H<sub>m<\/sub>, wskazany strzałką. Punkt na osi pod V<sub>m<\/sub> to V′<sub>m<\/sub>.", "id": "q08", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-pl", "t": "18.10 · Plansza: prosta m"}], "partial": false}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Prosta w położeniu ogólnym przechodzi z I ćwiartki do IV ćwiartki. Przez jaki punkt przechodzi w miejscu tej zmiany?", "options": ["przez swój ślad poziomy", "przez swój ślad pionowy", "przez punkt na osi x", "przez węzeł płaszczyzny rzutującej"], "answer": 0, "explain": "Ślady są miejscami, w których prosta zmienia ćwiartkę. Z I do IV zmienia się znak wysokości (głębokość zostaje dodatnia), więc prosta przebija rzutnię poziomą, czyli przechodzi przez ślad poziomy.", "id": "q09", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-pl", "t": "18.10 · Plansza: prosta m"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-1", "t": "18.10 · Położenie ogólne"}], "partial": false}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Jak wyglądają rzuty <b>prostej poziomej<\/b> p (równoległej do rzutni poziomej) i jakie ma ona ślady?", "options": ["p″ ∥ x, ma tylko ślad pionowy", "p′ ∥ x, ma tylko ślad poziomy", "p″ ∥ x, ma tylko ślad poziomy", "p′ ∥ x, ma tylko ślad pionowy"], "answer": 0, "explain": "Wszystkie punkty prostej poziomej mają tę samą wysokość, więc jej rzut pionowy jest równoległy do osi x; nie przebija rzutni poziomej, więc ma tylko ślad pionowy. Wariant „p′ ∥ x, tylko ślad poziomy” opisuje prostą czołową.", "id": "q10", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-po", "t": "18.10 · Po co położenia"}], "partial": true}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Jaką prostą przedstawiają rzuty na rysunku?", "svg": "<svg viewBox=\"0 0 300 215\" role=\"img\" aria-label=\"Rzuty Monge'a prostej n: rzut pionowy jest punktem nad osią x, rzut poziomy jest prostą prostopadłą do osi x poniżej osi.\"><line class=\"ax\" x1=\"20.0\" y1=\"100.0\" x2=\"280.0\" y2=\"100.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"284.0\" y=\"104.0\" text-anchor=\"start\" style=\"font-size:13px\">x<\/text><line class=\"ax\" x1=\"150.0\" y1=\"45.0\" x2=\"150.0\" y2=\"100.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"150.0\" y1=\"100.0\" x2=\"150.0\" y2=\"205.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"150.0\" cy=\"45.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"158.0\" y=\"49.0\" text-anchor=\"start\" style=\"font-size:13px\">n″<\/text><text class=\"\" x=\"158.0\" y=\"175.0\" text-anchor=\"start\" style=\"font-size:13px\">n′<\/text><\/svg>", "options": ["prostą celową (pionowo rzutującą, prostopadłą do rzutni pionowej)", "prostą pionową (poziomo rzutującą, prostopadłą do rzutni poziomej)", "prostą czołową", "prostą poziomą"], "answer": 0, "explain": "Rzut pionowy n″ jest punktem, więc prosta jest prostopadła do rzutni pionowej: to prosta celowa (pionowo rzutująca); jej rzut poziomy jest prostopadły do osi x. Prosta pionowa ma odwrotnie: rzut poziomy-punkt pod osią i rzut pionowy prostopadły do x.", "id": "q11", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-3", "t": "18.10 · Prostopadła do rzutni"}], "partial": true}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Rzuty jednoimienne prostych a i b przecinają się na obu rzutniach (patrz rysunek). Jakie są te proste?", "svg": "<svg viewBox=\"0 0 340 255\" role=\"img\" aria-label=\"Rzuty Monge'a dwóch prostych a i b: rzuty pionowe przecinają się, rzuty poziome też się przecinają; z obu punktów przecięcia poprowadzono odnoszące do osi x.\"><line class=\"ax\" x1=\"20.0\" y1=\"125.0\" x2=\"320.0\" y2=\"125.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"324.0\" y=\"129.0\" text-anchor=\"start\" style=\"font-size:13px\">x<\/text><line class=\"sh\" x1=\"40.0\" y1=\"100.0\" x2=\"300.0\" y2=\"30.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"40.0\" y1=\"40.0\" x2=\"300.0\" y2=\"110.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"40.0\" y1=\"160.0\" x2=\"300.0\" y2=\"220.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"40.0\" y1=\"240.0\" x2=\"300.0\" y2=\"170.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"151.4\" y1=\"70.0\" x2=\"151.4\" y2=\"125.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"200.0\" y1=\"125.0\" x2=\"200.0\" y2=\"197.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"305.0\" y=\"34.0\" text-anchor=\"start\" style=\"font-size:13px\">a″<\/text><text class=\"\" x=\"305.0\" y=\"114.0\" text-anchor=\"start\" style=\"font-size:13px\">b″<\/text><text class=\"\" x=\"305.0\" y=\"224.0\" text-anchor=\"start\" style=\"font-size:13px\">a′<\/text><text class=\"\" x=\"305.0\" y=\"174.0\" text-anchor=\"start\" style=\"font-size:13px\">b′<\/text><\/svg>", "options": ["skośne", "przecinające się", "równoległe", "nie da się tego rozstrzygnąć bez trzeciego rzutu"], "answer": 0, "explain": "Proste przecinają się tylko wtedy, gdy punkty przecięcia ich rzutów leżą na jednej odnoszącej prostopadłej do osi x. Tu odnoszące z obu punktów przecięcia są różne, więc to nie jest punkt wspólny: proste są skośne. Trzeci rzut potrzebny jest tylko dla prostych prostopadłych do osi x.", "id": "q12", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#g-5", "t": "17.10 · Dwie proste"}], "partial": false}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Jakie położenie ma płaszczyzna α zadana śladami jak na rysunku?", "svg": "<svg viewBox=\"0 0 300 215\" role=\"img\" aria-label=\"Płaszczyzna alfa zadana śladami: ślad pionowy prostopadły do osi x, ślad poziomy ukośny pod osią x; oba wychodzą z węzła na osi x.\"><line class=\"ax\" x1=\"20.0\" y1=\"110.0\" x2=\"280.0\" y2=\"110.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"284.0\" y=\"114.0\" text-anchor=\"start\" style=\"font-size:13px\">x<\/text><line class=\"sh\" x1=\"180.0\" y1=\"110.0\" x2=\"180.0\" y2=\"18.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"180.0\" y1=\"110.0\" x2=\"50.0\" y2=\"200.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"180.0\" cy=\"110.0\" r=\"3.0\" style=\"stroke-width:1.4\"/><text class=\"\" x=\"188.0\" y=\"32.0\" text-anchor=\"start\" style=\"font-size:13px\">v<tspan dy=\"3\" style=\"font-size:9px\">α<\/tspan><\/text><text class=\"\" x=\"100.0\" y=\"196.0\" text-anchor=\"start\" style=\"font-size:13px\">h<tspan dy=\"3\" style=\"font-size:9px\">α<\/tspan><\/text><text class=\"\" x=\"188.0\" y=\"128.0\" text-anchor=\"start\" style=\"font-size:13px\">X<tspan dy=\"3\" style=\"font-size:9px\">α<\/tspan><\/text><\/svg>", "options": ["poziomo rzutująca (prostopadła do rzutni poziomej)", "pionowo rzutująca (prostopadła do rzutni pionowej)", "podwójnie rzutująca (prostopadła do obu rzutni)", "czołowa (równoległa do rzutni pionowej)"], "answer": 0, "explain": "Płaszczyzna poziomo rzutująca ma ślad pionowy v<sub>α<\/sub> prostopadły do osi x, a ślad poziomy ukośny. Pionowo rzutująca ma odwrotnie (h<sub>α<\/sub> ⊥ x, v<sub>α<\/sub> ukośny); podwójnie rzutująca ma oba ślady na jednej prostej prostopadłej do x.", "id": "q13", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-4", "t": "18.10 · Płaszczyzna i ślady"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pw-1", "t": "18.10 · Dane i płaszczyzna"}], "partial": true}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Płaszczyzna α ma tylko jeden ślad, pokazany na rysunku (pod osią x, równoległy do niej). Jakie to położenie płaszczyzny?", "svg": "<svg viewBox=\"0 0 300 170\" role=\"img\" aria-label=\"Płaszczyzna alfa zadana jednym śladem: prosta pozioma pod osią x, równoległa do osi; innego śladu nie ma.\"><line class=\"ax\" x1=\"20.0\" y1=\"80.0\" x2=\"280.0\" y2=\"80.0\" style=\"stroke-width:1\"/><text class=\"\" x=\"284.0\" y=\"84.0\" text-anchor=\"start\" style=\"font-size:13px\">x<\/text><line class=\"sh\" x1=\"30.0\" y1=\"140.0\" x2=\"270.0\" y2=\"140.0\" style=\"stroke-width:2.6\"/><text class=\"\" x=\"240.0\" y=\"132.0\" text-anchor=\"start\" style=\"font-size:13px\">h<tspan dy=\"3\" style=\"font-size:9px\">α<\/tspan><\/text><\/svg>", "options": ["czołowa (równoległa do rzutni pionowej)", "pozioma (równoległa do rzutni poziomej)", "pionowo rzutująca (prostopadła do rzutni pionowej)", "równoległa do osi x, nachylona do obu rzutni"], "answer": 0, "explain": "Płaszczyzna czołowa przecina tylko rzutnię poziomą, wzdłuż śladu h<sub>α<\/sub> ∥ x, i nie ma śladu pionowego. Pozioma ma odwrotnie – jedyny ślad v<sub>α<\/sub> ∥ x nad osią; płaszczyzna nachylona równoległa do osi x ma oba ślady równoległe do x.", "id": "q14", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-5", "t": "18.10 · Płaszczyzna szczególna"}], "partial": true}, {"type": "abc", "tag": "gw.prosta_plaszczyzna", "q": "Prosta pozioma p leży w płaszczyźnie α zadanej śladami h<sub>α<\/sub>, v<sub>α<\/sub>. Jak wyglądają jej rzuty?", "options": ["p′ ∥ h<sub>α<\/sub>, p″ ∥ x", "p′ ∥ v<sub>α<\/sub>, p″ ∥ x", "p″ ∥ h<sub>α<\/sub>, p′ ∥ x", "p″ ∥ v<sub>α<\/sub>, p′ ∥ x"], "answer": 0, "explain": "Prosta pozioma płaszczyzny jest równoległa do jej śladu poziomego, więc p′ ∥ h<sub>α<\/sub>, a jako pozioma ma p″ ∥ x. Wariant „c″ ∥ v<sub>α<\/sub>, c′ ∥ x” opisuje prostą czołową płaszczyzny.", "id": "q15", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-4", "t": "18.10 · Płaszczyzna i ślady"}], "partial": true}, {"type": "long", "tag": "gw.prosta_plaszczyzna", "pts": 1, "q": "Wyjaśnij, czym są ślady prostej i ślady płaszczyzny w rzutach Monge'a. Opisz, po czym na rysunku rozpoznaje się płaszczyznę poziomą, czołową, poziomo rzutującą i pionowo rzutującą.", "key": "<b>1 pkt:<\/b> poprawne definicje śladów prostej i płaszczyzny oraz poprawny opis co najmniej trzech z czterech położeń szczególnych. <b>0,5 pkt:<\/b> definicje śladów poprawne, a położenia opisane częściowo lub z zamianą „poziomo/pionowo rzutująca”; albo dobre położenia bez definicji śladów. <b>0 pkt:<\/b> brak definicji śladów i błędne położenia. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Ślad poziomy prostej H<sub>m<\/sub> – punkt przebicia rzutni poziomej; ślad pionowy V<sub>m<\/sub> – punkt przebicia rzutni pionowej; w śladach prosta zmienia ćwiartkę.<\/li><li>Konstrukcja: H<sub>m<\/sub> – z przecięcia m″ z osią x odnosząca do m′; V<sub>m<\/sub> – z przecięcia m′ z osią x odnosząca do m″.<\/li><li>Ślady płaszczyzny – krawędzie przecięcia z rzutniami: h<sub>α<\/sub> (z rzutnią poziomą), v<sub>α<\/sub> (z pionową); schodzą się w węźle X<sub>α<\/sub> na osi x.<\/li><li>Pozioma (∥ rzutni poziomej): tylko ślad pionowy, równoległy do osi x; rzuty pionowe jej figur leżą na v<sub>α<\/sub>.<\/li><li>Czołowa (∥ rzutni pionowej): tylko ślad poziomy, równoległy do osi x; rzuty poziome jej figur leżą na h<sub>α<\/sub>.<\/li><li>Poziomo rzutująca (⊥ rzutni poziomej): v<sub>α<\/sub> ⊥ x, h<sub>α<\/sub> ukośny; rzuty poziome jej punktów leżą na h<sub>α<\/sub>.<\/li><li>Pionowo rzutująca (⊥ rzutni pionowej): h<sub>α<\/sub> ⊥ x, v<sub>α<\/sub> ukośny; rzuty pionowe jej punktów leżą na v<sub>α<\/sub>.<\/li><\/ul>", "id": "q16", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-pl", "t": "18.10 · Plansza: prosta m"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-4", "t": "18.10 · Płaszczyzna i ślady"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pp-3", "t": "18.10 · Prostopadła do rzutni"}], "partial": false}, {"type": "abc", "tag": "gw.przekroj_wieloscianu", "q": "Czym są wierzchołki wielokąta przekroju wielościanu płaszczyzną?", "options": ["punktami przebicia płaszczyzny tnącej krawędziami wielościanu", "punktami przecięcia śladów płaszczyzny tnącej z osią x", "rzutami wierzchołków wielościanu na płaszczyznę tnącą", "punktami, w których ściany wielościanu przecinają rzutnie"], "answer": 0, "explain": "Przekrój to zbiór punktów wspólnych ścian i płaszczyzny tnącej; jego wierzchołki to punkty, w których krawędzie wielościanu przebijają płaszczyznę, a boki leżą w ścianach. Rzutowanie wierzchołków bryły na płaszczyznę tnącą nie daje przekroju.", "id": "q17", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pw-po", "t": "18.10 · Po co przekrój bryły"}], "partial": false}, {"type": "abc", "tag": "gw.przekroj_wieloscianu", "noshuffle": true, "q": "Ile boków może mieć <b>co najwyżej<\/b> przekrój graniastosłupa trójkątnego płaszczyzną?", "options": ["3", "4", "5", "6"], "answer": 2, "explain": "Liczba boków przekroju nie przekracza liczby ścian, bo każda ściana daje najwyżej jeden bok. Graniastosłup trójkątny ma 5 ścian (3 boczne i 2 podstawy), więc przekrój może być co najwyżej pięciokątem; 3 to tylko liczba ścian bocznych.", "id": "q18", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pw-po", "t": "18.10 · Po co przekrój bryły"}], "partial": false}, {"type": "abc", "tag": "gw.przekroj_wieloscianu", "q": "Ostrosłup WABC przecięto płaszczyzną pionowo rzutującą α. Jak wyznacza się rzut poziomy A<sub>1<\/sub>′ punktu, w którym α przecina krawędź WA?", "options": ["A<sub>1<\/sub>″ odczytuje się jako przecięcie śladu α″ z W″A″, a A<sub>1<\/sub>′ leży na odnoszącej z A<sub>1<\/sub>″ w przecięciu z W′A′", "A<sub>1<\/sub>′ to przecięcie śladu poziomego h<sub>α<\/sub> z rzutem W′A′", "A<sub>1<\/sub>″ odczytuje się z α″, a A<sub>1<\/sub>′ leży na odnoszącej z A<sub>1<\/sub>″ w przecięciu z rzutem podstawy A′B′C′", "A<sub>1<\/sub>′ to przecięcie odnoszącej z A<sub>1<\/sub>″ z osią x"], "answer": 0, "explain": "Rzut pionowy płaszczyzny pionowo rzutującej jest prostą, więc A<sub>1<\/sub>″ widać od razu na W″A″; punkt leży na krawędzi WA, więc jego rzut poziomy leży na W′A′ (odnosząca). Rzuty poziome punktów takiej płaszczyzny nie leżą na h<sub>α<\/sub>.", "id": "q19", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pw-2", "t": "18.10 · Punkty na krawędziach"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pw-1", "t": "18.10 · Dane i płaszczyzna"}], "partial": false}, {"type": "abc", "tag": "gw.przekroj_wieloscianu", "q": "Po wyznaczeniu przekroju <b>ostrosłupa<\/b> płaszczyzną rysuje się domyślnie tylko jedną część bryły. Którą część się usuwa?", "options": ["część z wierzchołkiem (tzw. czapkę) – zostaje ostrosłup ścięty z podstawą", "część z podstawą – zostaje mniejszy ostrosłup z wierzchołkiem", "żadną – rysuje się całą bryłę, a przekrój tylko się kreskuje", "tę część, która ma mniejszą objętość"], "answer": 0, "explain": "Domyślnie usuwa się część z wierzchołkiem („czapkę”) i patrzy od góry, więc zostaje ostrosłup ścięty; analogicznie przy graniastosłupie usuwa się część z górną podstawą, której się już nie rysuje.", "id": "q20", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pw-3", "t": "18.10 · Figura i kontrola"}], "partial": false}, {"type": "abc", "tag": "gw.przekroj_wieloscianu", "q": "Jak sprawdza się poprawność przekroju <b>graniastosłupa<\/b> i dlaczego tak?", "options": ["powinowactwem – środek przekształcenia jest punktem niewłaściwym, bo krawędzie boczne są równoległe", "kolineacją – środkiem przekształcenia jest wierzchołek bryły", "powinowactwem – środkiem przekształcenia jest środek dolnej podstawy", "kolineacją – środkiem przekształcenia jest środek górnej podstawy"], "answer": 0, "explain": "Ostrosłup sprawdza się kolineacją (środek = wierzchołek W), graniastosłup powinowactwem, czyli kolineacją ze środkiem w nieskończoności, bo krawędzie boczne są równoległe. W obu przypadkach odpowiadające sobie boki podstawy i przekroju muszą się przecinać na jednej prostej (osi).", "id": "q21", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pw-4", "t": "18.10 · Graniastosłup"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#rz-kol", "t": "18.10 · Kolineacja i powinowactwo"}], "partial": false}, {"type": "abc", "tag": "gw.przebicia", "noshuffle": true, "q": "W ilu punktach co najwyżej prosta (nieleżąca w płaszczyźnie żadnej ściany) może przebić wielościan wypukły?", "options": ["1", "2", "tylu, ile ma ścian", "tylu, ile ma krawędzi bocznych"], "answer": 1, "explain": "Prosta może przebić wielościan wypukły co najwyżej w dwóch punktach: przy wejściu i przy wyjściu. Liczba ścian ogranicza liczbę boków przekroju, a nie liczbę punktów przebicia.", "id": "q22", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-po", "t": "18.10 · Po co płaszczyzna pomocnicza"}], "partial": false}, {"type": "abc", "tag": "gw.przebicia", "q": "Jak w ogólnym przypadku wyznacza się punkty przebicia wielościanu prostą f?", "options": ["przez f prowadzi się płaszczyznę pomocniczą, wyznacza przekrój wielościanu tą płaszczyzną i szuka punktów wspólnych f z brzegiem przekroju", "szuka się punktów, w których rzut f′ przecina rzuty krawędzi, i przenosi je odnoszącymi na f″", "wyznacza się ślady prostej f i łączy je z wierzchołkami wielościanu", "przez f prowadzi się płaszczyznę pomocniczą i za punkty przebicia przyjmuje się jej punkty przecięcia z krawędziami wielościanu"], "answer": 0, "explain": "Punkty przebicia leżą w przekroju płaszczyzną pomocniczą zawierającą prostą, więc prosta przebija bryłę tam, gdzie przecina brzeg tego przekroju. Przecięcia płaszczyzny z krawędziami to dopiero wierzchołki przekroju, a przecięcia rzutów f′ z rzutami krawędzi zwykle nie są punktami wspólnymi.", "id": "q23", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-po", "t": "18.10 · Po co płaszczyzna pomocnicza"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-1", "t": "18.10 · Płaszczyzna γ"}], "partial": false}, {"type": "abc", "tag": "gw.przebicia", "q": "Jaką płaszczyznę pomocniczą wygodnie przyjąć przy szukaniu punktów przebicia <b>ostrosłupa<\/b> prostą f w położeniu ogólnym?", "options": ["płaszczyznę przechodzącą przez prostą f i wierzchołek W – przekrój jest wtedy trójkątem", "płaszczyznę pionowo rzutującą przez f – przekrój jest wtedy zawsze trójkątem", "płaszczyznę przez f równoległą do podstawy ostrosłupa", "płaszczyznę przez f i środek podstawy – przekrój jest wtedy prostokątem"], "answer": 0, "explain": "Płaszczyzna przez f i wierzchołek W tnie ostrosłup wzdłuż trójkąta W‑1‑2; wystarczy znaleźć jej ślad na płaszczyźnie podstawy (prosta LK). Płaszczyzna pionowo rzutująca (stosowana przy graniastosłupie) daje w ostrosłupie na ogół wielokąt o większej liczbie boków.", "id": "q24", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-4", "t": "18.10 · Ostrosłup"}], "partial": false}, {"type": "long", "tag": "gw.przebicia", "pts": 1, "q": "Opisz, jak wyznacza się punkty przebicia wielościanu prostą w położeniu ogólnym (osobno dla graniastosłupa i ostrosłupa) i jak rozstrzyga się widoczność prostej.", "key": "<b>1 pkt:<\/b> ogólny przepis (płaszczyzna pomocnicza – przekrój – punkty wspólne z przekrojem), poprawny dobór płaszczyzny dla obu brył i zasada widoczności. <b>0,5 pkt:<\/b> ogólny przepis poprawny, ale bez rozróżnienia brył albo bez widoczności. <b>0 pkt:<\/b> brak płaszczyzny pomocniczej (np. „przecięcia rzutów prostej z rzutami krawędzi”). <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Punkty przebicia – punkty wspólne prostej z wielościanem; wielościan wypukły ma ich najwyżej dwa (wejście i wyjście).<\/li><li>Bezpośrednio wyznacza się je tylko, gdy ściany leżą w płaszczyznach rzutujących albo prosta jest rzutująca.<\/li><li>Ogólnie: (1) przez prostą prowadzi się płaszczyznę pomocniczą, (2) wyznacza się przekrój wielościanu tą płaszczyzną, (3) punkty, w których prosta przecina brzeg przekroju, są punktami przebicia, (4) rozstrzyga się widoczność.<\/li><li>Graniastosłup: płaszczyzna pomocnicza rzutująca, np. pionowo rzutująca, której rzut pionowy pokrywa się z f″; przekrój z przecięć f″ z rzutami krawędzi bocznych, odnoszące na rzut poziomy.<\/li><li>Ostrosłup: płaszczyzna przez prostą f i wierzchołek W (druga prosta m = WF przez dowolny punkt F prostej); jej ślad na płaszczyźnie podstawy wyznacza przekrój – trójkąt W‑1‑2.<\/li><li>Widoczność: część prostej wewnątrz bryły (między punktami przebicia) jest niewidoczna; poza bryłą prosta jest widoczna, o ile nie zasłania jej ściana.<\/li><\/ul>", "id": "q25", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-1", "t": "18.10 · Płaszczyzna γ"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-2", "t": "18.10 · Figura przekroju"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-3", "t": "18.10 · Rzut pionowy i widoczność"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pb-4", "t": "18.10 · Ostrosłup"}], "partial": false}, {"type": "abc", "tag": "gw.przenikanie_wielosc", "q": "Czym jest linia przenikania dwóch wielościanów?", "options": ["zbiorem punktów wspólnych ścian obu wielościanów – najczęściej wielokątem przestrzennym", "zbiorem punktów wspólnych ścian obu wielościanów – zawsze wielokątem płaskim", "obrysem (zarysem) bryły powstałej z połączenia obu wielościanów", "linią łączącą punkty przebicia krawędzi jednego wielościanu przez jedną wybraną płaszczyznę pomocniczą"], "answer": 0, "explain": "Linia przenikania to zbiór punktów wspólnych ścian dwóch wielościanów; tworzy zamkniętą łamaną, najczęściej wielokąt przestrzenny, a nie płaski. Jej wierzchołki to punkty przebicia krawędzi jednej bryły ze ścianami drugiej i odwrotnie.", "id": "q26", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-po", "t": "18.10 · Po co pęk płaszczyzn"}], "partial": false}, {"type": "abc", "tag": "gw.przenikanie_wielosc", "q": "Linia przenikania dwóch wielościanów składa się z dwóch osobnych zamkniętych wielokątów. Jakie to przenikanie?", "options": ["zupełne", "niezupełne", "styczne", "częściowe dwustronne"], "answer": 0, "explain": "Jeden wielokąt przenikania oznacza przenikanie niezupełne, dwa osobne wielokąty – przenikanie zupełne (jedna bryła przechodzi przez drugą na wylot). Te dwie nazwy łatwo zamienić.", "id": "q27", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-po", "t": "18.10 · Po co pęk płaszczyzn"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-pl", "t": "18.10 · Plansza: dwa wielościany"}], "partial": true}, {"type": "abc", "tag": "gw.przenikanie_wielosc", "q": "Bok wielokąta przenikania leży na ścianach, które w danym rzucie są <b>obie niewidoczne<\/b>. Jak się go rysuje?", "options": ["linią kreskową – jest niewidoczny", "linią ciągłą grubą – dwie ściany niewidoczne dają bok widoczny", "linią ciągłą cienką", "nie rysuje się go wcale"], "answer": 0, "explain": "Bok jest widoczny tylko wtedy, gdy obie ściany, na których leży, są widoczne („plus i plus”). Plus i minus oraz minus i minus dają bok niewidoczny – tu nie działa reguła znaków z mnożenia.", "id": "q28", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-3", "t": "18.10 · Łączenie i widoczność"}], "partial": false}, {"type": "long", "tag": "gw.przenikanie_wielosc", "pts": 1, "q": "Co to jest przenikanie wielościanów? Opisz, z czego składa się linia przenikania, jak się ją wyznacza i jak rozstrzyga się jej widoczność.", "key": "<b>1 pkt:<\/b> definicja linii przenikania, opis wierzchołków i boków, kroki algorytmu z płaszczyznami pomocniczymi oraz reguła widoczności. <b>0,5 pkt:<\/b> poprawna definicja i część konstrukcji, ale bez widoczności lub z błędną regułą widoczności (np. „minus i minus = widoczny”). <b>0 pkt:<\/b> sama ogólnikowa odpowiedź („bryły się przecinają”) bez definicji. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Linia przenikania – zbiór punktów wspólnych ścian dwóch wielościanów; zamknięta łamana, najczęściej wielokąt przestrzenny.<\/li><li>Wierzchołki – punkty przebicia krawędzi jednego wielościanu ze ścianami drugiego (i odwrotnie); boki – odcinki wspólne ścian obu wielościanów.<\/li><li>Jeden wielokąt – przenikanie niezupełne, dwa osobne – zupełne.<\/li><li>Algorytm: (1) wyznaczyć punkty przebicia ścian pierwszego wielościanu krawędziami drugiego i odwrotnie (pęk płaszczyzn pomocniczych, np. przez wierzchołek ostrosłupa i krawędź graniastosłupa), (2) połączyć pary punktów leżące na tej samej ścianie, (3) określić widoczność boków i krawędzi.<\/li><li>Widoczność: bok jest widoczny tylko, gdy leży na ścianach widocznych obu wielościanów; w pozostałych przypadkach linia kreskowa; ustala się ją osobno dla każdego rzutu (pomocniczo siatka/tabelka ścian „+/−”).<\/li><\/ul>", "id": "q29", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-po", "t": "18.10 · Po co pęk płaszczyzn"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-1", "t": "18.10 · Dane i rzut boczny"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-3", "t": "18.10 · Łączenie i widoczność"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-pl", "t": "18.10 · Plansza: dwa wielościany"}], "partial": false}, {"type": "abc", "tag": "gw.przenikanie_obrot", "q": "Dwa walce o <b>równych średnicach<\/b> mają prostopadłe, przecinające się osie. Który rysunek poprawnie pokazuje ich rzut na płaszczyznę równoległą do obu osi?", "options": ["<svg viewBox=\"0 0 220 200\" role=\"img\" aria-label=\"Wariant rzutu głównego dwóch walców o prostopadłych osiach.\"><polygon class=\"sh\" points=\"80.0,10.0 140.0,10.0 140.0,70.0 210.0,70.0 210.0,130.0 140.0,130.0 140.0,190.0 80.0,190.0 80.0,130.0 10.0,130.0 10.0,70.0 80.0,70.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"110.0\" y1=\"2.0\" x2=\"110.0\" y2=\"198.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"2.0\" y1=\"100.0\" x2=\"218.0\" y2=\"100.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"sh\" x1=\"80.0\" y1=\"70.0\" x2=\"140.0\" y2=\"130.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"140.0\" y1=\"70.0\" x2=\"80.0\" y2=\"130.0\" style=\"stroke-width:2.6\"/><\/svg>", "<svg viewBox=\"0 0 220 200\" role=\"img\" aria-label=\"Wariant rzutu głównego dwóch walców o prostopadłych osiach.\"><polygon class=\"sh\" points=\"80.0,10.0 140.0,10.0 140.0,70.0 210.0,70.0 210.0,130.0 140.0,130.0 140.0,190.0 80.0,190.0 80.0,130.0 10.0,130.0 10.0,70.0 80.0,70.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"110.0\" y1=\"2.0\" x2=\"110.0\" y2=\"198.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"2.0\" y1=\"100.0\" x2=\"218.0\" y2=\"100.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><path class=\"sh\" d=\"M80,70 Q104,100 80,130\" style=\"stroke-width:2.6\"/><path class=\"sh\" d=\"M140,70 Q116,100 140,130\" style=\"stroke-width:2.6\"/><\/svg>", "<svg viewBox=\"0 0 220 200\" role=\"img\" aria-label=\"Wariant rzutu głównego dwóch walców o prostopadłych osiach.\"><polygon class=\"sh\" points=\"80.0,10.0 140.0,10.0 140.0,70.0 210.0,70.0 210.0,130.0 140.0,130.0 140.0,190.0 80.0,190.0 80.0,130.0 10.0,130.0 10.0,70.0 80.0,70.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"110.0\" y1=\"2.0\" x2=\"110.0\" y2=\"198.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"2.0\" y1=\"100.0\" x2=\"218.0\" y2=\"100.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"sh\" x1=\"80.0\" y1=\"70.0\" x2=\"80.0\" y2=\"130.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"140.0\" y1=\"70.0\" x2=\"140.0\" y2=\"130.0\" style=\"stroke-width:2.6\"/><\/svg>", "<svg viewBox=\"0 0 220 200\" role=\"img\" aria-label=\"Wariant rzutu głównego dwóch walców o prostopadłych osiach.\"><polygon class=\"sh\" points=\"80.0,10.0 140.0,10.0 140.0,70.0 210.0,70.0 210.0,130.0 140.0,130.0 140.0,190.0 80.0,190.0 80.0,130.0 10.0,130.0 10.0,70.0 80.0,70.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"110.0\" y1=\"2.0\" x2=\"110.0\" y2=\"198.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"2.0\" y1=\"100.0\" x2=\"218.0\" y2=\"100.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"sh\" x1=\"80.0\" y1=\"70.0\" x2=\"140.0\" y2=\"70.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"80.0\" y1=\"130.0\" x2=\"140.0\" y2=\"130.0\" style=\"stroke-width:2.6\"/><\/svg>"], "answer": 0, "explain": "Przy równych średnicach i przecinających się osiach linia przenikania rozpada się na dwie krzywe płaskie (elipsy), które w tym rzucie są prostymi tworzącymi „X”. Łuki powstają dopiero przy różnych średnicach.", "id": "q30", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-1", "t": "18.10 · Równe i różne średnice"}], "partial": false}, {"type": "abc", "tag": "gw.przenikanie_obrot", "q": "Walec poziomy o średnicy 40 przenika walec pionowy o średnicy 70 (osie prostopadłe, przecinające się). Jak w rzucie głównym wygląda linia przenikania?", "options": ["łuk wygięty w stronę osi walca o większej średnicy", "łuk wygięty w stronę osi walca o mniejszej średnicy", "dwie proste przecinające się w punkcie przecięcia osi", "odcinek prostej pokrywający się z tworzącą skrajną większego walca"], "answer": 0, "explain": "Przy różnych średnicach linia przenikania jest krzywą, która ugina się ku osi walca większego; proste („X”) powstają tylko przy równych średnicach.", "id": "q31", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-po", "t": "18.10 · Po co punkty na okręgu"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-1", "t": "18.10 · Równe i różne średnice"}], "partial": false}, {"type": "abc", "tag": "gw.przenikanie_obrot", "q": "Dwa walce mają prostopadłe osie, które się przecinają. Co dzieje się w rzucie głównym (płaszczyzna równoległa do obu osi) z niewidoczną częścią linii przenikania?", "options": ["pokrywa się z częścią widoczną, więc rysuje się jedną linię ciągłą", "rysuje się ją osobno linią kreskową obok części widocznej", "jest przesunięta o mimośród i rysuje się ją linią cienką", "nie istnieje – cała linia przenikania jest widoczna z przodu"], "answer": 0, "explain": "Przy osiach przecinających się linia przenikania jest symetryczna względem płaszczyzny obu osi, więc jej tylna (niewidoczna) część pokrywa się z przednią. Osobny fragment kreskowy pojawia się dopiero przy mimośrodzie (osie przesunięte).", "id": "q32", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-1", "t": "18.10 · Równe i różne średnice"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-2", "t": "18.10 · Osie przesunięte"}], "partial": false}, {"type": "sketch", "tag": "gw.przenikanie_obrot", "pts": 1, "q": "Naszkicuj rzut główny i rzut z boku (z lewej) przenikania dwóch walców: walec poziomy Ø60, długość 120; walec pionowy Ø40, wystający 50 ponad oś walca poziomego; osie prostopadłe i przecinające się (oś pionowa przechodzi przez środek długości walca poziomego). Zaznacz linię przenikania i punkty, z których ją wyznaczasz.", "key": "<b>Musi być:<\/b><ul><li>osie obu walców linią punktową cienką, wysunięte poza zarys; zarysy linią ciągłą grubą;<\/li><li>rzut główny: prostokąt walca poziomego i nad nim walec pionowy; tworzące walca pionowego kończą się na górnej tworzącej walca poziomego (punkty skrajne);<\/li><li>linia przenikania: łuk od punktów skrajnych wygięty w dół, ku osi walca większego (poziomego), najniższy punkt na osi walca pionowego (ok. 22 mm nad osią walca poziomego, a nie na jego osi ani na górnej tworzącej);<\/li><li>rzut z boku: walec poziomy jako okrąg Ø60, walec pionowy jako prostokąt szerokości 40; linia przenikania pokrywa się tu z łukiem okręgu;<\/li><li>punkty pośrednie przeniesione z rzutu bocznego odnoszącymi (płaszczyzny pomocnicze tnące oba walce); jedna linia przenikania – niewidoczna część pokrywa się z widoczną.<\/li><\/ul><b>1 pkt:<\/b> oba rzuty, poprawny kierunek wygięcia łuku i rzut boczny z okręgiem. <b>0,5 pkt:<\/b> łuk poprawny tylko w jednym rzucie lub brak osi. <b>0 pkt:<\/b> linia przenikania prosta („X”) albo wygięta w złą stronę. <b>Typowe błędy:<\/b> „X” jak dla równych średnic; łuk wygięty ku osi walca mniejszego; kreskowa kopia linii przenikania.", "id": "q33", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-po", "t": "18.10 · Po co punkty na okręgu"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-1", "t": "18.10 · Równe i różne średnice"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-5", "t": "18.10 · Praca kontrolna"}], "partial": false}, {"type": "abc", "tag": "gw.krzywe", "q": "Stożek obrotowy przecięto płaszczyzną równoległą do <b>jednej<\/b> jego tworzącej. Jaka krzywa powstała?", "options": ["parabola", "hiperbola", "elipsa", "okrąg"], "answer": 0, "explain": "Płaszczyzna równoległa do dokładnie jednej tworzącej daje parabolę; hiperbola powstaje, gdy płaszczyzna jest równoległa do dwóch tworzących (np. równoległa do osi stożka), elipsa – gdy przecina wszystkie tworzące.", "id": "q34", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-4", "t": "18.10 · Przekroje stożka"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#rz-sto", "t": "18.10 · Parabola i hiperbola"}], "partial": false}, {"type": "abc", "tag": "gw.krzywe", "q": "Która krzywa powstaje przez „rozwijanie nici” nawiniętej na koło i jest stosowana na zarysy zębów kół zębatych?", "options": ["ewolwenta", "cykloida", "spirala Archimedesa", "epicykloida"], "answer": 0, "explain": "Ewolwentę wyznacza się, odkładając na stycznych do koła zasadniczego długości łuków, jak przy rozwijaniu nici. Cykloida to tor punktu koła toczącego się po prostej, a spirala Archimedesa służy jako zarys krzywek.", "id": "q35", "links": [], "partial": false}]}, {"id": "05_wymiarowanie", "kind": "Dział 5", "title": "Wymiarowanie", "desc": "Linie, znaki i liczby wymiarowe, zasady wymiarowania, łańcuchy i bazy, układy wymiarów oraz wymiarowanie otworów, promieni, faz i stożków.", "intro": "Test sprawdza zapis wymiarów na rysunku maszynowym: od pojedynczej linii wymiarowej po dobór układu wymiarów. Większość pytań z rysunkiem pyta, czy zapis jest poprawny, i co w nim trzeba poprawić.", "tags": {"wym.zasady": "Zasady podstawowe wymiarowania", "wym.linie": "Linie wymiarowe i pomocnicze", "wym.znaki_ogr": "Znaki ograniczenia linii wymiarowej", "wym.liczby": "Liczby wymiarowe", "wym.znaki": "Znaki wymiarowe", "wym.lancuchy": "Łańcuchy wymiarowe", "wym.bazy": "Bazy wymiarowe", "wym.uklady": "Układy wymiarowania", "wym.okragle": "Elementy okrągłe, otwory w płycie, kształtowniki", "wym.otwory": "Uproszczone wymiarowanie otworów", "wym.promienie_fazy": "Promienie i fazy", "wym.zbieznosc": "Zbieżność, stożki, wielokąty"}, "questions": [{"type": "short", "tag": "wym.zasady", "q": "Przedmiot ma długość 80 mm i narysowano go w podziałce 1:2 (na arkuszu odcinek ma 40 mm). Jaką liczbę wymiarową wpisuje się przy tym odcinku?", "answer": ["80", "80mm"], "explain": "Na rysunku zawsze podaje się wymiary rzeczywiste przedmiotu, niezależnie od podziałki. Wpisanie 40 to pomylenie wymiaru z długością odcinka na arkuszu.", "id": "q01", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#p-3", "t": "17.10 · Wymiar rzeczywisty"}], "partial": false}, {"type": "abc", "tag": "wym.zasady", "svg": "<svg viewBox=\"0 0 320 220\" role=\"img\" aria-label=\"Kształtownik w kształcie litery L z wymiarami 20, 50, 30 i 20.\"><polygon class=\"sh\" points=\"40.0,180.0 240.0,180.0 240.0,100.0 120.0,100.0 120.0,60.0 40.0,60.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"40.0\" y1=\"38.0\" x2=\"120.0\" y2=\"38.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"40.0,38.0 50.0,35.2 50.0,40.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"120.0,38.0 110.0,40.8 110.0,35.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"80.0\" y=\"34.0\" text-anchor=\"middle\" style=\"font-size:13px\">20<\/text><line class=\"ax\" x1=\"40.0\" y1=\"60.0\" x2=\"40.0\" y2=\"33.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"60.0\" x2=\"120.0\" y2=\"33.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"40.0\" y1=\"204.0\" x2=\"240.0\" y2=\"204.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"40.0,204.0 50.0,201.2 50.0,206.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"240.0,204.0 230.0,206.8 230.0,201.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"140.0\" y=\"200.0\" text-anchor=\"middle\" style=\"font-size:13px\">50<\/text><line class=\"ax\" x1=\"40.0\" y1=\"180.0\" x2=\"40.0\" y2=\"209.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"240.0\" y1=\"180.0\" x2=\"240.0\" y2=\"209.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"264.0\" y1=\"180.0\" x2=\"264.0\" y2=\"60.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"264.0,180.0 261.2,170.0 266.8,170.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"264.0,60.0 266.8,70.0 261.2,70.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"260.0\" y=\"120.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 260.0 120.0)\">30<\/text><line class=\"ax\" x1=\"240.0\" y1=\"180.0\" x2=\"269.0\" y2=\"180.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"60.0\" x2=\"269.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"292.0\" y1=\"180.0\" x2=\"292.0\" y2=\"100.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"292.0,180.0 289.2,170.0 294.8,170.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"292.0,100.0 294.8,110.0 289.2,110.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"288.0\" y=\"140.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 288.0 140.0)\">20<\/text><line class=\"ax\" x1=\"240.0\" y1=\"180.0\" x2=\"297.0\" y2=\"180.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"240.0\" y1=\"100.0\" x2=\"297.0\" y2=\"100.0\" style=\"stroke-width:1\"/><\/svg>", "q": "Co jest źle w wymiarowaniu tego kształtownika?", "options": ["Wymiar 20 (wysokość niższej części) leży dalej od zarysu niż gabarytowy 30, więc jego linia pomocnicza przecina linię wymiarową 30.", "Brakuje wymiaru szerokości niższej części; bez niego przedmiot nie jest określony.", "Wymiary wysokości należy podać po lewej stronie rzutu, przy wyższej części.", "Liczby wymiarów pionowych należy obrócić tak, by czytało się je od lewej strony arkusza."], "answer": 0, "explain": "Wymiary mniejsze rysuje się bliżej rzutu, a gabarytowe najdalej, bo odwrotna kolejność daje przecięcie linii wymiarowej. Szerokość niższej części wynika z 50 − 20; jej dopisanie zamknęłoby łańcuch.", "id": "q02", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-kon", "t": "07.11 · Wymiary konieczne"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lw-1", "t": "18.10 · Grupowanie i kolejność"}], "partial": false}, {"type": "abc", "tag": "wym.zasady", "svg": "<svg viewBox=\"0 0 270 340\" role=\"img\" aria-label=\"Rzut główny i rzut z góry schodkowego klocka z wymiarami.\"><polygon class=\"sh\" points=\"40.0,160.0 190.0,160.0 190.0,100.0 100.0,100.0 100.0,70.0 40.0,70.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"40.0\" y1=\"48.0\" x2=\"100.0\" y2=\"48.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"40.0,48.0 50.0,45.2 50.0,50.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"100.0,48.0 90.0,50.8 90.0,45.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"70.0\" y=\"44.0\" text-anchor=\"middle\" style=\"font-size:13px\">20<\/text><line class=\"ax\" x1=\"40.0\" y1=\"70.0\" x2=\"40.0\" y2=\"43.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"100.0\" y1=\"70.0\" x2=\"100.0\" y2=\"43.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"40.0\" y1=\"184.0\" x2=\"190.0\" y2=\"184.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"40.0,184.0 50.0,181.2 50.0,186.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"190.0,184.0 180.0,186.8 180.0,181.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"115.0\" y=\"180.0\" text-anchor=\"middle\" style=\"font-size:13px\">50<\/text><line class=\"ax\" x1=\"40.0\" y1=\"160.0\" x2=\"40.0\" y2=\"189.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"190.0\" y1=\"160.0\" x2=\"190.0\" y2=\"189.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"214.0\" y1=\"160.0\" x2=\"214.0\" y2=\"100.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"214.0,160.0 211.2,150.0 216.8,150.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"214.0,100.0 216.8,110.0 211.2,110.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"210.0\" y=\"130.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 210.0 130.0)\">20<\/text><line class=\"ax\" x1=\"190.0\" y1=\"160.0\" x2=\"219.0\" y2=\"160.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"190.0\" y1=\"100.0\" x2=\"219.0\" y2=\"100.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"240.0\" y1=\"160.0\" x2=\"240.0\" y2=\"70.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"240.0,160.0 237.2,150.0 242.8,150.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"240.0,70.0 242.8,80.0 237.2,80.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"236.0\" y=\"115.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 236.0 115.0)\">30<\/text><line class=\"ax\" x1=\"190.0\" y1=\"160.0\" x2=\"245.0\" y2=\"160.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"100.0\" y1=\"70.0\" x2=\"245.0\" y2=\"70.0\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"40.0\" y=\"225.0\" width=\"150.0\" height=\"75.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"100.0\" y1=\"225.0\" x2=\"100.0\" y2=\"300.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"214.0\" y1=\"300.0\" x2=\"214.0\" y2=\"225.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"214.0,300.0 211.2,290.0 216.8,290.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"214.0,225.0 216.8,235.0 211.2,235.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"210.0\" y=\"262.5\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 210.0 262.5)\">25<\/text><line class=\"ax\" x1=\"190.0\" y1=\"300.0\" x2=\"219.0\" y2=\"300.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"190.0\" y1=\"225.0\" x2=\"219.0\" y2=\"225.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"40.0\" y1=\"324.0\" x2=\"190.0\" y2=\"324.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"40.0,324.0 50.0,321.2 50.0,326.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"190.0,324.0 180.0,326.8 180.0,321.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"115.0\" y=\"320.0\" text-anchor=\"middle\" style=\"font-size:13px\">50<\/text><line class=\"ax\" x1=\"40.0\" y1=\"300.0\" x2=\"40.0\" y2=\"329.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"190.0\" y1=\"300.0\" x2=\"190.0\" y2=\"329.0\" style=\"stroke-width:1\"/><\/svg>", "q": "Rysunek przedstawia rzut główny i rzut z góry klocka. Który wymiar narusza zasady wymiarowania?", "options": ["Wymiar 50 pod rzutem z góry, bo powtarza wymiar z rzutu głównego.", "Wymiar 20 nad rzutem głównym, bo wynika z wymiaru 50.", "Wymiar 25 na rzucie z góry, bo powinien być na rzucie głównym razem z pozostałymi.", "Wymiar 20 po prawej, bo mniejszy wymiar powinien leżeć dalej od zarysu niż 30."], "answer": 0, "explain": "Każdy wymiar podaje się na rysunku tylko raz, w miejscu najczytelniejszym; 50 jest już na rzucie głównym. Wymiar 25 (głębokość) jest konieczny i widać go dopiero na rzucie z góry, a 20 nad rzutem nie wynika z innych wymiarów.", "id": "q03", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-pw", "t": "07.11 · Bez powtórzeń"}], "partial": false}, {"type": "multi", "tag": "wym.zasady", "q": "Które wymiary pomija się na rysunku jako oczywiste?", "options": ["kąt 90° między krawędziami prostopadłymi", "kąt rozstawu sześciu otworów rozmieszczonych równomiernie na okręgu, gdy podano ich liczbę", "stożkowe zakończenie otworu nieprzelotowego po wiertle", "kąty rozstawu otworów rozmieszczonych na okręgu nierównomiernie", "kąt 90°, który jest tolerowany", "głębokość części walcowej otworu nieprzelotowego"], "answer": [0, 1, 2], "explain": "Kąty 0° i 90°, równomierny rozstaw na okręgu przy podanej liczbie elementów i stożek po wiertle są oczywiste. Wymiar tolerowany (albo ważny dla współpracy części) podaje się mimo oczywistości, a przy rozstawie nierównomiernym kąty trzeba podać.", "id": "q04", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zs-oc", "t": "07.11 · Bez oczywistych"}], "partial": false}, {"type": "multi", "tag": "wym.linie", "q": "Które zdania o liniach wymiarowych i pomocniczych liniach wymiarowych są prawdziwe?", "options": ["Linię wymiarową rysuje się linią ciągłą cienką, równolegle do wymiarowanego odcinka.", "Pomocnicza linia wymiarowa wystaje poza linię wymiarową o ok. 2–3 mm.", "Linie wymiarowe średnic okręgów współśrodkowych mogą się przecinać.", "Linia wymiarowa może leżeć na przedłużeniu krawędzi przedmiotu, jeśli skraca to rysunek.", "Pomocnicze linie wymiarowe rysuje się linią punktową cienką, jak osie.", "Przy przedmiocie przedstawionym z przerwaniem linię wymiarową długości też się przerywa."], "answer": [0, 1, 2], "explain": "Linie wymiarowe i pomocnicze to linie ciągłe cienkie, a przecinanie się linii wymiarowych dopuszcza się tylko przy okręgach współśrodkowych. Linia wymiarowa nie może leżeć na przedłużeniu zarysu ani osi, a przy przedmiocie przerwanym jest ciągła.", "id": "q05", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lw-5", "t": "18.10 · Linie pomocnicze"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lw-2", "t": "18.10 · Wyjątek: średnice"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lw-po", "t": "18.10 · Po co ład linii"}], "partial": false}, {"type": "abc", "tag": "wym.linie", "q": "Wałek o średnicy 40 mm narysowano w półwidoku. Który zapis wymiaru średnicy jest poprawny?", "options": ["<svg viewBox=\"0 0 200 135\" role=\"img\" aria-label=\"Półwidok wałka z wymiarem średnicy.\"><polyline class=\"sh\" points=\"40.0,100.0 40.0,40.0 160.0,40.0 160.0,100.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"28.0\" y1=\"100.0\" x2=\"172.0\" y2=\"100.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"20.0\" y1=\"94.0\" x2=\"20.0\" y2=\"106.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"24.0\" y1=\"94.0\" x2=\"24.0\" y2=\"106.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"176.0\" y1=\"94.0\" x2=\"176. 0.0\" y2=\"110.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"120.0,110.0 130.0,107.2 130.0,112.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"180.0,110.0 170.0,112.8 170.0,107.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"150.0\" y=\"106.0\" text-anchor=\"middle\" style=\"font-size:13px\">Ø20<\/text><line class=\"ax\" x1=\"120.0\" y1=\"130.0\" x2=\"120.0\" y2=\"105.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"180.0\" y1=\"130.0\" x2=\"180.0\" y2=\"105.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"90.0\" y1=\"85.0\" x2=\"210.0\" y2=\"85.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"90.0,85.0 100.0,82.2 100.0,87.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"210.0,85.0 200.0,87.8 200.0,82.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"150.0\" y=\"81.0\" text-anchor=\"middle\" style=\"font-size:13px\">Ø40<\/text><line class=\"ax\" x1=\"90.0\" y1=\"170.0\" x2=\"90.0\" y2=\"80.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"210.0\" y1=\"170.0\" x2=\"210.0\" y2=\"80.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"60.0\" y1=\"60.0\" x2=\"240.0\" y2=\"60.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"60.0,60.0 70.0,57.2 70.0,62.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"240.0,60.0 230.0,62.8 230.0,57.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"150.0\" y=\"56.0\" text-anchor=\"middle\" style=\"font-size:13px\">Ø60<\/text><line class=\"ax\" x1=\"60.0\" y1=\"220.0\" x2=\"60.0\" y2=\"55.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"240.0\" y1=\"220.0\" x2=\"240.0\" y2=\"55.0\" style=\"stroke-width:1\"/><\/svg>", "q": "Co jest źle w wymiarowaniu średnic tego wałka?", "options": ["Liczby wymiarowe stoją jedna nad drugą w kolumnie, na osi, która je przecina.", "Największa średnica Ø60 powinna leżeć najbliżej rzutu.", "Linie wymiarowe leżą za daleko od siebie: wymagany odstęp to dokładnie 10 mm.", "Średnice stopni należy wymiarować promieniami, bo wałek jest symetryczny."], "answer": 0, "explain": "Liczby wymiarowe nie mogą być przecięte liniami rysunku ani tworzyć kolumny przy wymiarach równoległych; przesuwa się je na przemian w bok. Kolejność (mniejsza średnica bliżej rzutu) jest poprawna, a obecna norma nie narzuca odstępu 10 mm.", "id": "q10", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lc-3", "t": "18.10 · Nie na osi"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lw-2", "t": "18.10 · Wyjątek: średnice"}], "partial": false}, {"type": "abc", "tag": "wym.liczby", "q": "Liczba wymiarowa 30 ujęta w ramkę prostokątną oznacza:", "options": ["wymiar teoretycznie dokładny (nietolerowany)", "wymiar kontrolny", "wymiar orientacyjny, zamykający łańcuch wymiarowy", "wymiar niezgodny z podziałką rysunku"], "answer": 0, "explain": "Ramka prostokątna to wymiar nominalny nietolerowany, teoretycznie dokładny. Wymiar kontrolny ma ramkę zaokrągloną, orientacyjny stoi w nawiasie okrągłym, a niezgodny z podziałką jest podkreślony cienką linią.", "id": "q11", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lc-4", "t": "18.10 · Nawias i ramki"}], "partial": false}, {"type": "abc", "tag": "wym.liczby", "q": "Na rysunku wałka łańcuch wymiarów długości kończy się liczbą zapisaną w nawiasie okrągłym: (14). Co oznacza taki zapis?", "options": ["wymiar orientacyjny (wypadkowy), podany tylko informacyjnie, bo bez nawiasu zamykałby łańcuch", "wymiar kontrolny, który trzeba sprawdzić po wykonaniu", "wymiar teoretycznie dokładny, bez tolerancji", "wymiar niezgodny z podziałką rysunku"], "answer": 0, "explain": "Nawias okrągły oznacza wymiar orientacyjny, np. zamykający łańcuch: wynika z pozostałych, więc bez nawiasu łańcuch byłby zamknięty. Wymiar kontrolny ma ramkę zaokrągloną, a teoretycznie dokładny ramkę prostokątną.", "id": "q12", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lc-4", "t": "18.10 · Nawias i ramki"}], "partial": false}, {"type": "short", "tag": "wym.znaki", "q": "Jaką literą oznacza się według aktualnej normy grubość płaskiego przedmiotu, np. „… = 10”?", "answer": ["t", "t=", "t=10"], "explain": "Grubość oznacza się literą t (np. t = 10) i wtedy nie trzeba rysować drugiego rzutu. Dawny zapis trzeciego wymiaru po znaku × (np. 60×2×19) nie jest już stosowany.", "id": "q13", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#zw-2", "t": "18.10 · Grubość i inne znaki"}], "partial": false}, {"type": "abc", "tag": "wym.znaki", "q": "Kąt ma 12,5°. Jak zapisuje się go na rysunku według aktualnej normy?", "options": ["12°30'", "12,5°", "12°50'", "12°5'"], "answer": 0, "explain": "Kąty podaje się w stopniach, minutach i sekundach, a 0,5° = 30'. Zapis dziesiętny 12,5° jest według aktualnej normy nieprawidłowy (wyjątkiem są koła zębate).", "id": "q14", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#lc-5", "t": "18.10 · Kąty"}], "partial": false}, {"type": "abc", "tag": "wym.lancuchy", "svg": "<svg viewBox=\"0 0 280 245\" role=\"img\" aria-label=\"Wałek stopniowany z wymiarami długości 20, 35, 25 i 80.\"><polygon class=\"sh\" points=\"40.0,105.0 90.0,105.0 90.0,85.0 177.5,85.0 177.5,95.0 240.0,95.0 240.0,165.0 177.5,165.0 177.5,175.0 90.0,175.0 90.0,155.0 40.0,155.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"28.0\" y1=\"130.0\" x2=\"252.0\" y2=\"130.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"40.0\" y1=\"200.0\" x2=\"90.0\" y2=\"200.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"40.0,200.0 50.0,197.2 50.0,202.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"90.0,200.0 80.0,202.8 80.0,197.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"65.0\" y=\"196.0\" text-anchor=\"middle\" style=\"font-size:13px\"
