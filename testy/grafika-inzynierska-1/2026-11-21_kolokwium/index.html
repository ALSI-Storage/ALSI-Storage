 T łeb stożkowy, Y łeb walcowy w pogłębieniu"], "answer": 0, "explain": "Znak × oznacza nakrętkę, poprzeczka T łeb, a widełki Y łeb stożkowy, który rozchyla się w pogłębieniu. Y nie oznacza samego otworu nieprzelotowego: ten sam znak ma wkręt z łbem stożkowym w otworze przelotowym.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#lacz-r3", "t": "08.11 · Dokładny, uproszczony, umowny"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-plan", "t": "08.11 · Plansza: przelotowe ×3"}], "partial": true}, {"id": "q20", "type": "multi", "tag": "roz.wielowypust", "q": "Które zasady rysowania połączeń wielowypustowych (PN-EN ISO 6413) są poprawne?", "options": ["Dno wrębów w przekroju rysuje się linią ciągłą grubą", "Kreskowanie w przekroju sięga linii dna wrębów", "W widoku dno wrębów rysuje się linią ciągłą cienką", "Linię punktową cienką (powierzchnię podziałową) rysuje się w każdym wielowypuście, także równoległym", "Kreskowanie w przekroju sięga linii wierzchołków, tak jak w gwincie", "Wyjście rowków rysuje się zawsze, linią grubą"], "answer": [0, 1, 2], "explain": "W widoku wielowypust wygląda jak gwint, ale w przekroju dno wrębów jest grube, a kreskowanie kończy się na nim. Linię punktową podziałową dodaje się tylko w wielowypustach ewolwentowych i wielokarbowych; wyjście rowków rysuje się tylko w razie potrzeby.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wiel-r2", "t": "08.11 · Przekrój inny niż gwint"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#roz-wiel", "t": "08.11 · Dlaczego wielowypust inaczej"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wiel-r3", "t": "08.11 · Linia podziałowa"}], "partial": false}, {"id": "q21", "type": "abc", "tag": "roz.wielowypust", "q": "Co oznacza zapis wielowypustu równoległego <b>PN-ISO 14 – 8 × 46 g7 × 50 a11 × 9 f9 – d<\/b>?", "options": ["8 wypustów, średnica wewnętrzna 46, zewnętrzna 50, szerokość wypustu 9, osiowanie na średnicy wewnętrznej; zapis dotyczy wałka", "8 wypustów, średnica wewnętrzna 46, zewnętrzna 50, szerokość wypustu 9, osiowanie na średnicy wewnętrznej; zapis dotyczy otworu piasty", "8 wypustów, średnica wewnętrzna 46, zewnętrzna 50, szerokość wypustu 9, osiowanie na bokach wypustów; zapis dotyczy wałka", "Szerokość wypustu 8, średnica wewnętrzna 46, zewnętrzna 50, liczba wypustów 9, osiowanie na średnicy wewnętrznej; zapis dotyczy wałka"], "answer": 0, "explain": "Kolejność to N × d × D × B – o, a końcowa litera mówi o osiowaniu (d, D albo B). Pola tolerancji małymi literami (g7, a11, f9) dotyczą wałka; ten sam wielowypust w otworze ma H7, H10, H9.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wiel-r4", "t": "08.11 · Opis równoległego"}], "partial": false}, {"id": "q22", "type": "abc", "tag": "roz.wielowypust", "q": "Co oznacza zapis wielowypustu ewolwentowego <b>EXT 30Z × 3m × 45R × 5H<\/b> (PN-ISO 4156)?", "options": ["Wielowypust zewnętrzny (na wale), 30 zębów, moduł 3, kąt zarysu 45° z wyokrąglonym dnem wrębu, klasa dokładności 5", "Wielowypust wewnętrzny (w otworze), 30 zębów, moduł 3, kąt zarysu 45° z wyokrąglonym dnem wrębu, klasa dokładności 5", "Wielowypust zewnętrzny (na wale), 30 zębów, moduł 3, kąt zarysu 45° z płaskim dnem wrębu, klasa dokładności 5", "Wielowypust zewnętrzny (na wale), średnica 30, 3 wypusty, kąt zarysu 45°, promień dna R, klasa dokładności 5"], "answer": 0, "explain": "EXT to wielowypust zewnętrzny (wał), INT wewnętrzny (otwór). Z oznacza liczbę zębów, m moduł, a litera po kącie kształt dna: R wyokrąglone, P płaskie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wiel-r5", "t": "08.11 · Opis ewolwentowego"}], "partial": false}, {"id": "q23", "type": "multi", "tag": "roz.wpust", "q": "Które zdania o <b>wpuście pryzmatycznym<\/b> są prawdziwe?", "options": ["Zabezpiecza piastę przed obrotem względem wału", "Nie wywołuje nacisku promieniowego na wał i piastę", "Jest pasowany ciasno na powierzchniach bocznych", "Centruje piastę względem wału", "Ma zbieżność, dzięki której zaciska piastę na wale", "Rysuje się go osobno na rysunku wykonawczym, jak każdą część"], "answer": [0, 1, 2], "explain": "Wpust jest elementem bez zbieżności: przenosi moment bokami (ciasno na bokach, luz na wysokości), nie dociska i nie centruje piasty. Jako element znormalizowany nie ma rysunku wykonawczego; rysuje się rowki w wale i piaście.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-po", "t": "08.11 · Wpust i jego rola"}], "partial": false}, {"id": "q24", "type": "abc", "tag": "roz.wpust", "q": "Jak na rysunku wykonawczym piasty wymiaruje się <b>głębokość rowka na wpust<\/b> w otworze o średnicy d<sub>0<\/sub>?", "options": ["Wymiarem d<sub>0<\/sub> + t<sub>2<\/sub>, od przeciwległej strony otworu do dna rowka", "Samą głębokością rowka t<sub>2<\/sub>, od krawędzi otworu", "Wymiarem d<sub>0<\/sub> − t<sub>2<\/sub>, od przeciwległej strony otworu do dna rowka", "Wymiarem d<sub>w<\/sub> − t<sub>1<\/sub>, od przeciwległej strony otworu do dna rowka"], "answer": 0, "explain": "W piaście rowek pogłębia otwór, więc wymiar to d<sub>0<\/sub> + t<sub>2<\/sub>. Wymiar d<sub>w<\/sub> − t<sub>1<\/sub> dotyczy rowka na wale, gdzie głębokość odejmuje się od średnicy.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-r3", "t": "08.11 · Rowek w piaście"}], "partial": false}, {"id": "q25", "type": "abc", "tag": "roz.wpust", "q": "Dla wału Ø30 z tabeli dobrano wpust <b>8×7<\/b>. Co oznacza liczba 7?", "options": ["Wysokość wpustu h", "Głębokość rowka na wale t<sub>1<\/sub>", "Głębokość rowka w piaście t<sub>2<\/sub>", "Długość wpustu l"], "answer": 0, "explain": "Zapis b × h podaje szerokość i wysokość wpustu. Wysokość nie jest głębokością rowka: wpust wchodzi częściowo w wał (t<sub>1<\/sub> = 4) i częściowo w piastę (t<sub>2<\/sub> = 3,3). Długość dobiera się z osobnego szeregu.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-r1", "t": "08.11 · Odmiany wpustów"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-r5", "t": "08.11 · h to nie głębokość"}], "partial": false}, {"id": "q26", "type": "long", "tag": "roz.klasyfikacja", "pts": 1, "q": "Przedstaw klasyfikację połączeń części maszyn. Podaj oba kryteria podziału i po przykładzie (lub kilka) dla każdej grupy.", "key": "<b>1 pkt:<\/b> oba kryteria z poprawnym znaczeniem (rozłączne/nierozłączne wg uszkodzenia przy demontażu; pośrednie/bezpośrednie wg obecności łącznika) i poprawne przykłady co najmniej w trzech z czterech grup. <b>0,5 pkt:<\/b> jedno kryterium dobrze opisane z przykładami albo oba kryteria bez wyjaśnienia lub z pojedynczymi błędnymi przykładami. <b>0 pkt:<\/b> sama lista nazw połączeń bez kryteriów albo pomylone rozłączne z nierozłącznymi.<br><b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Rozłączne: demontaż bez uszkodzenia łącznika i łączonych części; nierozłączne: rozłączenie niszczy łącznik lub część.<\/li><li>Pośrednie: występuje element łączący (łącznik); bezpośrednie: łączy kształt samych części lub spoiwo.<\/li><li>Rozłączne pośrednie: wpustowe, klinowe, kołkowe, śrubowe.<\/li><li>Rozłączne bezpośrednie: wielowypustowe, gwintowe (gwint na samych łączonych częściach).<\/li><li>Nierozłączne pośrednie: nitowe. Nierozłączne bezpośrednie: spawane, zgrzewane, klejone.<\/li><li>Uwaga: połączenie gwintowe ze śrubą lub wkrętem ma łącznik, więc bywa zaliczane do pośrednich; obie odpowiedzi są dobre, jeśli są uzasadnione.<\/li><li>Na plus: dodatkowy podział na spoczynkowe i ruchowe.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pol-plan", "t": "08.11 · Plansza: tabela połączeń"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pol-r1", "t": "08.11 · Rozłączne i nierozłączne"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pol-r2", "t": "08.11 · Pośrednie i bezpośrednie"}], "partial": false}, {"id": "q27", "type": "long", "tag": "roz.pol_gwintowe", "pts": 1, "q": "Scharakteryzuj połączenie gwintowe: czym jest, z jakich elementów się składa, jakie są jego odmiany i zalety.", "key": "<b>1 pkt:<\/b> klasyfikacja (rozłączne, kształtowe), elementy (śruba z gwintem zewnętrznym, nakrętka z gwintem wewnętrznym lub otwór gwintowany), co najmniej dwie odmiany i co najmniej dwie zalety. <b>0,5 pkt:<\/b> poprawna ogólna charakterystyka, ale brak odmian albo zalet. <b>0 pkt:<\/b> opis samego gwintu bez połączenia albo błędna klasyfikacja (np. jako nierozłączne).<br><b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Połączenie kształtowe, rozłączne, najczęściej stosowane w budowie maszyn; spoczynkowe: służy do łączenia części i regulacji ich położenia.<\/li><li>Łącznik: śruba (gwint zewnętrzny) i nakrętka (gwint wewnętrzny); wkręt wkręcany w otwór gwintowany części.<\/li><li>Odmiany: a) przelotowe przez łącznik (śruba z nakrętką, zwykle z podkładką), b) przez otwór gwintowany w jednej z części (wkręt, śruba wkręcana), c) bezpośrednie: gwint na samych łączonych częściach.<\/li><li>Zalety: prosta budowa, niezawodność, łatwa regulacja siły zacisku, wielokrotny montaż i demontaż bez uszkodzenia elementów.<\/li><li>Najczęściej gwint metryczny (60°), samohamowny; podkładka wyrównuje i rozkłada naciski; zabezpieczenia, np. podkładka sprężysta, nakrętka koronowa z zawleczką.<\/li><li>Na rysunku: przedstawienie dokładne, uproszczone lub umowne; łączników przeciętych wzdłuż osi się nie kreskuje.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-po", "t": "08.11 · Połączenie gwintowe"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-r1", "t": "08.11 · Pośrednie i bezpośrednie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#lacz-po", "t": "08.11 · Łączniki gwintowe"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-plan", "t": "08.11 · Plansza: przelotowe ×3"}], "partial": false}, {"id": "q28", "type": "long", "tag": "roz.wielowypust", "pts": 1, "q": "Porównaj połączenie wpustowe z wielowypustowym: klasyfikacja, sposób przenoszenia obciążenia, rodzaje, kiedy stosuje się każde z nich i jak się je przedstawia na rysunku.", "key": "<b>1 pkt:<\/b> poprawna klasyfikacja obu (wpustowe rozłączne pośrednie, wielowypustowe rozłączne bezpośrednie) oraz co najmniej trzy trafne cechy porównawcze, w tym kryterium wyboru. <b>0,5 pkt:<\/b> poprawny opis jednego połączenia albo obu, ale bez klasyfikacji lub tylko z jedną różnicą. <b>0 pkt:<\/b> pomylenie połączeń albo opis bez żadnej poprawnej cechy.<br><b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>Wpustowe: łącznik (wpust pryzmatyczny lub czółenkowy) w rowkach wału i piasty; przenosi moment powierzchniami bocznymi; pasowanie ciasne na bokach, luz na wysokości; nie daje nacisku promieniowego i nie centruje piasty.<\/li><li>Wpust dobiera się według średnicy wału (tabela b × h, t<sub>1<\/sub>, t<sub>2<\/sub>); długość z szeregu znormalizowanego; wpustu nie rysuje się osobno, na rysunkach są rowki (wał: d<sub>w<\/sub> − t<sub>1<\/sub>, piasta: d<sub>0<\/sub> + t<sub>2<\/sub>).<\/li><li>Wielowypustowe: wypusty wykonane na samych częściach; zarysy: równoległy (prostokątny), ewolwentowy, wielokarbowy (trójkątny); osiowanie na średnicy wewnętrznej, zewnętrznej lub na bokach.<\/li><li>Wybór: wpust jest tańszy i łatwiejszy w wykonaniu, więc stosuje się go częściej; wielowypust, gdy obliczenia pokażą, że wpust nie przeniesie obciążenia.<\/li><li>Wielowypust rysuje się w uproszczeniu (PN-EN ISO 6413): wierzchołki grubą, dno wrębów cienką w widoku i grubą w przekroju; oznaczenie na linii odniesienia, np. PN-ISO 14 – N × d × D × B – o.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-po", "t": "08.11 · Wpust i jego rola"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wiel-po", "t": "08.11 · Czym jest wielowypust"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#roz-wpust", "t": "08.11 · Wpust a wielowypust"}], "partial": false}, {"id": "q29", "type": "sketch", "tag": "roz.gwint_rysunek", "pts": 1, "q": "Naszkicuj w uproszczeniu: <b>a)<\/b> wałek Ø20 z gwintem zewnętrznym M20 na długości 24 mm od czoła, z fazą na końcu, w widoku z boku i w widoku od czoła; <b>b)<\/b> płytkę z otworem nieprzelotowym z gwintem M12 o długości czynnej 10 mm, w przekroju, wraz z widokiem z góry. Zwymiaruj oba gwinty.", "key": "<b>1 pkt:<\/b> obie części poprawne co do linii (wierzchołki gruba, dno cienka, granica gruba), łuk 3/4 po właściwej stronie w obu widokach od czoła, kreskowanie do linii grubej, wymiary gwintu i długości. <b>0,5 pkt:<\/b> jedna część poprawna albo obie z jednym istotnym błędem. <b>0 pkt:<\/b> gwint rysowany zwojami bez uproszczenia lub pomylone grubości linii w obu częściach.<br><b>Musi być:<\/b><ul><li>a) zarys i wierzchołki linią grubą; dno gwintu linią ciągłą cienką równoległą do zarysu, w odstępie ok. 1,5 mm; granica gwintu (koniec długości czynnej) poprzeczną linią grubą; faza.<\/li><li>a) wymiar M20 i długość 24 od czoła do linii granicy gwintu; oś linią punktową cienką wysuniętą poza zarys.<\/li><li>a) widok od czoła: pełny gruby okrąg Ø20 i cienki łuk 3/4 <i>wewnątrz<\/i>, przerwa w ćwiartce przesunięta poza osie.<\/li><li>b) wierzchołki (mniejsza średnica) linią grubą, dno (większa średnica) cienką na zewnątrz; kreskowanie pod 45° doprowadzone do linii grubej.<\/li><li>b) granica gwintu grubą linią poprzeczną sięgającą linii cienkich; poniżej gładki otwór i stożek po wiertle; gwint nie dochodzi do stożka.<\/li><li>b) widok z góry: gruby okrąg mniejszej średnicy i cienki łuk 3/4 <i>na zewnątrz<\/i>; wymiar M12 i głębokość gwintu 10 (np. M12⌵10).<\/li><li>Typowe błędy: dno gwintu grubą linią; pełny cienki okrąg zamiast 3/4; łuk 3/4 po złej stronie; kreskowanie urwane na linii cienkiej w otworze.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gwr-r1", "t": "08.11 · Zewnętrzny: dno cienką"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gwr-r2", "t": "08.11 · Koniec gwintu"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gwr-r4", "t": "08.11 · Wewnętrzny: kreskowanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gwr-r5", "t": "08.11 · Otwór nieprzelotowy"}], "partial": false}, {"id": "q30", "type": "sketch", "tag": "roz.pol_gwintowe", "pts": 1, "q": "Naszkicuj w I stopniu uproszczenia połączenie dwóch płyt (każda grubości ok. 15 mm) śrubą M12 z łbem sześciokątnym, podkładką i nakrętką: przekrój płaszczyzną przechodzącą przez oś śruby oraz widok od strony nakrętki.", "key": "<b>1 pkt:<\/b> płyty kreskowane przeciwnie, łączniki niekreskowane, otwór z luzem, łeb i nakrętka uproszczone, gwint poprawnie zaznaczony, widok od strony nakrętki z sześciokątem. <b>0,5 pkt:<\/b> poprawny układ połączenia z jednym istotnym błędem (np. zakreskowana śruba albo płyty kreskowane w jednym kierunku) lub brak widoku. <b>0 pkt:<\/b> brak któregoś z elementów połączenia albo rysunek nieczytelny jako połączenie śrubowe.<br><b>Musi być:<\/b><ul><li>Dwie płyty w przekroju, kreskowane pod 45° w przeciwnych kierunkach (sąsiednie części).<\/li><li>Śruba, podkładka i nakrętka niekreskowane (łączniki przecięte wzdłuż osi rysuje się w widoku).<\/li><li>Otwór przelotowy większy niż trzon (widoczny luz).<\/li><li>Łeb i nakrętka jako prostokąty z liniami krawędzi ścian, bez łuków faz (I stopień uproszczenia); koniec śruby wystaje ponad nakrętkę.<\/li><li>Gwint na trzonie: dno linią cienką, granica gwintu linią grubą.<\/li><li>Oś śruby linią punktową cienką wysuniętą poza łeb i koniec śruby.<\/li><li>Widok od strony nakrętki: sześciokąt nakrętki, okrąg podkładki, koniec śruby z gwintem (gruby okrąg i cienki łuk 3/4), osie.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-plan", "t": "08.11 · Plansza: przelotowe ×3"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#lacz-r3", "t": "08.11 · Dokładny, uproszczony, umowny"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#lacz-r4", "t": "08.11 · Gniazdo: wyrwanie"}], "partial": false}, {"id": "q31", "type": "sketch", "tag": "roz.wpust", "pts": 1, "q": "Naszkicuj przekrój poprzeczny połączenia wpustowego wału Ø30 z piastą koła (wpust pryzmatyczny 8×7). Zaznacz, gdzie wpust jest pasowany ciasno, a gdzie jest luz, i zapisz, jak wymiaruje się głębokość rowka na wale i w piaście (oznaczenia literowe wystarczą).", "key": "<b>1 pkt:<\/b> poprawny układ wał–wpust–piasta z kreskowaniem, luz nad wpustem, opis pasowania i oba wymiary głębokości rowków w poprawnej postaci. <b>0,5 pkt:<\/b> poprawny szkic bez wymiarów rowków lub z jednym błędnym wymiarem, albo brak zaznaczenia luzu. <b>0 pkt:<\/b> wpust narysowany jako klin lub bez rowka w jednej z części, albo brak przekroju.<br><b>Musi być:<\/b><ul><li>Wał i piasta w przekroju, kreskowane pod 45° w przeciwnych kierunkach; wpust w rowkach obu części, odróżniony kreskowaniem.<\/li><li>Wpust siedzi częściowo w rowku wału, częściowo w rowku piasty; ciasno na bokach, wąska szczelina (luz) nad górną powierzchnią wpustu.<\/li><li>Szerokość rowka b = 8 w wale i w piaście (tolerancje: wał N9, piasta JS9; na plus).<\/li><li>Głębokość rowka na wale: d<sub>w<\/sub> − t<sub>1<\/sub> (np. 30 − 4 = 26), w piaście: d<sub>0<\/sub> + t<sub>2<\/sub> (np. 30 + 3,3 = 33,3); wymiary od przeciwległej strony.<\/li><li>Osie symetrii linią punktową cienką.<\/li><li>Typowe błędy: h = 7 wpisane jako głębokość rowka; wpust bez luzu na wysokości; wał i piasta kreskowane w tym samym kierunku.<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-plan", "t": "08.11 · Plansza: wał, piasta, wpust"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-r5", "t": "08.11 · h to nie głębokość"}], "partial": false}]}, {"id": "08_polaczenia-nierozlaczne", "kind": "Dział 8", "title": "Połączenia nierozłączne", "desc": "Nity, spoiny i ich oznaczanie, zgrzeiny, połączenia klejone i zszywane.", "intro": "Test sprawdza podział połączeń nierozłącznych, budowę i rodzaje nitów, spoin i zgrzein oraz ich przedstawianie i oznaczanie na rysunku zespołu. Najwięcej pytań dotyczy oznaczania spoin.", "tags": {"nro.nity": "Połączenia nitowe", "nro.nity_rysunek": "Nity na rysunku", "nro.spoina": "Połączenia spawane i rodzaje spoin", "nro.spoina_rysunek": "Oznaczanie spoin na rysunku", "nro.zgrzew": "Połączenia zgrzewane", "nro.klej_zszyw": "Połączenia klejone i zszywane"}, "questions": [{"id": "q01", "type": "abc", "tag": "nro.nity", "q": "Jak dobiera się długość trzpienia nitu?", "options": ["Suma grubości łączonych elementów powiększona o naddatek na uformowanie zakuwki", "Równa sumie grubości łączonych elementów, aby trzpień nie wystawał", "Suma grubości łączonych elementów powiększona o wysokość łba", "Dwukrotna grubość najgrubszego z łączonych elementów"], "answer": 0, "explain": "Zakuwka powstaje ze spęczonego końca trzpienia, więc trzpień musi wystawać poza pakiet blach. Trzpień równy grubości pakietu jest za krótki: zakuwka nie powstanie i połączenie nie spełni funkcji.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-r2", "t": "08.11 cz. 2 · Długość trzpienia"}], "partial": false}, {"id": "q02", "type": "abc", "tag": "nro.nity", "q": "Nit stalowy o średnicy trzonu 12 mm w odpowiedzialnej konstrukcji. Jak się go zakuwa i jaki jest luz otworu?", "options": ["Na gorąco; otwór większy od trzonu o ok. 1 mm", "Na zimno; otwór większy od trzonu o 0,2–0,5 mm", "Na gorąco; otwór większy od trzonu o 0,2–0,5 mm", "Na zimno; otwór większy od trzonu o ok. 1 mm"], "answer": 0, "explain": "Granica to średnica 9 mm: nity większe i w odpowiedzialnych konstrukcjach zakuwa się na gorąco, z otworem większym o 1 mm. Luz 0,2–0,5 mm dotyczy zakuwania na zimno nitów poniżej 9 mm.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-r3", "t": "08.11 cz. 2 · Na zimno, na gorąco"}], "partial": false}, {"id": "q03", "type": "abc", "tag": "nro.nity", "q": "Do jakiej grupy połączeń nitowych (ze względu na przeznaczenie) należy nitowanie kotła lub zbiornika wysokociśnieniowego?", "options": ["Mocno-szczelne", "Szczelne", "Mocne", "Specjalne"], "answer": 0, "explain": "Kocioł i zbiornik wysokociśnieniowy wymagają jednocześnie dużej szczelności i dużej wytrzymałości. Połączenia szczelne dotyczą zbiorników niskociśnieniowych, gdzie wytrzymałość jest mniej ważna.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-r5", "t": "08.11 cz. 2 · Mocne, szczelne…"}], "partial": false}, {"id": "q04", "type": "abc", "tag": "nro.nity", "q": "Jakie połączenie nitowe przedstawia rysunek (przekrój, nity w uproszczeniu)?", "svg": "<svg viewBox=\"0 0 340 130\" role=\"img\" aria-label=\"Przekrój połączenia nitowego dwóch blach, przedstawienie uproszczone\"><clipPath id=\"rh1\"><path d=\"M20.0,64.0 L170.0,64.0 L170.0,80.0 L20.0,80.0 Z\" clip-rule=\"evenodd\"/><\/clipPa  ok. 1 mm)<\/li><li>wg przeznaczenia: mocne (konstrukcje stalowe, mosty), szczelne (zbiorniki niskociśnieniowe), mocno-szczelne (kotły, zbiorniki wysokociśnieniowe), specjalne<\/li><li>wg ułożenia części: zakładkowe, nakładkowe (jedno- i dwustronne, symetryczne lub niesymetryczne)<\/li><li>szwy: jednorzędowe i wielorzędowe (równoległe lub przestawne, w zakosy)<\/li><li>materiał nitu plastyczny i kowalny, tego samego rodzaju co łączone części<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-po", "t": "08.11 cz. 2 · Czym jest nitowanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-r1", "t": "08.11 cz. 2 · Powstawanie zakuwki"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-r5", "t": "08.11 cz. 2 · Mocne, szczelne…"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-r6", "t": "08.11 cz. 2 · Szwy nitowe"}], "partial": false}, {"id": "q07", "type": "abc", "tag": "nro.nity_rysunek", "q": "W oznaczeniu <i>Nit Ø6×30–B PN-88/M-82952<\/i> co oznacza liczba 30?", "options": ["Długość nitu przed zamknięciem", "Długość nitu po zamknięciu (z zakuwką)", "Łączną grubość łączonych blach", "Odstęp między osiami sąsiednich nitów"], "answer": 0, "explain": "W oznaczeniu nitu podaje się średnicę d, długość l przed zamknięciem i numer normy. Po zamknięciu część trzpienia tworzy zakuwkę, więc długość po zamknięciu nie jest wymiarem katalogowym.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nitr-r1", "t": "08.11 cz. 2 · Opis nitu"}], "partial": true}, {"id": "q08", "type": "abc", "tag": "nro.nity_rysunek", "q": "Rysunek przedstawia nit w uproszczeniu, w przekroju połączenia. Jaki nit oznacza ten symbol (oś z poprzeczkami na obu końcach)?", "svg": "<svg viewBox=\"0 0 240 120\" role=\"img "/><line class=\"ax\" x1=\"20.0\" y1=\"62.0\" x2=\"34.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"20.0\" y1=\"69.0\" x2=\"27.0\" y2=\"76.0\" style=\"stroke-width:.8\"/><\/g><polygon class=\"sh\" points=\"20.0,60.0 220.0,60.0 220.0,76.0 20.0,76.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"120.0\" y1=\"37.0\" x2=\"120.0\" y2=\"83.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"111.0\" y1=\"37.0\" x2=\"129.0\" y2=\"37.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"111.0\" y1=\"83.0\" x2=\"129.0\" y2=\"83.0\" style=\"stroke-width:2.6\"/><\/svg>", "options": ["Nit z łbem kulistym i zakuwką kulistą", "Nit z łbem płaskim i zakuwką kulistą", "Nit z łbem płaskim i zakuwką płaską", "Nit specjalny, jednostronnie zamykany (zrywalny)"], "answer": 0, "explain": "Poprzeczka na końcu osi koduje łeb lub zakuwkę kulistą (tak samo nit rurkowy z odwijanymi końcami). Łeb płaski oznacza się widełkami „V” po swojej stronie, a nity specjalne ukośną kreską i strzałką.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nitr-r2", "t": "08.11 cz. 2 · Symbol i oś"}], "partial": true}, {"id": "q09", "type": "multi", "tag": "nro.nity_rysunek", "q": "Na rysunku zespołu występuje kilka rodzajów nitów. Jak rozróżnia się je na rysunku?", "options": ["Zaczernia się wybrane ćwiartki symbolu nitu (ten sam rodzaj = to samo oznaczenie) i dodaje legendę", "Oznacza się nity literami (A, B…) i objaśnia je w adnotacji nad wykazem części", "Osie nitów różnych rodzajów rysuje się różnymi grubościami linii", "Krzyżyki osi nitów różnych rodzajów rysuje się w różnej długości"], "answer": [0, 1], "explain": "Stosuje się symbole (zaczernione ćwiartki) z legendą albo litery z objaśnieniem. Grubość linii i długość krzyżyków nie służą do kodowania rodzaju nitu. Gdy nity są jednakowe, opisuje się raz, przy jednym nicie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nitr-r3", "t": "08.11 cz. 2 · Różne nity"}], "partial": false}, {"id": "q10", "type": "sketch", "tag": "nro.nity_rysunek", "pts": 1, "q": "Naszkicuj przekrój połączenia nitowego nakładkowego dwustronnego dwóch blach (blachy na styk, po jednym nicie z każdej strony styku). Nity jednakowe, z łbem kulistym i zakuwką kulistą; przedstaw je w uproszczeniu i opisz linią odniesienia, np. <i>Nit Ø6×30–B<\/i> + norma.", "key": "<b>Musi być:<\/b><ul><li>dwie blachy na styk i dwie nakładki, po jednej z każdej strony (góra i dół)<\/li><li>kreskowanie pod 45°, sąsiednie części kreskowane w różnych kierunkach lub z różną gęstością<\/li><li>nity w uproszczeniu: oś linią grubą przez nakładki i blachę, poprzeczki na obu końcach (łeb i zakuwka kuliste); co najmniej jeden nit po każdej stronie styku<\/li><li>opis na półce linii odniesienia przy jednym nicie: średnica × długość, odmiana, numer normy (nity jednakowe, więc opis raz)<\/li><\/ul><b>1 pkt:<\/b> wszystkie elementy. <b>0,5 pkt:<\/b> poprawny układ blach i nakładek, ale błąd w jednym z elementów: symbol nitu, kreskowanie albo opis. <b>0 pkt:<\/b> połączenie zakładkowe zamiast nakładkowego, brak nitów albo błędy w więcej niż jednym z elementów: symbol nitu, kreskowanie, opis. <b>Typowe błędy:<\/b> jedna nakładka (to jednostronne), jednakowe kreskowanie stykających się części, rysowanie pełnego kształtu łba zamiast symbolu.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nit-r5d", "t": "08.11 cz. 2 · Zakładka i nakładka"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nitr-plan", "t": "08.11 cz. 2 · Plansza: blachy z nitami"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#nitr-r3", "t": "08.11 cz. 2 · Różne nity"}], "partial": false}, {"id": "q11", "type": "abc", "tag": "nro.spoina", "q": "Czym jest <b>spoiwo<\/b>?", "options": ["Dodatkowym materiałem, który stapia się z materiałem podstawowym i tworzy spoinę", "Miejscem bezpośredniego połączenia spawanych części", "Zewnętrzną powierzchnią spoiny od strony jej układania", "Strefą materiału rodzimego zmienioną przez ciepło spawania"], "answer": 0, "explain": "Spoiwo to materiał dodatkowy, a spoina to miejsce połączenia, które z niego (i ze stopionego materiału podstawowego) powstaje. Druga opcja to definicja spoiny, nie spoiwa.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spaw-po", "t": "08.11 cz. 2 · Spawanie"}], "partial": false}, {"id": "q12", "type": "abc", "tag": "nro.spoina", "q": "Czym jest <b>grań<\/b> spoiny?", "options": ["Zewnętrzną powierzchnią ściegu przetapiającego gardziel rowka, przeciwległą do lica", "Zewnętrzną powierzchnią spoiny od strony jej układania (od strony elektrody)", "Przygotowanym rowkiem, w który układa się spoinę", "Linią, na której powierzchnia spoiny styka się z materiałem rodzimym"], "answer": 0, "explain": "Lico jest od strony układania spoiny, a grań po przeciwnej stronie, pod gardzielą. Opis „od strony elektrody” to lico; przygotowany rowek to rowek spawalniczy (gardziel to jego wąska część u dołu), a styk spoiny z materiałem rodzimym to brzeg spoiny.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spaw-plan", "t": "08.11 cz. 2 · Plansza: złącze V"}], "partial": false}, {"id": "q13", "type": "abc", "tag": "nro.spoina", "q": "Przy jakiej zawartości węgla stal uznaje się za dobrze spawalną?", "options": ["C &lt; 0,25%", "C &lt; 0,45%", "C &gt; 0,25%", "C &lt; 2,11%"], "answer": 0, "explain": "Spawalność stali maleje ze wzrostem zawartości węgla; za dobrze spawalną uznaje się stal o C &lt; 0,25%. Wartość 0,45% to granica przelicznika węglowego C<sub>e<\/sub>, który uwzględnia też dodatki stopowe.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.htm yprostokątna pionowa po lewej). Znak z kreską pionową i ukośną to spoina ½V, z ukośnym ramieniem na trzonku ½Y.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r3", "t": "08.11 cz. 2 · Znaki spoin"}], "partial": false}, {"id": "q18", "type": "abc", "tag": "nro.spoina_rysunek", "q": "Gdzie jest lico spoiny V oznaczonej jak na rysunku?", "svg": "<svg viewBox=\"0 0 330 150\" role=\"img\" aria-label=\"Oznaczenie spoiny V na linii odniesienia; linia kreskowa nad linią ciągłą, znak pod linią ciągłą\"><line class=\"sh\" x1=\"25.0\" y1=\"125.0\" x2=\"85.0\" y2=\"125.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"120.0\" y1=\"60.0\" x2=\"55.0\" y2=\"125.0\" style=\"stroke-width:1\"/><polygon class=\"sh\" points=\"55.0,125.0 60.1,115.9 64.1,119.9\" style=\"fill:var(--soft)\"/><line class=\"sh\" x1=\"120.0\" y1=\"60.0\" x2=\"310.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"124.0\" y1=\"54.0\" x2=\"310.0\" y2=\"54.0\" style=\"stroke-width:1.2;stroke-dasharray:6 3\"/><polyline class=\"sh\" points=\"201.0,73.0 210.0,60.0 219.0,73.0\" style=\"stroke-width:1.6\"/><\/svg>", "options": ["Od strony wskazanej strzałką", "Po stronie przeciwnej niż strzałka", "Po obu stronach: spoina jest symetryczna", "Nie da się określić, bo linia kreskowa leży nad linią ciągłą"], "answer": 0, "explain": "Znak przylega do linii ciągłej, więc lico jest od strony strzałki („spawanie od strony strzałki”). O stronie decyduje to, przy której linii stoi znak, a nie to, czy linia kreskowa jest nad, czy pod ciągłą.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r4", "t": "08.11 cz. 2 · Linia identyfikacyjna"}], "partial": false}, {"id": "q19", "type": "abc", "tag": "nro.spoina_rysunek", "q": "Gdzie jest lico spoiny V oznaczonej jak na rysunku?", "svg": "<svg viewBox=\"0 0 330 150\" role=\"img\" aria-label=\"Oznaczenie spoiny V na linii odniesienia; linia ciągła nad linią kreskową, znak pod linią kreskową\"><line class=\"sh\" x1=\"25.0\" y1=\"125.0\" x2=\"85.0\" y2=\"125.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"120.0\" y1=\"60.0\" x2=\"55.0\" y2=\"125.0\" style=\"stroke-width:1\"/><polygon class=\"sh\" points=\"55.0,125.0 60.1,115.9 64.1,119.9\" style=\"fill:var(--soft)\"/><line class=\"sh\" x1=\"120.0\" y1=\"60.0\" x2=\"310.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"124.0\" y1=\"66.0\" x2=\"310.0\" y2=\"66.0\" style=\"stroke-width:1.2;stroke-dasharray:6 3\"/><polyline class=\"sh\" points=\"201.0,79.0 210.0,66.0 219.0,79.0\" style=\"stroke-width:1.6\"/><\/svg>", "options": ["Po stronie przeciwnej niż strzałka", "Od strony wskazanej strzałką", "Po obu stronach: spoina jest symetryczna", "Nie da się określić bez numeru metody spawania w rozwidleniu"], "answer": 0, "explain": "Znak stoi przy linii kreskowej (identyfikacyjnej), więc lico jest po stronie przeciwnej, a strzałka wskazuje grań. Dla spoiny symetrycznej linię kreskową by pominięto.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r4", "t": "08.11 cz. 2 · Linia identyfikacyjna"}], "partial": false}, {"id": "q20", "type": "abc", "tag": "nro.spoina_rysunek", "q": "Kiedy w oznaczeniu spoiny pomija się linię kreskową (identyfikacyjną)?", "options": ["Dla spoin symetrycznych", "Dla spoin pachwinowych", "Gdy lico jest od strony strzałki", "Dla spoin wykonywanych w montażu"], "answer": 0, "explain": "Linia identyfikacyjna rozróżnia stronę strzałki i stronę przeciwną; przy spoinie symetrycznej obie strony są takie same, więc jest zbędna. Lico od strony strzałki wymaga linii kreskowej, bo to ona pokazuje, że znak stoi przy linii ciągłej.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r4", "t": "08.11 cz. 2 · Linia identyfikacyjna"}], "partial": false}, {"id": "q21", "type": "abc", "tag": "nro.spoina_rysunek", "q": "Co oznacza oznaczenie spoiny pokazane na rysunku?", "svg": "<svg viewBox=\"0 0 330 140\" role=\"img\" aria-label=\"Oznaczenie spoiny na linii odniesienia: a5, znak trójkąta, 300\"><line class=\"sh\" x1=\"25.0\" y1=\"118.0\" x2=\"85.0\" y2=\"118.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"110.0\" y1=\"60.0\" x2=\"55.0\" y2=\"118.0\" style=\"stroke-width:1\"/><polygon class=\"sh\" points=\"55.0,118.0 59.8,108.8 63.9,112.7\" style=\"fill:var(--soft)\"/><line class=\"sh\" x1=\"110.0\" y1=\"60.0\" x2=\"300.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"114.0\" y1=\"66.0\" x2=\"300.0\" y2=\"66.0\" style=\"stroke-width:1.2;stroke-dasharray:6 3\"/><polygon class=\"sh\" points=\"193.0,60.0 193.0,47.0 207.0,60.0\" style=\"stroke-width:1.6\"/><text class=\"\" x=\"186.0\" y=\"55.0\" text-anchor=\"end\" style=\"font-size:15px\">a5<\/text><text class=\"\" x=\"214.0\" y=\"55.0\" text-anchor=\"start\" style=\"font-size:15px\">300<\/text><\/svg>", "options": ["Spoina pachwinowa o grubości (wysokości trójkąta) 5 mm i długości 300 mm", "Spoina pachwinowa o boku trójkąta 5 mm i długości 300 mm", "Spoina pachwinowa o grubości 5 mm, przerywana, z przerwami po 300 mm", "Spoina pachwinowa długości 5 mm, powtórzona 300 razy"], "answer": 0, "explain": "Litera <i>a<\/i> przed liczbą oznacza wysokość trójkąta (grubość spoiny); wymiar przekroju stoi przed znakiem, długość za znakiem. Bok trójkąta zapisuje się literą <i>z<\/i>; przerwę spoiny przerywanej podaje się w nawiasie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r5", "t": "08.11 cz. 2 · Wymiary spoiny"}], "partial": false}, {"id": "q22", "type": "long", "tag": "nro.spoina_rysunek", "pts": 1, "q": "Opisz budowę oznaczenia spoiny na rysunku: z jakich elementów składa się linia odniesienia, gdzie umieszcza się znak, wymiary i znaki dodatkowe oraz jaką rolę pełni linia identyfikacyjna.", "key": "<b>1 pkt:<\/b> elementy linii odniesienia, reguła strony lica (znak przy linii ciągłej / kreskowej) i zasada „wymiar przekroju przed znakiem, długość za znakiem”. <b>0,5 pkt:<\/b> opisana linia identyfikacyjna, ale reguła strony lica niepełna lub z jednym błędem; albo poprawna reguła strony lica bez opisu pozostałych elementów. <b>0 pkt:<\/b> brak linii identyfikacyjnej i reguły strony lica, albo odwrócona reguła strony lica, albo zamieniona kolejność wymiaru przekroju i długości. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>strzałka linii odniesienia wskazuje złącze; półka to linia ciągła; linia identyfikacyjna kreskowa równoległa do półki, nad nią lub pod nią; rozwidlenie na końcu półki<\/li><li>znak elementarny (podobny do kształtu spoiny) na półce; znak przy linii ciągłej = lico od strony strzałki, znak przy linii kreskowej = lico po stronie przeciwnej<\/li><li>dla spoin symetrycznych linię kreskową pomija się<\/li><li>wymiar przekroju poprzecznego (a lub z, z literą) przed znakiem; długość za znakiem; brak długości = spoina ciągła na całej długości<\/li><li>spoina przerywana: n × L (e), gdzie n liczba odcinków, L długość odcinka, (e) przerwa<\/li><li>znaki dodatkowe: kształt lica (płaskie, wypukłe, wklęsłe) przy znaku; kółko na załamaniu = spoina po obwodzie; chorągiewka = spoina montażowa<\/li><li>w rozwidleniu: metoda spawania, wymagania jakościowe, materiały dodatkowe<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-plan", "t": "08.11 cz. 2 · Plansza: linia odniesienia"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r4", "t": "08.11 cz. 2 · Linia identyfikacyjna"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r5", "t": "08.11 cz. 2 · Wymiary spoiny"}], "partial": false}, {"id": "q23", "type": "sketch", "tag": "nro.spoina_rysunek", "pts": 1, "q": "Naszkicuj oznaczenie spoiny pachwinowej o grubości <i>a<\/i> = 4 mm, wykonanej na całym obwodzie, z licem od strony wskazanej strzałką. Podpisz elementy linii odniesienia.", "key": "<b>Musi być:<\/b><ul><li>strzałka linii odniesienia z grotem na złączu, półka linią ciągłą, linia identyfikacyjna kreskowa równoległa do półki<\/li><li>trójkąt prostokątny (przyprostokątna pionowa po lewej) przylegający do linii <b>ciągłej<\/b>, po stronie przeciwnej niż linia kreskowa<\/li><li>„a4” przed znakiem (z literą a)<\/li><li>kółko na załamaniu linii odniesienia (spoina po obwodzie)<\/li><li>podpisy: strzałka, półka (linia ciągła), linia identyfikacyjna; rozwidlenie opcjonalne<\/li><\/ul><b>1 pkt:<\/b> wszystkie elementy. <b>0,5 pkt:<\/b> jeden błąd (np. brak kółka, liczba bez litery a, brak podpisów). <b>0 pkt:<\/b> znak przy linii kreskowej (to lico po stronie przeciwnej), brak linii identyfikacyjnej i znaku, albo dwa lub więcej błędów. <b>Typowe błędy:<\/b> „4” bez litery (nie wiadomo, czy a, czy z), grubość za znakiem, kółko na końcu półki zamiast na załamaniu.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r5d", "t": "08.11 cz. 2 · a5 ◺ 300"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#spawr-r3d", "t": "08.11 cz. 2 · Tabela znaków"}], "partial": false}, {"id": "q24", "type": "abc", "tag": "nro.zgrzew", "q": "Czym zgrzewanie różni się od spawania?", "options": ["Miejsce łączenia nagrzewa się do stanu plastycznego lub nadtopienia i dociska, bez metalu dodatkowego", "Materiał łączy się wyłącznie przez stopienie z dodatkiem spoiwa, bez docisku", "Części łączy się samym dociskiem na zimno, bez nagrzewania", "Zgrzewanie wymaga osłony gazowej i spoiwa w postaci drutu"], "answer": 0, "explain": "Zgrzewanie łączy siłą docisku materiał nagrzany do stanu plastycznego lub nadtopienia i nie używa metalu dodatkowego. Stopienie z dodatkiem spoiwa to opis spawania.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#roz-zgrz", "t": "08.11 cz. 2 · Zgrzewanie a spawanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#zgrz-po", "t": "08.11 cz. 2 · Zgrzewanie"}], "partial": false}, {"id": "q25", "type": "abc", "tag": "nro.zgrzew", "q": "W którym zgrzewaniu jedna z łączonych części musi mieć wcześniej wykonany występ?", "options": ["Garbowym", "Punktowym", "Liniowym", "Doczołowym"], "answer": 0, "explain": "W zgrzewaniu garbowym łączy się części w miejscach wcześniej wykonanych występów (garbów). W punktowym prąd płynie między elektrodami dociskającymi płaskie blachy, bez przygotowanego występu.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#zgrz-r2", "t": "08.11 cz. 2 · Garbowe i doczołowe"}], "partial": false}, {"id": "q26", "type": "abc", "tag": "nro.zgrzew", "q": "Co przedstawia rysunek (widok blachy; okrąg i łuki linią kreskową grubą, osie linią punktową cienką)?", "svg": "<svg viewBox=\"0 0 260 150\" role=\"img\" aria-label=\"Widok blachy z zaznaczonym połączeniem w jednym punkcie\"><line class=\"sh\" x1=\"20.0\" y1=\"20.0\" x2=\"240.0\" y2=\"20.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"20.0\" y1=\"130.0\" x2=\"240.0\" y2=\"130.0\" style=\"stroke-width:2.6\"/><path class=\"ax\" d=\"M20.0,20.0 Q14.0,33.8 20.0,47.5 Q26.0,61.2 20.0,75.0 Q14.0,88.8 20.0,102.5 Q26.0,116.2 20.0,130.0\" style=\"stroke-width:1\"/><path class=\"ax\" d=\"M240.0,20.0 Q234.0,33.8 240.0,47.5 Q246.0,61.2 240.0,75.0 Q234.0,88.8 240.0,102.5 Q246.0,116.2 240.0,130.0\" style=\"stroke-width:1\"/><circle class=\"sh\" cx=\"130.0\" cy=\"75.0\" r=\"24.0\" style=\"stroke-width:2.6;stroke-dasharray:6 3\"/><path class=\"sh\" d=\"M122,52 Q112,75 122,98\" style=\"stroke-width:2.6;stroke-dasharray:6 3\"/><path class=\"sh\" d=\"M138,52 Q148,75 138,98\" style=\"stroke-width:2.6;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"96.0\" y1=\"75.0\" x2=\"164.0\" y2=\"75.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"130.0\" y1=\"41.0\" x2=\"130.0\" y2=\"109.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>", "options": ["Zgrzeinę punktową w widoku", "Spoinę bezotworową punktową w widoku", "Spoinę otworową okrągłą w widoku", "Nit w widoku od strony łba"], "answer": 0, "explain": "Zgrzeinę punktową w widoku rysuje się okręgiem i łukami linią kreskową grubą; w przekroju jej zarys jest linią ciągłą grubą, a obszar kropkowany. Spoinę bezotworową punktową rysuje się okręgiem linią ciągłą z osiami, bez łuków.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#zgrz-r3", "t": "08.11 cz. 2 · Zgrzeina na rysunku"}], "partial": false}, {"id": "q27", "type": "long", "tag": "nro.zgrzew", "pts": 1, "q": "Scharakteryzuj połączenia nierozłączne: podziel je na pośrednie i bezpośrednie, wyjaśnij różnicę między spawaniem a zgrzewaniem i wymień rodzaje zgrzein.", "key": "<b>1 pkt:<\/b> poprawny podział (nitowe pośrednie; spawane, zgrzewane, klejone bezpośrednie), różnica spawanie/zgrzewanie (spoiwo vs docisk bez metalu dodatkowego) i co najmniej trzy rodzaje zgrzein. <b>0,5 pkt:<\/b> dwa z tych trzech elementów poprawnie. <b>0 pkt:<\/b> poprawny najwyżej jeden z trzech elementów (np. pomylenie połączeń nierozłącznych z rozłącznymi lub klejonych z pośrednimi). <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>nierozłączne: rozłączenie wymaga zniszczenia łącznika albo łączonych części<\/li><li>pośrednie: nitowe (łącznikiem jest nit); bezpośrednie: spawane, zgrzewane, klejone (klej nie jest ukształtowanym łącznikiem; działają adhezja i kohezja)<\/li><li>spawanie: miejscowe stopienie materiałów, zwykle ze spoiwem (materiał dodatkowy) → spoina<\/li><li>zgrzewanie: nagrzanie do stanu plastycznego lub nadtopienia + siła docisku, bez metalu dodatkowego → zgrzeina; źródło ciepła: elektryczne, tarciowe, ultradźwiękowe<\/li><li>zgrzeiny: punktowa (elektrody dociskają blachy, prąd o dużym natężeniu; np. karoserie), garbowa (występ na jednej części), liniowa (elektrody krążkowe, szew ciągły, połączenia szczelne), doczołowa (cała powierzchnia styku, spęcznienie)<\/li><li>na rysunku: spoina w przekroju zaczerniona; zgrzeina punktowa w przekroju kropkowana, w widoku linią kreskową grubą; warstwa kleju linią ciągłą grubą<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#roz-zgrz", "t": "08.11 cz. 2 · Zgrzewanie a spawanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#zgrz-po", "t": "08.11 cz. 2 · Zgrzewanie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#zgrz-r1", "t": "08.11 cz. 2 · Punktowe i liniowe"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#zgrz-r2", "t": "08.11 cz. 2 · Garbowe i doczołowe"}], "partial": false}, {"id": "q28", "type": "abc", "tag": "nro.klej_zszyw", "q": "Do jakiej grupy należy połączenie klejone?", "options": ["Nierozłączne bezpośrednie", "Nierozłączne pośrednie, bo łącznikiem jest warstwa kleju", "Rozłączne bezpośrednie", "Rozłączne pośrednie"], "answer": 0, "explain": "Klej nie jest ukształtowanym łącznikiem jak nit, więc połączenie klejone jest bezpośrednie (tak jak spawane i zgrzewane); trzymają je siły adhezji i kohezji. Pośrednie nierozłączne jest połączenie nitowe.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#klej-po", "t": "08.11 cz. 2 · Klejenie"}], "partial": false}, {"id": "q29", "type": "abc", "tag": "nro.klej_zszyw", "q": "Złącze klejone zniszczyło się tak, że warstwa kleju oderwała się od powierzchni łączonej części. Jak nazywa się takie zniszczenie?", "options": ["Adhezyjne", "Kohezyjne", "Zniszczenie tworzywa konstrukcyjnego", "Zmęczeniowe"], "answer": 0, "explain": "Adhezja to przyciąganie między klejem a podłożem, więc oderwanie kleju od podłoża jest zniszczeniem adhezyjnym. Zniszczenie kohezyjne to rozerwanie samej błony klejowej (słabe siły spójności wewnątrz kleju).", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#klej-r1", "t": "08.11 cz. 2 · Jak niszczy się klejenie"}], "partial": false}, {"id": "q30", "type": "abc", "tag": "nro.klej_zszyw", "q": "Jak rysuje się warstwę kleju w połączeniu klejonym na rysunku zespołu?", "options": ["Linią ciągłą grubą między łączonymi częściami", "Zaczernionym polem, jak przekrój spoiny", "Linią kreskową grubą", "Linią punktową cienką w miejscu połączenia"], "answer": 0, "explain": "Warstwę kleju przedstawia się linią ciągłą grubą w miejscu połączenia. Zaczernione pole jest zarezerwowane dla przekroju spoiny, a linia kreskowa gruba dla zgrzeiny punktowej w widoku.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#klej-r2", "t": "08.11 cz. 2 · Znak klejenia"}], "partial": false}, {"id": "q31", "type": "multi", "tag": "nro.klej_zszyw", "q": "Czym można zwiększyć siły adhezji w połączeniu klejonym?", "options": ["Odtłuszczeniem powierzchni", "Obróbką mechaniczną usuwającą obce warstwy powierzchniowe", "Obróbką chemiczną tworzącą nowe aktywne warstwy powierzchniowe", "Nałożeniem grubszej warstwy kleju"], "answer": [0, 1, 2], "explain": "Adhezja działa na granicy klej–podłoże, więc zwiększa się ją przygotowaniem powierzchni: odtłuszczeniem, obróbką mechaniczną i chemiczną. Grubsza warstwa kleju nie zmienia oddziaływania na tej granicy.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#klej-r1", "t": "08.11 cz. 2 · Jak niszczy się klejenie"}], "partial": false}, {"id": "q32", "type": "abc", "tag": "nro.klej_zszyw", "q": "Co przedstawia umowny znak połączenia zszywanego umieszczany na linii odniesienia?", "options": ["Zarys zszywki przed zszyciem", "Zarys zszywki po zaciśnięciu (z zagiętymi końcami)", "Okrąg na załamaniu linii odniesienia", "Trójkąt prostokątny, jak przy spoinie pachwinowej"], "answer": 0, "explain": "Znakiem połączenia zszywanego jest zarys zszywki przed zszyciem; przy znaku można podać liczbę zszywek. Okrąg na załamaniu linii odniesienia oznacza połączenie wykonane na całym obwodzie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026-part-2/index.html#klej-r4", "t": "08.11 cz. 2 · Zszywanie"}], "partial": false}]}, {"id": "09_probne-kolokwium-A", "kind": "Próbne kolokwium", "title": "Próbne kolokwium — zestaw A", "desc": "Pięć pytań w formie zaliczenia wykładu: linia kreskowa, półwidok-półprzekrój tarczy, przenikanie brył, połączenie śrubą w otworze nieprzelotowym, obliczenie tolerancji.", "intro": "Próbne kolokwium w formie zaliczenia wykładu: 5 pytań, każde za 1 pkt (oceniane 0 / 0,5 / 1); zalicza 3 pkt. Czas: 90 minut. Odpowiedzi pisz i rysuj na jednej kartce A3, bez ramki i tabliczki; pytań nie przepisuj, tylko numeruj odpowiedzi. Na początku kartki napisz ołówkiem, pismem technicznym: GRAFIKA INŻYNIERSKA 1 (na kolokwium także imię i nazwisko; błędy pisma technicznego obniżają ocenę). Rysuj ołówkiem, odręcznie lub przyborami, z wyraźną różnicą linii cienkich i grubych. Po ok. 85 minutach zrób czytelne zdjęcie kartki i dodaj je przy pytaniach rysunkowych; odpowiedzi opisowe wpisz w pola tekstowe (albo przepisz je z kartki).", "tags": {"pod.linie": "Rodzaje linii i ich zastosowanie", "prz.proste": "Przekrój prosty, półwidok-półprzekrój", "gw.przenikanie_obrot": "Przenikanie brył (linia przenikania, walce)", "roz.pol_gwintowe": "Połączenia gwintowe na rysunku", "tol.wymiary": "Tolerowanie wymiarów: odchyłki, tolerancja, wymiary graniczne"}, "questions": [{"id": "q1", "type": "long", "tag": "pod.linie", "pts": 1, "q": "Opisz <b>linię kreskową<\/b>: jak wygląda (kreski, przerwy, grubość), jakie ma odmiany i do czego służy każda z nich. Podaj zasady rysowania tej linii i ograniczenia w jej stosowaniu (gdzie się jej nie rysuje, czego nie wolno do niej robić).", "key": "<b>1 pkt:<\/b> poprawny wygląd (kreski i przerwy, grubość cienkiej), zastosowanie linii cienkiej (krawędzie i zarysy niewidoczne), odmiana gruba z zastosowaniem oraz co najmniej dwie zasady rysowania lub stosowania. <b>0,5 pkt:<\/b> wygląd i zastosowanie linii cienkiej poprawne, ale bez odmiany grubej albo bez żadnej zasady; lub pełny opis z jednym błędem (np. zła długość kresek, linia kończona przerwą). <b>0 pkt:<\/b> pomylenie z inną linią (np. zastosowanie do osi, linii wymiarowych, części przyległych) albo sam ogólnik „linia przerywana”. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>linia nieciągła: kreski długości b = 3–6 mm przedzielone krótkimi przerwami a (dla s ≤ 0,35 mm a ≥ 4s, dla grubszych a &gt; 2s); kreski jednakowej długości<\/li><li>kreskowa cienka (nr 02.1): grubość połowy linii grubej, np. 0,25 mm przy grupie 0,5; służy do krawędzi niewidocznych i zarysów niewidocznych (np. otwór w widoku, gwint niewidoczny)<\/li><li>kreskowa gruba (nr 02.2): oznacza dopuszczalne obszary obróbki powierzchniowej, np. cieplnej (rysowana obok zarysu); dla porównania obszar wymagany oznacza się linią grubą z długą kreską i kropką<\/li><li>zaczyna się, kończy, łączy w narożnikach i przecina z innymi liniami <b>kreską<\/b>, nigdy przerwą; dochodząc do linii ciągłej, kreska jej dotyka<\/li><li>dwie bliskie linie kreskowe równoległe mają kreski przesunięte względem siebie<\/li><li>w ćwiczeniach rysunkowych krawędzi niewidocznych się nie stosuje: służą tylko poglądowo, do wyobrażenia sobie wnętrza przedmiotu; nie wymiaruje się do krawędzi niewidocznych<\/li><li>nie rysuje się ich w przekroju ani w części widoku półwidoku-półprzekroju (wnętrze pokazuje przekrój)<\/li><li>linie pomocnicze i odnoszące są zawsze ciągłe cienkie, nigdy kreskowe<\/li><\/ul><b>Typowe błędy:<\/b> przypisanie linii kreskowej osi symetrii; kreski długości kilkunastu mm (to długa kreska linii z kropką); linia zaczynająca się przerwą.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-2", "t": "17.10 · Kreskowe"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-2", "t": "17.10 · Odstępy i kropka"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-3", "t": "17.10 · Kreska na końcu"}], "partial": false}, {"id": "q2", "type": "sketch", "tag": "prz.proste", "pts": 1, "q": "Tarcza z piastą (rysunek: widok z przodu z krawędziami niewidocznymi i widok z góry): tarcza Ø90 o grubości 15, piasta Ø50, wysokość całkowita 50, otwór przelotowy Ø24 z pogłębieniem walcowym Ø36 na głębokość 12 od góry. W tarczy są 4 otwory przelotowe Ø10, rozmieszczone co 90° na okręgu Ø70; dwa z nich leżą w płaszczyźnie przechodzącej przez oś, równoległej do rzutni widoku z przodu. Narysuj widok z przodu jako <b>półwidok-półprzekrój<\/b> (oś pionowa) i podaj wymiary Ø90, Ø50, Ø36, Ø24, 50 i 15. Widoku z góry nie rysuj.", "svg": "<svg viewBox=\"0 0 330 420\" role=\"img\" aria-label=\"Tarcza z piastą. U góry widok z przodu z krawędziami niewidocznymi: tarcza Ø90 grubości 15, piasta Ø50, wysokość całkowita 50, otwór przelotowy Ø24 z pogłębieniem Ø36 od góry i dwa otwory Ø10 w tarczy. Pod spodem widok z góry: współśrodkowe okręgi Ø90, Ø50, Ø36, Ø24 i cztery otwory Ø10 na okręgu Ø70.\"><polyline class=\"sh\" points=\"80.0,150.0 260.0,150.0 260.0,120.0 220.0,120.0 220.0,50.0 120.0,50.0 120.0,120.0 80.0,120.0 80.0,150.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"134.0\" y1=\"50.0\" x2=\"134.0\" y2=\"74.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"146.0\" y1=\"74.0\" x2=\"134.0\" y2=\"74.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"146.0\" y1=\"74.0\" x2=\"146.0\" y2=\"150.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line 0\" x2=\"220.0\" y2=\"26.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"120.0,26.0 130.0,23.2 130.0,28.8\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"220.0,26.0 210.0,28.8 210.0,23.2\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"170.0\" y=\"22.0\" text-anchor=\"middle\" style=\"font-size:13px\">Ø50<\/text><line class=\"ax\" x1=\"80.0\" y1=\"150.0\" x2=\"53.0\" y2=\"150.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"80.0\" y1=\"120.0\" x2=\"53.0\" y2=\"120.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"58.0\" y1=\"168.0\" x2=\"58.0\" y2=\"102.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"58.0,150.0 60.8,160.0 55.2,160.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"58.0,120.0 55.2,110.0 60.8,110.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"54.0\" y=\"135.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 54.0 135.0)\">15<\/text><line class=\"ax\" x1=\"223.0\" y1=\"50.0\" x2=\"294.0\" y2=\"50.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"263.0\" y1=\"150.0\" x2=\"294.0\" y2=\"150.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"289.0\" y1=\"150.0\" x2=\"289.0\" y2=\"50.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"289.0,150.0 286.2,140.0 291.8,140.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"289.0,50.0 291.8,60.0 286.2,60.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"285.0\" y=\"100.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 285.0 100.0)\">50<\/text><circle class=\"sh\" cx=\"170.0\" cy=\"300.0\" r=\"90.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"170.0\" cy=\"300.0\" r=\"50.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"170.0\" cy=\"300.0\" r=\"18.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"170.0\" cy=\"300.0\" r=\"12.0\" style=\"stroke-width:2.6\"/><circle class=\"ax\" cx=\"170.0\" cy=\"300.0\" r=\"70.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><circle class=\"sh\" cx=\"100.0\" cy=\"300.0\" r=\"10.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"240.0\" cy=\"300.0\" r=\"10.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"170.0\" cy=\"230.0\" r=\"10.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"170.0\" cy=\"370.0\" r=\"10.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"66.0\" y1=\"300.0\" x2=\"274.0\" y2=\"300.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"170.0\" y1=\"196.0\" x2=\"170.0\" y2=\"404.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"247.0\" y1=\"293.0\" x2=\"282.0\" y2=\"238.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"282.0\" y1=\"238.0\" x2=\"328.0\" y2=\"238.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"247.0,293.0 250.0,283.1 254.7,286.1\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"305.0\" y=\"234.0\" text-anchor=\"middle\" style=\"font-size:13px\">4×Ø10<\/text><text class=\"\" x=\"70.0\" y=\"404.0\" text-anchor=\"start\" style=\"font-size:13px\">otwory Ø10 na okręgu Ø70<\/text><\/svg>", "key": "<b>Musi być:<\/b><ul><li>pionowa oś symetrii linią punktową cienką (z długą kreską i kropką), wysunięta poza zarys; to ona jest granicą widoku i przekroju; bez znaku symetrii na końcach osi (półwidok-półprzekrój go nie wymaga)<\/li><li>połowa w widoku (zwykle lewa): tylko zarys tarczy i piasty linią ciągłą grubą, bez linii kreskowych otworu, pogłębienia i otworów Ø10; oś otworu Ø10 może zostać<\/li><li>połowa w przekroju (zwykle prawa): ścianka piasty i tarcza zakreskowane linią ciągłą cienką pod 45°, w jednym kierunku i z jednakową podziałką (jedna część)<\/li><li>w przekroju niekreskowane: otwór Ø24, pogłębienie Ø36 (stopień na głębokości 12) i przecięty otwór Ø10 w tarczy, którego ściany są liniami grubymi na całej grubości tarczy, z osią<\/li><li>w części przekroju krawędzie widoczne za płaszczyzną cięcia: poziome linie grube w otworze (górna krawędź pogłębienia, jego dno, dolna krawędź otworu) oraz górna i dolna krawędź przeciętego otworu Ø10; ich brak to drobny brak<\/li><li>wymiary: Ø90 i Ø50 jako zwykłe wymiary średnic; <b>Ø36 i Ø24<\/b> jako średnice całkowite z linią wymiarową przedłużoną za oś i jednym grotem (nie R18, R12); 50 i 15<\/li><\/ul><b>1 pkt:<\/b> wszystkie elementy, najwyżej jeden drobny brak; brakujące krawędzie za płaszczyzną cięcia nie obniżają oceny. <b>0,5 pkt:<\/b> poprawny podział i kreskowanie, ale jeden istotny błąd: linie kreskowe w połowie widoku, zakreskowany otwór lub pogłębienie, pominięty otwór Ø10 w przekroju, granica narysowana linią ciągłą, wymiary otworów jako promienie albo wymiar połowy średnicy. <b>0 pkt:<\/b> pełny widok albo pełny przekrój zamiast połówek, kreskowanie całej połowy łącznie z otworem albo dwa i więcej istotnych błędów. <b>Typowe błędy:<\/b> zakreskowanie pogłębienia; różne kierunki kreskowania piasty i tarczy (to jedna część); linie kreskowe w półwidoku; znak symetrii (jak w półwidoku) dorysowany na osi.<br><b>Wzór:<\/b><div class=\"fig\"><svg viewBox=\"0 0 330 236\" role=\"img\" aria-label=\"Wzór: półwidok-półprzekrój tarczy. Lewa połowa to widok bez linii kreskowych, prawa połowa to przekrój zakreskowany pod 45 stopni; granicą jest pionowa oś symetrii. Otwory Ø24, Ø36 i Ø10 niekreskowane, średnice Ø36 i Ø24 wymiarowane jednym grotem za osią.\"><polyline class=\"sh\" points=\"170.0,172.0 80.0,172.0 80.0,142.0 120.0,142.0 120.0,72.0 170.0,72.0\" style=\"stroke-width:2.6\"/><clipPath id=\"rh1\"><path d=\"M206.0,72.0 L220.0,72.0 L220.0,142.0 L230.0,142.0 L230.0,172.0 L194.0,172.0 L194.0,96.0 L206.0,96.0 Z\" clip-rule=\"evenodd\"/><\/clipPath><g clip-path=\"url(#rh1)\"><line class=\"ax\" x1=\"194.0\" y1=\"79.0\" x2=\"201.0\" y2=\"72.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"194.0\" y1=\"86.0\" x2=\"208.0\" y2=\"72.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"194.0\" y1=\"93.0\" x2=\"215.0\" y2=\"72.0\" style=\"stroke-width:.8\"/><line clas 2.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"289.0,172.0 286.2,162.0 291.8,162.0\" style=\"fill:var(--mu)\"/><polygon class=\"ax\" points=\"289.0,72.0 291.8,82.0 286.2,82.0\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"285.0\" y=\"122.0\" text-anchor=\"middle\" style=\"font-size:13px\" transform=\"rotate(-90.0 285.0 122.0)\">50<\/text><line class=\"ax\" x1=\"250.0\" y1=\"164.0\" x2=\"266.0\" y2=\"218.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"266.0\" y1=\"218.0\" x2=\"312.0\" y2=\"218.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"250.0,164.0 255.5,172.8 250.2,174.4\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"289.0\" y=\"214.0\" text-anchor=\"middle\" style=\"font-size:13px\">4×Ø10<\/text><\/svg><\/div>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-pl", "t": "18.10 · Plansza: półwidok-półprzekrój"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-2", "t": "18.10 · Układ i oznaczenie"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-3", "t": "18.10 · Wymiar całkowity"}], "partial": false}, {"id": "q3", "type": "long", "tag": "gw.przenikanie_obrot", "pts": 1, "q": "Co to jest <b>przenikanie brył<\/b> i linia przenikania? Wyjaśnij, czym różni się przenikanie zupełne od niezupełnego. Opisz krótko, jak wyznacza się linię przenikania dwóch walców o osiach prostopadłych i przecinających się, oraz jak wygląda ona w rzucie głównym (na rzutni równoległej do obu osi), gdy średnice walców są równe, a jak, gdy są różne.", "key": "<b>1 pkt:<\/b> definicja linii przenikania, poprawne rozróżnienie zupełne / niezupełne, opis wyznaczania (punkty skrajne oraz dalsze punkty z podziału okręgów, przeniesione odnoszącymi z rzutu z góry i z boku; równoważnie: płaszczyzny pomocnicze; nazwa metody nie jest wymagana) oraz poprawny kształt w obu przypadkach średnic. <b>0,5 pkt:<\/b> definicja i dwa z trzech pozostałych elementów albo wszystkie elementy z jednym błędem (np. łuk wygięty ku osi walca mniejszego). <b>0 pkt:<\/b> brak definicji linii przenikania albo zamienione przenikanie zupełne i niezupełne bez innych poprawnych elementów. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>przenikanie: dwie bryły wzajemnie się przecinają; linia przenikania to zbiór punktów wspólnych powierzchni (ścian) obu brył<\/li><li>dla wielościanów: łamana zamknięta, najczęściej wielokąt przestrzenny; wierzchołki to punkty przebicia krawędzi jednej bryły ze ścianami drugiej, boki to odcinki wspólne ścian; dla brył obrotowych: przestrzenna krzywa<\/li><li>niezupełne: jedna zamknięta linia (jeden wielokąt); zupełne: dwie osobne linie, bo jedna bryła przechodzi przez drugą na wylot<\/li><li>walce: najpierw punkty skrajne (charakterystyczne), w których tworzące zarysowe jednego walca przebijają drugi walec<\/li><li>punkty pośrednie: okręgi walców w rzucie z góry i z boku dzieli się na kilka punktów i przenosi je odnoszącymi na rzut główny; teoretycznie to metoda płaszczyzn pomocniczych: płaszczyzna równoległa do rzutni (czołowa) przecina oba walce wzdłuż tworzących; ich punkty wspólne, przeniesione odnoszącymi z rzutu z góry i z boku (gdzie linia przenikania leży na okręgu), należą do linii przenikania; im więcej punktów, tym dokładniejsza krzywa, łączona krzywikiem<\/li><li>równe średnice: linia rozpada się na dwie elipsy płaskie, w rzucie głównym widoczne jako dwa proste odcinki („X”)<\/li><li>różne średnice: łuki zaczynają się w punktach skrajnych i wyginają się w stronę osi walca o większej średnicy<\/li><li>przy osiach przecinających się niewidoczna połowa linii pokrywa się z widoczną (jedna linia gruba)<\/li><\/ul><b>Typowe błędy:<\/b> „X” także dla różnych średnic; zupełne = jeden wielokąt; prowadzenie linii po osi walca.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-po", "t": "18.10 · Po co punkty na okręgu"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pn-po", "t": "18.10 · Po co pęk płaszczyzn"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-1", "t": "18.10 · Równe i różne średnice"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#wc-2", "t": "18.10 · Osie przesunięte"}], "partial": false}, {"id": "q4", "type": "sketch", "tag": "roz.pol_gwintowe", "pts": 1, "q": "Naszkicuj w I stopniu uproszczenia połączenie dwóch płyt śrubą <b>M10×30<\/b> z łbem sześciokątnym, wkręconą w gwintowany <b>otwór nieprzelotowy<\/b> w dolnej płycie: przekrój płaszczyzną przechodzącą przez oś śruby (widoku z góry nie rysuj). Dane: górna płyta grubości 12 z otworem przejściowym Ø11; dolna płyta grubości 36; gwint na śrubie na długości 26 od jej końca; otwór w dolnej płycie wiercony Ø8,5 na głębokość 27 i gwintowany M10 na głębokość 22 (śruba wkręca się na 18). Zachowaj w przybliżeniu proporcje; wymiarów nie podawaj.", "key": "<b>Musi być (to decyduje o ocenie):<\/b><ul><li>obie płyty w przekroju, kreskowane pod 45° w przeciwnych kierunkach (sąsiednie części); śruba niekreskowana, bo łącznik przecięty wzdłuż osi rysuje się w widoku<\/li><li>górna płyta z gładkim otworem przejściowym szerszym niż śruba; łeb w uproszczeniu (prostokąt bez łuków faz) leży na górnej płycie<\/li><li>gwint śruby: zarys linią grubą, dno linią ciągłą cienką, granica gwintu poprzeczną linią grubą<\/li><li>otwór nieprzelotowy w dolnej płycie: gwint (wierzchołki – ściana otworu wierconego – linią grubą, dno cienką, kreskowanie do linii grubej), granica gwintu linią grubą, pod nią gładki otwór i stożek po wiertle; gwint nie dochodzi do stożka<\/li><li>oś linią punktową cienką, wysunięta poza łeb i stożek<\/li><\/ul><b>Na plus, ale nie obniża oceny:<\/b> szczegóły strefy skręcenia (w niej rysuje się śrubę, a kreskowanie dolnej płyty dochodzi do zarysu śruby, bo gwint zewnętrzny zasłania wewnętrzny); dokładne położenie granic gwintu (4 mm pod łbem, 4 mm pod końcem śruby); linie krawędzi ścian łba.<br><b>1 pkt:<\/b> wszystkie elementy z listy „musi być”, najwyżej jeden drobny brak. <b>0,5 pkt:<\/b> poprawny układ połączenia z jednym istotnym błędem: zakreskowana śruba, płyty kreskowane w jednym kierunku, brak granicy gwintu (śruby lub otworu), gwint lub śruba sięgające stożka, otwór w górnej płycie gwintowany. <b>0 pkt:<\/b> połączenie przelotowe z nakrętką zamiast otworu nieprzelotowego, gwint rysowany zwojami albo dwa i więcej istotnych błędów. <b>Typowe błędy:<\/b> zakreskowana śruba; dno gwintu otworu linią grubą, a wierzchołki cienką (odwrotnie niż w gwincie wewnętrznym); otwór gwintowany do samego dna.<br><b>Wzór<\/b> (1 – górna płyta, 2 – dolna płyta; podziałka zachowana: Ø11, Ø10, Ø8,5):<div class=\"fig\"><svg viewBox=\"0 0 370 240\" role=\"img\" aria-label=\"Wzór: połączenie dwóch płyt śrubą z łbem sześciokątnym wkręconą w gwintowany otwór nieprzelotowy, przekrój przez oś. Płyty kreskowane w przeciwnych kierunkach, śruba niekreskowana; w strefie skręcenia rysuje się gwint śruby, pod jej końcem widać gwint otworu z linią grubą wierzchołków i cienką dna, granicę gwintu, gładki otwór i stożek po wiertle.\"><clipPath id=\"rh3\"><path d=\"M60.0,80.0 L183.5,80.0 L183.5,116.0 L60.0,116.0 Z\" clip-rule=\"evenodd\"/><\/clipPath><g clip-path=\"url(#rh3)\"><line class=\"ax\" x1=\"178.0\" y1=\"80.0\" x2=\"183.5\" y2=\"85.5\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"171.0\" y1=\"80.0\" x2=\"183.5\" y2=\"92.5\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"164.0\" y1=\"80.0\" x2=\"183.5\" y2=\"99.5\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"157.0\" y1=\"80.0\" x2=\"183.5\" y2=\"106.5\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"150.0\" y1=\"80.0\" x2=\"183.5\" y2=\"113.5\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"143.0\" y1=\"80.0\" x2=\"179.0\" y2=\"116.0\" style=\"stroke-width:.8\"/><line class=\"ax\" x1=\"136.0 idth=\"55.4\" height=\"21.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"186.1\" y1=\"59.0\" x2=\"186.1\" y2=\"80.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"213.9\" y1=\"59.0\" x2=\"213.9\" y2=\"80.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"185.0\" y1=\"80.0\" x2=\"185.0\" y2=\"167.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"215.0\" y1=\"80.0\" x2=\"215.0\" y2=\"167.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"187.2\" y1=\"170.0\" x2=\"212.8\" y2=\"170.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"185.0\" y1=\"92.0\" x2=\"215.0\" y2=\"92.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"187.2\" y1=\"92.0\" x2=\"187.2\" y2=\"170.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"212.8\" y1=\"92.0\" x2=\"212.8\" y2=\"170.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"185.0\" y1=\"167.0\" x2=\"185.0\" y2=\"182.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"215.0\" y1=\"167.0\" x2=\"215.0\" y2=\"182.0\" style=\"stroke-width:1\"/><line class=\"sh\" x1=\"185.0\" y1=\"182.0\" x2=\"215.0\" y2=\"182.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"187.2\" y1=\"197.0\" x2=\"212.8\" y2=\"197.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"200.0\" y1=\"47.0\" x2=\"200.0\" y2=\"214.4\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><text class=\"\" x=\"350.0\" y=\"102.0\" text-anchor=\"start\" style=\"font-size:13px\">1<\/text><text class=\"\" x=\"350.0\" y=\"176.0\" text-anchor=\"start\" style=\"font-size:13px\">2<\/text><\/svg><\/div>", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-plan", "t": "08.11 · Plansza: przelotowe ×3"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#gpol-r2", "t": "08.11 · Nieprzelotowe"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#lacz-r3", "t": "08.11 · Dokładny, uproszczony, umowny"}], "partial": false}, {"id": "q5", "type": "long", "tag": "tol.wymiary", "pts": 1, "q": "Zadanie. Na rysunku wykonawczym podano dwa wymiary tolerowane: <b>a)<\/b> średnicę czopa wałka <b>Ø40<\/b> z odchyłkami <b>−0,025 / −0,050<\/b>; <b>b)<\/b> szerokość rowka <b>12<\/b> z odchyłkami <b>+0,043 / 0<\/b>. Dla każdego wymiaru: określ, czy jest to wymiar zewnętrzny (wałek), czy wewnętrzny (otwór), i zapisz odchyłki właściwymi symbolami; oblicz wymiary graniczne i tolerancję; opisz (lub naszkicuj na kartce), gdzie leży pole tolerancji względem linii zerowej. Na koniec oceń, czy są dobre elementy o wymiarach zmierzonych: czop 39,98 mm, rowek 12,02 mm.", "key": "<b>1 pkt:<\/b> oba wymiary poprawnie sklasyfikowane, odchyłki z właściwymi symbolami, wymiary graniczne, tolerancje i ocena obu elementów; położenie pól opisane poprawnie. <b>0,5 pkt:<\/b> jeden wymiar w pełni poprawny, albo oba z jednym błędem (np. rowek potraktowany jako wałek, ujemna tolerancja, zła ocena jednego elementu, brak opisu pola). <b>0 pkt:<\/b> błędna metoda (np. T jako suma wartości bezwzględnych odchyłek, odchyłki odjęte zamiast dodane) albo brak obliczeń. <b>Wzorcowe rozwiązanie:<\/b><ul><li>a) czop to wymiar zewnętrzny (wałek), więc małe litery: es = −0,025 mm, ei = −0,050 mm<\/li><li>a) B<sub>w<\/sub> = 40 + (−0,025) = 39,975 mm; A<sub>w<\/sub> = 40 + (−0,050) = 39,950 mm; T<sub>w<\/sub> = B<sub>w<\/sub> − A<sub>w<\/sub> = es − ei = 0,025 mm<\/li><li>a) pole tolerancji leży całe pod linią zerową: oba wymiary graniczne są mniejsze od nominalnego (wymiar nominalny nie musi leżeć w polu)<\/li><li>a) 39,98 &gt; 39,975, więc czop jest za duży i wymiar jest niezgodny z rysunkiem, mimo że jest bliżej 40<\/li><li>b) rowek to wymiar wewnętrzny (otwór: materiał na zewnątrz, w środku pusto), choć nie jest okrągły, więc duże litery: ES = +0,043 mm, EI = 0<\/li><li>b) B<sub>o<\/sub> = 12,043 mm; A<sub>o<\/sub> = 12,000 mm; T<sub>o<\/sub> = ES − EI = 0,043 mm<\/li><li>b) pole nad linią zerową, z dolną granicą na linii zerowej; 12,00 ≤ 12,02 ≤ 12,043, więc rowek jest dobry<\/li><li>tolerancja jest zawsze dodatnia (bez znaku); T = B − A = górna odchyłka − dolna odchyłka<\/li><\/ul><b>Typowe błędy:<\/b> T = 0,025 + 0,050 = 0,075; tolerancja ze znakiem minus; ES/EI dla czopa; uznanie, że wymiar nominalny musi leżeć między wymiarami granicznymi.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r2", "t": "07.11 · A, B i T"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#tol-r3", "t": "07.11 · Odchyłki ES, EI"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#zapis-plan", "t": "07.11 · Plansza: zapisy wymiaru"}], "partial": false}]}, {"id": "10_probne-kolokwium-B", "kind": "Próbne kolokwium", "title": "Próbne kolokwium — zestaw B", "desc": "Pięć pytań w formie zaliczenia wykładu: linia z dwiema kropkami, ćwierćwidok płyty, geometria wykreślna i rzuty Monge'a, połączenie wpustowe, oznaczanie chropowatości.", "intro": "Próbne kolokwium w formie zaliczenia wykładu: 5 pytań, każde za 1 pkt (oceniane 0 / 0,5 / 1); zalicza 3 pkt. Czas: 90 minut. Odpowiedzi pisz i rysuj na jednej kartce A3, bez ramki i tabliczki; pytań nie przepisuj, tylko numeruj odpowiedzi. Na początku kartki napisz ołówkiem, pismem technicznym: GRAFIKA INŻYNIERSKA 1 (na kolokwium także imię i nazwisko; błędy pisma technicznego obniżają ocenę). Rysuj ołówkiem, odręcznie lub przyborami, z wyraźną różnicą linii cienkich i grubych. Po ok. 85 minutach zrób czytelne zdjęcie kartki i dodaj je przy pytaniach rysunkowych; odpowiedzi opisowe wpisz w pola tekstowe (albo przepisz je z kartki).", "tags": {"pod.linie": "Rodzaje linii i ich zastosowanie", "rzu.widoki": "Widoki: półwidok, ćwierćwidok", "gw.monge": "Geometria wykreślna, rzuty Monge'a", "roz.wpust": "Klasyfikacja połączeń, połączenie wpustowe", "tol.chropowatosc": "Chropowatość powierzchni: symbole i zapis"}, "questions": [{"id": "q1", "type": "long", "tag": "pod.linie", "pts": 1, "q": "Scharakteryzuj <b>linię cienką z długą kreską i dwiema kropkami<\/b>: jej wygląd i wymiary elementów, zasady rysowania oraz jak najwięcej zastosowań. Wyjaśnij też, czym różni się jej zastosowanie od linii z długą kreską i jedną kropką (cienkiej i grubej).", "key": "<b>1 pkt:<\/b> poprawny wygląd, co najmniej cztery zastosowania (w tym zarysy części przyległych i skrajne położenia części ruchomych) oraz poprawne odróżnienie od linii z jedną kropką. <b>0,5 pkt:<\/b> wygląd i 2–3 zastosowania albo pełna lista zastosowań bez odróżnienia od linii z jedną kropką. <b>0 pkt:<\/b> pomylenie z linią z jedną kropką (np. „osie symetrii” jako główne zastosowanie) albo z linią kreskową. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>nr 05.1; linia cienka (połowa grubej, np. 0,25 mm): długa kreska ok. 10–12 mm, przerwa, kropka, przerwa, kropka, przerwa, długa kreska…; kropka to bardzo krótka kreska (≤ 3 grubości linii), nie kółko<\/li><li>zaczyna się, kończy i przecina długimi kreskami, nigdy kropką ani przerwą<\/li><li>zastosowania: zarysy części przyległych (sąsiednich); skrajne położenia części ruchomych (wychylenia); linie środków ciężkości<\/li><li>zarysy pierwotne przed kształtowaniem (np. pręt przed gięciem haka), rozwinięcia; części leżące przed płaszczyzną przekroju<\/li><li>zarysy wykonania alternatywnego; zarys części gotowej wewnątrz półwyrobu; obramowanie szczególnych pól lub obszarów; pole tolerancji zewnętrznej<\/li><li>różnica: cienka z jedną kropką (04.1) to osie, linie symetrii, okręgi podziałowe; gruba z jedną kropką (04.2) to położenie płaszczyzn przekroju i wymagane obszary obróbki powierzchniowej; linia z dwiema kropkami nie oznacza samego przedmiotu, tylko elementy pomocnicze wokół niego<\/li><\/ul><b>Typowe błędy:<\/b> rysowanie tej linii grubą; kropki jako kółka; mylenie części przyległej z krawędzią niewidoczną.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2
