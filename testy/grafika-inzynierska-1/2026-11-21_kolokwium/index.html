ne class=\"ax\" x1=\"90.0\" y1=\"111.0\" x2=\"44.0\" y2=\"111.0\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"121.5,113.5 111.3,115.5 111.8,109.9\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"67.0\" y=\"107.0\" text-anchor=\"middle\" style=\"font-size:13px\">4×Ø12<\/text><text class=\"\" x=\"120.0\" y=\"205.0\" text-anchor=\"start\" style=\"font-size:13px\">t = 10<\/text><\/svg><\/div>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-4", "t": "17.10 · Półwidok"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#u-3", "t": "17.10 · Symetria"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#pc-3b", "t": "18.10 · Ćwierć: Ø, nie R"}], "partial": false}, {"id": "q3", "type": "long", "tag": "gw.monge", "pts": 1, "q": "Co to jest <b>geometria wykreślna<\/b> i jaki ma związek z rysunkiem technicznym? Opisz zasady rzutowania prostokątnego metodą Monge'a: kierunek rzutowania, rzutnie i oś x, sprowadzenie rzutni do płaszczyzny rysunku, położenie obu rzutów punktu. Wyjaśnij też, jak wygląda rzut odcinka równoległego, prostopadłego i ukośnego do rzutni.", "key": "<b>1 pkt:<\/b> sensowna definicja geometrii wykreślnej ze związkiem z rzutami prostokątnymi, zasada rzutowania prostokątnego, co najmniej trzy elementy metody Monge'a (w tym odnosząca prostopadła do osi x) i wszystkie trzy reguły rzutu odcinka. <b>0,5 pkt:<\/b> poprawna idea (rzuty prostokątne na dwie prostopadłe rzutnie) bez części szczegółów albo z jednym błędem (np. pomylone rzuty ′ i ″, błędna reguła jednego odcinka). <b>0 pkt:<\/b> brak definicji i brak opisu rzutowania albo pomylenie z rzutem środkowym lub aksonometrią. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>geometria wykreślna: dział geometrii zajmujący się odwzorowaniem obiektów przestrzennych na płaszczyźnie i konstrukcyjnym (rysunkowym) rozwiązywaniem zadań przestrzennych; wywodzą się z niej rzuty prostokątne rysunku technicznego (widoki, przekroje, przenikanie)<\/li><li>rzutowanie prostokątne: proste rzutujące są równoległe do siebie i prostopadłe do rzutni<\/li><li>jeden rzut nie wystarcza (z figury płaskiej nie odczyta się wszystkich wymiarów), więc rzutuje się na co najmniej dwie wzajemnie prostopadłe rzutnie: poziomą π<sub>1<\/sub> i pionową π<sub>2<\/sub><\/li><li>rzutnie przecinają się wzdłuż osi x (osi rzutów) i dzielą przestrzeń na cztery ćwiartki I–IV<\/li><li>rzutnię poziomą obraca się o 90° wokół osi x, tak że jej część przednia (dodatnia) nakrywa dolną (ujemną) część rzutni pionowej<\/li><li>punkt A ma rzut poziomy A′ i pionowy A″; po sprowadzeniu leżą one na jednej odnoszącej prostopadłej do osi x; odległość A″ od osi to wysokość, A′ od osi to głębokość; dwa rzuty wyznaczają punkt jednoznacznie<\/li><li>odcinek równoległy do rzutni ma rzut w prawdziwej długości; prostopadły – rzut jest punktem; ukośny – rzut skrócony; analogicznie figura równoległa do rzutni ma rzut w naturalnym kształcie, a prostopadła rzutuje się jako odcinek<\/li><\/ul>Zapis rzutów A′, A″ i numeracja A1, A2 (rzutnie I, II) są równoważne. <b>Typowe błędy:<\/b> „rzutowanie z jednego punktu (oka)”; A′ i A″ na różnych odnoszących; „rzut odcinka ukośnego jest dłuższy”.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#g-pro", "t": "17.10 · Po co geometria"}, {"u": "../../../grafika-inzynierska-1/2026-10-18_grafika-inzynierska-18-10-2026/index.html#mg-po", "t": "18.10 · Po co Monge"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rz-1", "t": "17.10 · Prostopadle do rzutni"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-1", "t": "17.10 · Rzut główny"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-3", "t": "17.10 · Układ rzutów"}], "partial": false}, {"id": "q4", "type": "long", "tag": "roz.wpust", "pts": 1, "q": "Przedstaw klasyfikację połączeń części maszyn (oba kryteria podziału, z przykładami) i wskaż w niej miejsce połączenia wpustowego. Następnie scharakteryzuj <b>połączenie wpustowe<\/b>: z czego się składa, jak przenosi obciążenie, jak jest pasowany wpust, jakie są rodzaje wpustów, jak dobiera się wpust i co z tego połączenia pokazuje się na rysunkach wykonawczych wału i piasty.", "key": "<b>1 pkt:<\/b> oba kryteria klasyfikacji z przykładami, wpustowe jako rozłączne pośrednie oraz co najmniej cztery poprawne cechy połączenia wpustowego, w tym pasowanie (ciasno na bokach, luz na wysokości) i dobór wpustu wg średnicy wału. <b>0,5 pkt:<\/b> poprawna klasyfikacja i 1–3 cechy wpustu albo dobra charakterystyka wpustu przy niepełnej lub błędnej klasyfikacji. <b>0 pkt:<\/b> pomylenie połączenia wpustowego z wielowypustowym lub klinowym albo wpustowe zaliczone do nierozłącznych lub bezpośrednich bez innych poprawnych elementów. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>rozłączne (demontaż bez uszkodzenia łącznika i części) / nierozłączne (rozłączenie niszczy łącznik lub część); pośrednie (z elementem łączącym) / bezpośrednie (łączy kształt samych części albo spoiwo)<\/li><li>rozłączne pośrednie: wpustowe, klinowe, kołkowe, śrubowe; rozłączne bezpośrednie: wielowypustowe, gwintowe; nierozłączne pośrednie: nitowe; nierozłączne bezpośrednie: spawane, zgrzewane, klejone<\/li><li>połączenie wpustowe: rozłączne pośrednie; wpust (element pryzmatyczny, bez zbieżności) siedzi częściowo w rowku wału, częściowo w rowku piasty i zabezpiecza przed obrotem względnym<\/li><li>przenosi moment powierzchniami bocznymi; pasowany ciasno na bokach, z luzem na wysokości; nie daje nacisku promieniowego i nie centruje piasty<\/li><li>rodzaje: wpust pryzmatyczny (odmiany A, B, C, D, E, F: zaokrąglone lub ścięte, pełne, jedno- i dwuotworowe; także wyciskowe), wpust czółenkowy<\/li><li>dobór: z tabeli wg średnicy wału (np. Ø30 → b × h = 8 × 7, t<sub>1<\/sub> = 4, t<sub>2<\/sub> = 3,3); długość z szeregu znormalizowanego dla danej szerokości<\/li><li>wpustu (części znormalizowanej) nie rysuje się osobno; na rysunkach są rowki: na wale szerokość b (N9) i głębokość jako d<sub>w<\/sub> − t<sub>1<\/sub>, w piaście szerokość b (JS9) i głębokość jako d<sub>0<\/sub> + t<sub>2<\/sub>; promień dna R<sub>max<\/sub>; boki rowka Ra 3,2<\/li><\/ul><b>Typowe błędy:<\/b> wysokość wpustu h jako głębokość rowka; „wpust centruje piastę”; połączenie wpustowe jako bezpośrednie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pol-plan", "t": "08.11 · Plansza: tabela połączeń"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#pol-r2", "t": "08.11 · Pośrednie i bezpośrednie"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wpust-po", "t": "08.11 · Wpust i jego rola"}, {"u": "../../../grafika-inzynierska-1/2026-11-08_grafika-inzynierska-08-11-2026/index.html#wiel-po", "t": "08.11 · Czym jest wielowypust"}], "partial": false}, {"id": "q5", "type": "sketch", "tag": "tol.chropowatosc", "pts": 1, "q": "Na rysunku jest przekrój płytki z otworem przelotowym Ø20; ponumerowano trzy powierzchnie. Przerysuj odręcznie sam zarys przekroju (wystarczy w przybliżeniu) i oznacz chropowatość według aktualnej normy: <b>1<\/b> – ścianka otworu: Ra 0,8, wymagane usunięcie materiału; <b>2<\/b> – górna płaszczyzna: Ra 1,6, wymagane usunięcie materiału; <b>3<\/b> – lewa ściana boczna: Ra 3,2, usunięcie materiału niedopuszczalne. Pozostałe powierzchnie mogą być wykonane dowolną metodą: dodaj oznaczenie zbiorcze (wartość dobierz według reguły: kolejna wartość szeregu Ra po największej wartości użytej na rysunku) i napisz, gdzie umieszcza się je na arkuszu.", "svg": "<svg viewBox=\"0 0 340 185\" role=\"img\" aria-label=\"Przekrój płytki z otworem przelotowym Ø20: dwa zakreskowane prostokąty po obu stronach otworu. Numer 1 wskazuje ściankę otworu, trony; wartość w µm, nie zamienia się na mm; symbole linią cienką<\/li><li>położenie: wierzchołek symbolu dotyka powierzchni od zewnątrz (od strony powietrza) i wskazuje materiał, albo symbol stoi na półce linii odniesienia ze strzałką na powierzchni<\/li><li>2: na górnej krawędzi, czytelny od dołu; 3: przy lewej ścianie obrócony tak, by czytać go od prawej strony, albo na linii odniesienia; 1: na linii odniesienia ze strzałką na ściance otworu (albo przy wymiarze Ø20)<\/li><li>zbiorcze: symbol podstawowy, otwarte V (dowolna metoda), z <b>Ra 6,3<\/b> – kolejna wartość szeregu po największej użytej (3,2) – a obok w <b>nawiasie okrągłym<\/b> sam symbol (albo wypisane symbole Ra 0,8, Ra 1,6, Ra 3,2); umieszczone w prawym dolnym rogu arkusza, nad tabliczką rysunkową<\/li><\/ul><b>1 pkt:<\/b> wszystkie elementy. <b>0,5 pkt:<\/b> jeden błąd: wartość nad półką zamiast pod nią, symbol od strony materiału lub do góry nogami, zbiorcze bez nawiasu albo z wartością 12,5 lub 3,2, brak miejsca zbiorczego. <b>0 pkt:<\/b> pomylone symbole „wymagane usunięcie” i „usunięcie niedopuszczalne” albo dwa i więcej błędów. <b>Typowe błędy:<\/b> wartość w mm (0,0008); 6,4 zamiast 6,3; zbiorcze bez nawiasu (znaczyłoby, że wszystkie powierzchnie mają tę wartość); trzy pozycje symbolu przy pionowej ścianie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r1", "t": "07.11 · Położenie symbolu"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r3", "t": "07.11 · Rodzaje symbolu"}, {"u": "../../../grafika-inzynierska-1/2026-11-07_grafika-inzynierska-07-11-2026/index.html#chrop-r4", "t": "07.11 · Pozostałe powierzchnie"}], "partial": false}]}]};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY = id => `alsi-test:${D.subject}/${D.slug}/${id}`;
const load = id => { try { return JSON.parse(localStorage.getItem(KEY(id)) || "null"); } catch (e) { return null; } };
const store = (id, s) => { try { s ? localStorage.setItem(KEY(id), JSON.stringify(s)) : localStorage.removeItem(KEY(id)); } catch (e) {} };
const isClosed = q => q.type === "abc" || q.type === "multi" || q.type === "short";
const TYPE = {abc: "jednokrotny wybór", multi: "wielokrotny wybór", short: "krótka odpowiedź", long: "pytanie opisowe · do ćwiczenia", sketch: "zadanie rysunkowe · na kartce"};
const isFig = o => /^\s*<svg/i.test(o);
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/ł/g, "l").replace(/,/g, ".").replace(/[×✕*]/g, "x").replace(/µ/g, "μ").replace(/[−–—]/g, "-")
  .replace(/[\s"'„”«»():;]+/g, "").replace(/\.$/, "").replace(/(\d)mm$/, "$1").trim();
function shuffle(n) { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* grading of closed questions: abc 0/1, multi (hits - misses)/correct, short = one of the accepted answers */
function grade(q, a) {
  if (!isClosed(q)) return {max: 0, pts: 0, st: "prac"};
  const v = a.v;
  if (q.type === "abc") return v === q.answer ? {max: 1, pts: 1, st: "ok"} : {max: 1, pts: 0, st: "bad", empty: v == null};
  if (q.type === "multi") {
    const sel = new Set(v || []), good = new Set(q.answer);
    if (!sel.size) return {max: 1, pts: 0, st: "bad", empty: true};
    let hit = 0, miss = 0; sel.forEach(i => good.has(i) ? hit++ : miss++);
    const f = Math.max(0, (hit - miss) / good.size), pts = Math.round(f * 100) / 100;
    return {max: 1, pts, st: f === 1 ? "ok" : f > 0 ? "part" : "bad"};
  }
  const n = norm(v);
  if (!n) return {max: 1, pts: 0, st: "bad", empty: true};
  const ok = (q.answer || []).some(x => norm(x) === n) || (q.regex && new RegExp(q.regex, "i").test(String(v).trim()));
  return ok ? {max: 1, pts: 1, st: "ok"} : {max: 1, pts: 0, st: "bad"};
}
const T_OF = id => D.tests.find(t => t.id === id);
let T = null, S = null;

function route() {
  const id = new URLSearchParams(location.hash.slice(1)).get("t");
  T = id && T_OF(id);
  $("#foot").hidden = true;
  scrollTo(0, 0);
  if (!T) return renderHome();
  S = load(T.id);
  if (!S || !S.order) {
    S = {order: {}, answers: {}, done: false, started: Date.now(), last: S && S.last};
    for (const q of T.questions) if (q.options && !q.noshuffle) S.order[q.id] = shuffle(q.options.length);
    store(T.id, S);
  }
  S.done ? renderResult() : renderFill();
}
addEventListener("hashchange", route);

/* ---------- list of sets ---------- */
function renderHome() {
  document.title = `${D.title} · Testy`;
  $("#h1").textContent = D.title; $("#sub").textContent = D.subtitle;
  $("#back").href = "../index.html";
  const rows = D.tests.map(t => {
    const s = load(t.id), last = s && s.last;
    const st = last ? `<b>${last.max ? Math.round(100 * last.pts / last.max) + "%" : "przećwiczone"}</b><br><span class="small">${new Date(last.at).toLocaleDateString("pl-PL")}</span>`
      : s && Object.keys(s.answers || {}).length ? "w trakcie" : `${t.questions.length} pytań`;
    return `<a class="row" href="#t=${encodeURIComponent(t.id)}"><i class="bar"></i><span class="k">${esc(t.kind)}</span>
      <span class="nm">${esc(t.title)}<small>${esc(t.desc || "")}</small></span><span class="dt">${st}</span></a>`;
  }).join("");
  $("#app").innerHTML = `<div class="panel small">${D.intro}</div><section class="glass list" style="padding:18px;border-radius:32px">${rows}</section>`;
}

/* ---------- solving ---------- */
const A = id => (S.answers[id] ??= {});
function optsHTML(q, a, review) {
  const ord = S.order[q.id] || q.options.map((_, i) => i);
  const multi = q.type === "multi", sel = new Set(multi ? (a.v || []) : a.v == null ? [] : [a.v]);
  const good = new Set(multi ? q.answer : [q.answer]);
  const figs = q.options.some(isFig);
  return `<div class="opts${figs ? " figs" : ""}">${ord.map(i => {
    const o = q.options[i], body = isFig(o) ? `<div class="fig">${o}</div>` : `<span>${o}</span>`;
    if (review) {
      const cls = good.has(i) ? "right" : sel.has(i) ? "wrong" : "";
      return `<div class="opt ${cls}"><span class="mk">${good.has(i) ? "✓" : sel.has(i) ? "✗" : ""}</span>${body}</div>`;
    }
    return `<label class="opt${sel.has(i) ? " sel" : ""}"><input type="${multi ? "checkbox" : "radio"}" name="${q.id}" value="${i}"${sel.has(i) ? " checked" : ""}>${body}</label>`;
  }).join("")}</div>`;
}
function qHTML(q, n) {
  const a = A(q.id);
  let inp = "";
  if (q.type === "abc" || q.type === "multi") inp = optsHTML(q, a, false) + (q.type === "multi" ? `<div class="hint">Zaznacz wszystkie poprawne (może być więcej niż jedna).</div>` : "");
  else if (q.type === "short") inp = `<input type="text" data-k="v" value="${esc(a.v || "")}" placeholder="Krótka odpowiedź" autocomplete="off">`;
  else if (q.type === "long") inp = `<textarea data-k="v" placeholder="Napisz odpowiedź tak, jak na kolokwium. Nie jest oceniana: po zakończeniu zobaczysz wzorzec.">${esc(a.v || "")}</textarea>`;
  else inp = `<div class="task">✎ Zadanie do wykonania na kartce, ołówkiem. Po zakończeniu testu zobaczysz kryteria, według których możesz sprawdzić swój rysunek.</div>`;
  return `<section class="q" id="q-${q.id}" data-id="${q.id}"><div class="qh"><span class="qn">${n + 1} / ${T.questions.length}</span><span>${TYPE[q.type]}</span></div>
    <div class="qq">${q.q}</div>${q.svg ? `<div class="fig">${q.svg}</div>` : ""}<div class="in">${inp}</div></section>`;
}
function renderFill() {
  document.title = `${T.title} · ${D.title}`;
  $("#h1").textContent = T.title; $("#sub").textContent = `${T.kind} · ${T.questions.length} pytań`;
  $("#back").href = "#";
  const nc = T.questions.filter(isClosed).length;
  $("#app").innerHTML = `<div class="panel small">${T.intro || ""}<p class="mu" style="margin:8px 0 0">Pytania zamknięte (${nc}) sprawdzą się po „Zakończ i sprawdź”.
    Opisowe i rysunkowe są do ćwiczenia: po zakończeniu pokażą wzorzec. Odpowiedzi zapisują się w tej przeglądarce, więc możesz przerwać i wrócić.</p></div>
    ${T.questions.map(qHTML).join("")}`;
  $("#foot").hidden = false; progress();
}
function answered(q) { const a = S.answers[q.id] || {}; return q.type === "multi" ? (a.v || []).length > 0 : q.type === "abc" ? a.v != null : !!String(a.v ?? "").trim(); }
function progress() {
  const qs = T.questions.filter(q => q.type !== "sketch"), n = qs.filter(answered).length;
  $("#progt").textContent = `Odpowiedziano: ${n} / ${qs.length}`;
  $("#progb").style.width = `${(100 * n / Math.max(1, qs.length)).toFixed(1)}%`;
}
document.addEventListener("change", e => {
  const s = e.target.closest(".q"); if (!s || !T || S.done) return;
  const q = T.questions.find(x => x.id === s.dataset.id), a = A(q.id);
  if (e.target.type === "radio") a.v = +e.target.value;
  else if (e.target.type === "checkbox") { const set = new Set(a.v || []); e.target.checked ? set.add(+e.target.value) : set.delete(+e.target.value); a.v = [...set].sort((x, y) => x - y); }
  else return;
  s.querySelector(".in").innerHTML = optsHTML(q, a, false) + (q.type === "multi" ? `<div class="hint">Zaznacz wszystkie poprawne (może być więcej niż jedna).</div>` : "");
  store(T.id, S); progress();
});
document.addEventListener("input", e => {
  const s = e.target.closest(".q"); if (!s || !T || S.done || e.target.dataset.k !== "v") return;
  A(s.dataset.id).v = e.target.value; store(T.id, S); progress();
});
$("#finish").addEventListener("click", () => {
  const left = T.questions.filter(q => isClosed(q) && !answered(q)).length;
  if (!confirm(left ? `Bez odpowiedzi zostało ${left} pytań zamkniętych. Zakończyć mimo to?` : "Zakończyć test i sprawdzić odpowiedzi?")) return;
  const gs = T.questions.filter(isClosed).map(q => grade(q, S.answers[q.id] || {}));
  S.done = true; S.last = {pts: +gs.reduce((s, g) => s + g.pts, 0).toFixed(2), max: gs.length, at: Date.now()};
  store(T.id, S); route();
});

/* ---------- result ---------- */
function linksHTML(q, label) {
  if (!q.links.length) return `<div class="links"><span class="gap">Tej informacji nie ma jeszcze w notatkach.</span></div>`;
  return `<div class="links">${label}: ${q.links.map(l => `<a href="${l.u}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join("")}
    ${q.partial ? `<br><span class="gap">Notatka mówi o tym tylko częściowo; pełna odpowiedź jest w wyjaśnieniu wyżej.</span>` : ""}</div>`;
}
function reviewHTML(q, n) {
  const a = S.answers[q.id] || {}, g = grade(q, a);
  const pill = {ok: `<span class="pill ok">dobrze</span>`, part: `<span class="pill part">częściowo · ${g.pts} pkt</span>`,
    bad: `<span class="pill bad">${g.empty ? "brak odpowiedzi" : "źle"}</span>`, prac: `<span class="pill prac">do ćwiczenia</span>`}[g.st];
  let body = `<div class="qq">${q.q}</div>${q.svg ? `<div class="fig">${q.svg}</div>` : ""}`, res = "";
  if (q.type === "abc" || q.type === "multi") {
    body += optsHTML(q, a, true);
    res = `<div class="res ${g.st}">${q.explain || ""}${g.st !== "ok" ? linksHTML(q, "Gdzie to jest w notatce") : ""}</div>`;
  } else if (q.type === "short") {
    body += `<p><b>Twoja odpowiedź:</b> ${a.v ? esc(a.v) : `<span class="mu">brak</span>`}</p>`;
    res = `<div class="res ${g.st}"><b>Poprawnie:</b> ${esc((q.answer || [])[0] || "")}<br>${q.explain || ""}${g.st !== "ok" ? linksHTML(q, "Gdzie to jest w notatce") : ""}</div>`;
  } else {
    if (q.type === "long") body += `<p><b>Twoja odpowiedź:</b><br>${a.v ? esc(a.v).replace(/\n/g, "<br>") : `<span class="mu">brak</span>`}</p>`;
    res = `<div class="res prac"><details${q.type === "long" && a.v ? " open" : ""}><summary>${q.type === "long" ? "Wzorzec odpowiedzi i punktacja" : "Kryteria sprawdzenia rysunku"}</summary><div>${q.key || ""}</div></details>
      ${linksHTML(q, "Do powtórki w notatce")}</div>`;
  }
  return `<section class="q"><div class="qh"><span class="qn">${n + 1} / ${T.questions.length}</span>${pill}</div>${body}${res}</section>`;
}
function renderResult() {
  document.title = `${T.title}: wynik · ${D.title}`;
  $("#h1").textContent = T.title; $("#sub").textContent = `${T.kind} · wynik`;
  $("#back").href = "#";
  const tags = {};
  for (const q of T.questions) {
    if (!isClosed(q)) continue;
    const g = grade(q, S.answers[q.id] || {}), t = tags[q.tag] ??= {pts: 0, max: 0};
    t.pts += g.pts; t.max += g.max;
  }
  const L = S.last || {pts: 0, max: 0}, pct = L.max ? Math.round(100 * L.pts / L.max) : 0;
  const nPrac = T.questions.filter(q => !isClosed(q)).length;
  const rows = Object.entries(tags).map(([k, t]) => {
    const p = t.max ? t.pts / t.max : 0, cls = p >= .8 ? "ok" : p >= .5 ? "part" : "bad";
    return `<tr><td>${esc((T.tags || {})[k] || k)}</td><td><span class="pill ${cls}">${+t.pts.toFixed(2)} / ${t.max}</span></td>
      <td><div class="meter"><i style="width:${Math.round(100 * p)}%;background:var(--${cls === "ok" ? "ok" : cls === "part" ? "warn" : "bad"})"></i></div></td></tr>`;
  }).join("");
  $("#app").innerHTML = `<div class="panel">${L.max ? `<div class="big">${pct}%</div>
    <div class="mu" style="margin-top:6px">${+L.pts.toFixed(2)} / ${L.max} pkt z pytań zamkniętych${nPrac ? ` · ${nPrac} pytań opisowych i rysunkowych do samodzielnego sprawdzenia` : ""}</div>`
    : `<div class="big">✎</div><div class="mu" style="margin-top:6px">Ten zestaw ma tylko pytania opisowe i rysunkowe. Porównaj swoje odpowiedzi i rysunki ze wzorcem pod każdym pytaniem
      i oceń się tak jak na kolokwium: 0, ½ albo 1 pkt za pytanie, zaliczenie od 3 pkt.</div>`}
    ${rows ? `<h2 style="margin-top:18px">Podtematy</h2><table class="tags">${rows}</table>` : ""}
    <div class="acts"><button class="btn pri" id="again" type="button">Rozwiąż ponownie</button><a class="btn" href="#">Wszystkie zestawy</a></div></div>
    <h2>Odpowiedzi</h2>${T.questions.map(reviewHTML).join("")}`;
  $("#again").addEventListener("click", () => { const last = S.last; store(T.id, {last}); S = null; route(); });
}
route();
</script>
