:root { --bg:#000; --s1:#0f0f10; --bd:#262628; --tx:#f4f4f4; --mu:#8d8d92; --soft:#d9d9dc;
  --cy:#45d0de; --or:#ff7a1a; --fu:#ff4fc0; --gr:#6a6a70;
  --chip-bg:#0b0b0c; --chip-bd:#3a3a3d; --zone-bd:rgba(255,255,255,.09); --zone-bg:rgba(20,21,25,.42); --zone-sh:inset 0 1px 0 rgba(255,255,255,.05);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
/* Light theme: soft grey paper instead of white, ink instead of black, accents darkened to keep contrast on a light ground */
:root[data-theme=light] { --bg:#e9ecf0; --s1:#f6f7f9; --bd:#cfd4db; --tx:#1c2028; --mu:#586170; --soft:#343b47;
  --cy:#07798c; --or:#b8530a; --fu:#a8256f; --gr:#8a929d;
  --chip-bg:#f6f7f9; --chip-bd:#c4cad3; --zone-bd:rgba(255,255,255,.8); --zone-bg:rgba(255,255,255,.42); --zone-sh:0 12px 32px -16px rgba(40,55,80,.28), inset 0 1px 0 rgba(255,255,255,.9); }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html[data-theme=light] { color-scheme:light; }
html { color-scheme:dark; -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 var(--mono); transition:background-color .35s, color .35s; }
#kg { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }  /* kinetic grid, behind everything */
main { position:relative; z-index:1; margin:0 auto; padding:calc(env(safe-area-inset-top) + 28px) 16px 64px; }
@media (display-mode: fullscreen) { main { padding-top:calc(env(safe-area-inset-top) + 40px); } }  /* installed app runs fullscreen: no system bar above the title */
.hd { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
.tg { flex:none; width:48px; height:48px; display:grid; place-items:center; padding:0; color:var(--tx); text-decoration:none; background:var(--chip-bg); border:1.5px solid var(--chip-bd); border-radius:50%; cursor:pointer; transition:border-color .2s, background-color .35s, color .35s; }
body:not(.away) .tg:hover { border-color:var(--ac, var(--cy)); }
.tg svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
h1 { margin:0; font-size:32px; line-height:1.1; font-weight:700; letter-spacing:-.02em; }
.sub { color:var(--mu); font-size:12px; margin:4px 0 26px; }
/* frosted (matte) glass panel: the grid shows through, blurred */
.glass { position:relative; border:1.5px solid var(--zone-bd); border-radius:38px; padding:26px 26px 30px; background:var(--zone-bg);
  backdrop-filter:blur(22px) saturate(1.15); -webkit-backdrop-filter:blur(22px) saturate(1.15); box-shadow:var(--zone-sh);
  transition:border-color .3s ease, box-shadow .3s ease, background-color .35s ease; }

/* test engine (alsi.py tests): tokens on top of shared.css */
:root { --ac:var(--cy); --s2:#18181a; --ok:#4cc38a; --bad:#ff5d5d; --warn:#e8b23a;
  --fl-cy:rgba(69,208,222,.16); --fl-or:rgba(255,122,26,.16); --fl-fu:rgba(255,79,192,.16); --fl-sh:rgba(217,217,220,.1); }
:root[data-theme=light] { --s2:#eceef2; --ok:#1d8a57; --bad:#c62f2f; --warn:#9a6b00;
  --fl-cy:rgba(7,121,140,.14); --fl-or:rgba(184,83,10,.14); --fl-fu:rgba(168,37,111,.14); --fl-sh:rgba(52,59,71,.08); }
main { max-width:56rem; padding-bottom:120px; }
.hd { margin-bottom:22px; } .lead { display:flex; align-items:center; gap:16px; min-width:0; } .lead .sub { margin:6px 0 0; }
a { color:var(--cy); }
.mu { color:var(--mu); } .small { font-size:12.5px; }
.panel { background:var(--s1); border:1px solid var(--bd); border-radius:20px; padding:18px 20px; margin:0 0 14px; }
.btn { font:inherit; font-size:14px; color:var(--tx); background:var(--chip-bg); border:1.5px solid var(--chip-bd); border-radius:999px; padding:9px 18px; cursor:pointer; text-decoration:none; display:inline-block; }
.btn:hover { border-color:var(--ac); } .btn.pri { background:var(--cy); border-color:var(--cy); color:var(--bg); font-weight:700; }
.btn:disabled { opacity:.5; cursor:default; }
.row { position:relative; display:flex; align-items:center; gap:18px; margin:0 0 10px; padding:14px 22px 14px 30px; color:inherit; text-decoration:none;
  background:var(--s1); border:1px solid var(--bd); border-radius:20px; transition:border-color .2s, transform .2s; }
.row:hover { border-color:var(--ac); transform:translateY(-1px); }
.row .bar { position:absolute; left:12px; top:14px; bottom:14px; width:6px; border-radius:6px; background:var(--ac); }
.row .k { flex:none; min-width:6.5rem; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ac); }
.row .nm { flex:1; min-width:0; font-size:16px; font-weight:700; }
.row .nm small { display:block; font-weight:400; font-size:12.5px; color:var(--mu); margin-top:2px; }
.row .dt { flex:none; color:var(--mu); font-size:13px; text-align:right; }
.row .dt b { color:var(--tx); }
h2 { font-size:18px; margin:26px 0 10px; }
.q { background:var(--s1); border:1px solid var(--bd); border-radius:20px; padding:16px 18px; margin:14px 0; }
.qh { display:flex; gap:10px; align-items:baseline; justify-content:space-between; font-size:12px; color:var(--mu); margin-bottom:6px; }

// Kinetic grid: dots (as dense as the old static pattern) joined by faint lines; near the pointer the grid bends and

// (Vanilla port of the React KineticGrid, toned down on purpose.)
const kg = document.getElementById('kg'), g = kg.getContext('2d');

</script>

umieszczonym nad tabliczką rysunkową?", "options": ["Od dołu do góry: nagłówek tabeli na dole, pozycja 1 tuż nad nim", "Od góry do dołu: nagłówek na górze, pozycja 1 pod nagłówkiem", "Alfabetycznie według nazw części, niezależnie od numerów pozycji na rysunku", "Od największej do najmniejszej części, żeby najważniejsze były na górze"], "answer": 0, "explain": "Wykaz części rośnie w górę od tabliczki, dlatego nagłówek jest na dole, a pozycja 1 tuż nad nim; nowe pozycje dopisuje się wyżej. Układ „jak zwykła tabela” z nagłówkiem u góry to typowa pomyłka.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#r-plan", "t": "17.10 · Plansza: zespół z wykazem"}], "partial": true}, {"id": "q05", "type": "abc", "tag": "pod.rodzaje", "q": "W wykazie części jest śruba znormalizowana (np. śruba z łbem sześciokątnym wg ISO 4017) i pokrywa własnej konstrukcji. Co wpisuje się w kolumnie „materiał” dla śruby?", "options": ["Nic: dla części znormalizowanej informację daje numer normy i klasa własności mechanicznych", "Gatunek stali, tak samo jak dla pokrywy", "Numer rysunku wykonawczego śruby", "Słowo „stal”, bo dokładny gatunek określa dopiero dostawca"], "answer": 0, "explain": "Dla części znormalizowanych materiału się nie wpisuje, bo wynika on z normy i klasy własności (np. 8.8). Materiał i numer rysunku podaje się dla części nieznormalizowanych, takich jak pokrywa.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#r-5", "t": "17.10 · Nazwa i materiał"}], "partial": false}, {"id": "q06", "type": "abc", "tag": "pod.rodzaje", "q": "Jak oznacza się części numerami pozycji na rysunku złożeniowym według normy?", "options": ["Liczbą nad kreską linii odniesienia rysowanej linią cienką; każdą część numeruje się tylko raz, w miejscu, gdzie jest czytelna", "Liczbą w kółku (baloniku) na końcu linii odniesienia; inny zapis jest niezgodny z normą", "Liczbą przy każdym wystąpieniu części na każdym rzucie, żeby można ją było odszukać na wszystkich rzutach", "Liczbą nad kreską linii odniesienia rysowanej linią grubą, żeby odróżniała się od linii wymiarowych"], "answer": 0, "explain": "Wg normy numer pozycji stoi nad kreską odniesienia, wszystkie linie opisowe są cienkie, a numer każdej części występuje raz. Balonik spotyka się w CAD, ale norma opisuje zapis nad kreską.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#r-3", "t": "17.10 · Numer pozycji"}], "partial": false}, {"id": "q07", "type": "short", "tag": "pod.formaty", "q": "Podaj wymiary formatu zasadniczego A4 w mm (krótszy × dłuższy bok).", "answer": ["210x297", "210×297", "210 x 297", "210*297", "210na297", "210x297mm", "210×297mm", "210mmx297mm", "210mm×297mm", "210mm x 297mm", "210/297"], "explain": "A4 = 210 × 297 mm; to format zasadniczy, z którego przez zwielokrotnienie powstają formaty podstawowe (A3 = 2×A4 itd.).", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#f-1", "t": "17.10 · Format A4"}], "partial": false}, {"id": "q08", "type": "abc", "tag": "pod.formaty", "q": "Jakie wymiary ma arkusz A3?", "options": ["297 × 420 mm", "420 × 594 mm", "210 × 420 mm", "148 × 210 mm"], "answer": 0, "explain": "A3 powstaje z dwóch A4 złożonych dłuższymi bokami, więc jego krótszy bok to dłuższy bok A4 (297), a dłuższy to 2 × 210 = 420. 420 × 594 to A2, 148 × 210 to A5.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#f-2", "t": "17.10 · Formaty podstawowe"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#fa-form", "t": "17.10 · Formaty arkuszy"}], "partial": false}, {"id": "q09", "type": "abc", "tag": "pod.formaty", "q": "Jakie wymiary ma format pochodny A4×3?", "options": ["297 × 630 mm", "210 × 891 mm", "630 × 891 mm", "297 × 891 mm"], "answer": 0, "explain": "Formaty pochodne powstają przez zwielokrotnienie krótszego boku formatu podstawowego: 3 × 210 = 630, dłuższy bok A4 (297) zostaje. Wynik 210 × 891 to błąd mnożenia dłuższego boku.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#f-3", "t": "17.10 · Formaty pochodne"}], "partial": false}, {"id": "q10", "type": "abc", "tag": "pod.formaty", "q": "W jakim układzie stosuje się arkusze według aktualnej normy?", "options": ["A4 wyłącznie pionowo, A3 i większe poziomo", "Formaty parzyste (A4, A2, A0) pionowo, nieparzyste (A3, A1) poziomo", "Wszystkie formaty pionowo, tabliczką przy krótszym boku", "Dowolnie, układ wybiera rysujący i zaznacza go w tabliczce"], "answer": 0, "explain": "Obecnie A4 jest jedynym formatem pionowym, a A3 i większe stosuje się poziomo. Podział na parzyste pionowe i nieparzyste poziome to reguła z dawnej normy, spotykana w starszych podręcznikach.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#f-4", "t": "17.10 · Orientacja"}], "partial": false}, {"id": "q11", "type": "abc", "tag": "pod.ramka", "q": "Jaką linią rysuje się ramkę (linię obramowania pola rysunku)?", "options": ["Linią ciągłą grubą o szerokości 0,7 mm", "Linią ciągłą bardzo grubą o szerokości ok. 1,4 mm", "Linią ciągłą cienką o szerokości 0,35 mm", "Linią cienką z długą kreską i dwiema kropkami"], "answer": 0, "explain": "Wg obecnej normy ramka to linia ciągła gruba 0,7 mm. Linię bardzo grubą stosowano do ramki według dawnych norm; cienka dwukropkowa obramowuje szczególne pola na rysunku, a nie arkusz.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#k-2", "t": "17.10 · Ramka"}], "partial": false}, {"id": "q12", "type": "abc", "tag": "pod.ramka", "q": "Na którym arkuszu (A3, układ poziomy) tabliczka rysunkowa jest umieszczona prawidłowo?", "options": ["<svg viewBox=\"0 0 160 116\" role=\"img\" aria-label=\"Arkusz w układzie poziomym z ramką; tabliczka rysunkowa przylega do ramki w prawym dolnym rogu.\"><rect class=\"ax\" x=\"5.0\" y=\"5.0\" width=\"150.0\" height=\"106.0\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"14.0\" y=\"9.5\" width=\"136.5\" height=\"97.0\" style=\"stroke-width:2\"/><rect class=\"sh\" x=\"94.5\" y=\"86.5\" width=\"56.0\" height=\"20.0\" style=\"stroke-width:1.6\"/><line class=\"ax\" x1=\"94.5\" y1=\"96.5\" x2=\"150.5\" y2=\"96.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"119.7\" y1=\"86.5\" x2=\"119.7\" y2=\"106.5\" style=\"stroke-width:1\"/><\/svg>", "<svg viewBox=\"0 0 160 116\" role=\"img\" aria-label=\"Arkusz w układzie poziomym z ramką; tabliczka rysunkowa przylega do ramki w lewym dolnym rogu.\"><rect class=\"ax\" x=\"5.0\" y=\"5.0\" width=\"150.0\" height=\"106.0\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"14.0\" y=\"9.5\" width=\"136.5\" height=\"97.0\" style=\"stroke-width:2\"/><rect class=\"sh\" x=\"14.0\" y=\"86.5\" width=\"56.0\" height=\"20.0\" style=\"stroke-width:1.6\"/><line class=\"ax\" x1=\"14.0\" y1=\"96.5\" x2=\"70.0\" y2=\"96.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"39.2\" y1=\"86.5\" x2=\"39.2\" y2=\"106.5\" style=\"stroke-width:1\"/><\/svg>", "<svg viewBox=\"0 0 160 116\" role=\"img\" aria-label=\"Arkusz w układzie poziomym z ramką; tabliczka rysunkowa przylega do ramki w prawym górnym rogu.\"><rect class=\"ax\" x=\"5.0\" y=\"5.0\" width=\"150.0\" height=\"106.0\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"14.0\" y=\"9.5\" width=\"136.5\" height=\"97.0\" style=\"stroke-width:2\"/><rect class=\"sh\" x=\"94.5\" y=\"9.5\" width=\"56.0\" height=\"20.0\" style=\"stroke-width:1.6\"/><line class=\"ax\" x1=\"94.5\" y1=\"19.5\" x2=\"150.5\" y2=\"19.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"119.7\" y1=\"9.5\" x2=\"119.7\" y2=\"29.5\" style=\"stroke-width:1\"/><\/svg>", "<svg viewBox=\"0 0 160 116\" role=\"img\" aria-label=\"Arkusz w układzie poziomym z ramką; tabliczka rysunkowa przylega do ramki na środku dolnego boku.\"><rect class=\"ax\" x=\"5.0\" y=\"5.0\" width=\"150.0\" height=\"106.0\" style=\"stroke-width:1\"/><rect class=\"sh\" x=\"14.0\" y=\"9.5\" width=\"136.5\" height=\"97.0\" style=\"stroke-width:2\"/><rect class=\"sh\" x=\"54.2\" y=\"86.5\" width=\"56.0\" height=\"20.0\" style=\"stroke-width:1.6\"/><line class=\"ax\" x1=\"54.2\" y1=\"96.5\" x2=\"110.2\" y2=\"96.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"79.5\" y1=\"86.5\" x2=\"79.5\" y2=\"106.5\" style=\"stroke-width:1\"/><\/svg>"], "answer": 0, "explain": "Tabliczka rysunkowa leży w prawym dolnym rogu pola rysunku i przylega do ramki od dołu i od prawej. Dzięki temu po złożeniu arkusza harmonijkowo do A4 jest na wierzchu.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#k-3", "t": "17.10 · Tabliczka"}], "partial": false}, {"id": "q13", "type": "multi", "tag": "pod.ramka", "q": "Tabliczki rysunkowe dzieli się na podstawowe, zmniejszone i uproszczone. Które informacje występują zarówno w tabliczce podstawowej, jak i w zmniejszonej?", "options": ["numer rysunku", "nazwa przedmiotu", "format arkusza", "podziałka", "masa", "rodzaj materiału"], "answer": [0, 1, 2], "explain": "Strefa A (numer rysunku, nazwa przedmiotu, nazwa przedsiębiorstwa) i m.in. format arkusza są w obu tabliczkach. Tabliczka zmniejszona nie ma podziałki, materiału ani masy.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#k-4", "t": "17.10 · Strefy tabliczki"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#k-3", "t": "17.10 · Tabliczka"}], "partial": false}, {"id": "q14", "type": "abc", "tag": "pod.ramka", "q": "Jak składa się arkusz rysunkowy większy niż A4?", "options": ["Harmonijkowo do formatu A4, tak by tabliczka rysunkowa była na wierzchu", "Na pół i jeszcze raz na pół, tabliczką do środka, żeby jej nie zabrudzić", "Harmonijkowo do formatu A5, tak by tabliczka była na wierzchu", "Na pół wzdłuż dłuższego boku, a potem zwija się w rulon"], "answer": 0, "explain": "Arkusze większe od A4 składa się harmonijką do A4, a tabliczka zawsze zostaje na wierzchu, żeby bez rozkładania było wiadomo, co jest na rysunku. A4 się nie składa, A3 składa się na pół.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#k-5", "t": "17.10 · Składanie"}], "partial": false}, {"id": "q15", "type": "abc", "tag": "pod.podzialki", "q": "Co oznacza zapis podziałki 2:1 w tabliczce rysunkowej?", "options": ["Przedmiot narysowano dwukrotnie większy niż w rzeczywistości (podziałka zwiększająca)", "Przedmiot narysowano dwukrotnie mniejszy niż w rzeczywistości (podziałka zmniejszająca)", "Liczby wymiarowe na rysunku są dwukrotnie większe od wymiarów rzeczywistych", "Podziałkę wybrano z drugiego, mniej zalecanego szeregu"], "answer": 0, "explain": "Podziałka to stosunek wymiaru na rysunku do wymiaru rzeczywistego, więc 2:1 oznacza powiększenie. Liczby wymiarowe nie zmieniają się z podziałką; zawsze podaje się wymiary rzeczywiste.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#p-1", "t": "17.10 · Podziałka"}], "partial": false}, {"id": "q16", "type": "abc", "tag": "pod.podzialki", "q": "Czop ma w rzeczywistości długość 40 mm. Rysunek wykonano w podziałce 2:1. Jaką liczbę wymiarową wpisuje się przy tym wymiarze?", "options": ["40", "80", "20", "80, a w tabliczce dopisuje się podziałkę 2:1"], "answer": 0, "explain": "Niezależnie od podziałki na rysunku wpisuje się wymiary rzeczywiste. Linia ma na arkuszu 80 mm, ale liczba wymiarowa to 40; wpisanie wymiaru przeskalowanego to najczęstszy błąd.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#p-3", "t": "17.10 · Wymiar rzeczywisty"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#x-podz", "t": "17.10 · Przykład podziałki"}], "partial": false}, {"id": "q17", "type": "abc", "tag": "pod.podzialki", "q": "Rzuty narysowano w podziałce 2:1, a szczegół (widok cząstkowy) oznaczono podziałką 5:1. Ile razy szczegół jest większy od rzeczywistego przedmiotu?", "options": ["5 razy", "10 razy", "2,5 raza", "7 razy"], "answer": 0, "explain": "Podziałka szczegółu odnosi się do wymiarów rzeczywistych, a nie do podziałki rysunku z tabliczki. 10 razy to wynik błędnego mnożenia 2 × 5.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#v-3", "t": "17.10 · Szczegół"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#p-1", "t": "17.10 · Podziałka"}], "partial": false}, {"id": "q18", "type": "abc", "tag": "pod.linie", "q": "Jak nazywa się linia wskazana numerem 1 i co przedstawia?", "svg": "<svg viewBox=\"0 0 430 170\" role=\"img\" aria-label=\"Widok wałka stopniowanego z nieprzelotowym otworem osiowym od prawego czoła; numer 1 wskazuje linię biegnącą wzdłuż osi wałka, numer 2 wskazuje linię zarysu otworu.\"><rect class=\"sh\" x=\"60.0\" y=\"45.0\" width=\"160.0\" height=\"80.0\" style=\"stroke-width:2.6\"/><rect class=\"sh\" x=\"220.0\" y=\"65.0\" width=\"140.0\" height=\"40.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"44.0\" y1=\"85.0\" x2=\"376.0\" y2=\"85.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"296.0\" y1=\"76.0\" x2=\"360.0\" y2=\"76.0\" style=\"stroke-width:1;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"296.0\" y1=\"94.0\" x2=\"360.0\" y2=\"94.0\" style=\"stroke-width:1;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"296.0\" y1=\"76.0\" x2=\"287.0\" y2=\"85.0\" style=\"stroke-width:1;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"287.0\" y1=\"85.0\" x2=\"296.0\" y2=\"94.0\" style=\"stroke-width:1;stroke-dasharray:6 3\"/><line class=\"cy\" x1=\"393.8\" y1=\"57.8\" x2=\"372.0\" y2=\"85.0\" style=\"stroke-width:1\"/><circle class=\"cy\" cx=\"372.0\" cy=\"85.0\" r=\"2.2\" style=\"fill:var(- th:1.6\"/><line class=\"ax\" x1=\"75.0\" y1=\"134.0\" x2=\"75.0\" y2=\"147.0\" style=\"stroke-width:1.6\"/><line class=\"ax\" x1=\"75.0\" y1=\"3.0\" x2=\"75.0\" y2=\"16.0\" style=\"stroke-width:1.6\"/><\/svg>"], "answer": 0, "explain": "Osie rysuje się linią cienką z długą kreską i kropką; przecinają się na kreskach (nie na kropkach ani przerwach) i wystają poza zarys okręgu. Pozostałe rysunki mają po jednym błędzie: osie kończą się na okręgu, przecinają się na kropkach albo narysowano je linią kreskową.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-4", "t": "17.10 · Środek otworu"}], "partial": false}, {"id": "q24", "type": "abc", "tag": "pod.linie", "q": "Rysunek przedstawia dwa rzuty tulei. Co jest na nim narysowane błędnie?", "svg": "<svg viewBox=\"0 0 350 170\" role=\"img\" aria-label=\"Dwa rzuty tulei: po lewej widok z przodu (prostokąt, otwór liniami kreskowymi), po prawej widok z boku (dwa współśrodkowe okręgi). Pozioma oś symetrii jest jedną nieprzerwaną linią kreska-kropka biegnącą przez oba rzuty i odstęp między nimi; pionowa oś przechodzi przez środek okręgów.\"><rect class=\"sh\" x=\"40.0\" y=\"50.0\" width=\"120.0\" height=\"80.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"40.0\" y1=\"72.0\" x2=\"160.0\" y2=\"72.0\" style=\"stroke-width:1;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"40.0\" y1=\"108.0\" x2=\"160.0\" y2=\"108.0\" style=\"stroke-width:1;stroke-dasharray:6 3\"/><circle class=\"sh\" cx=\"270.0\" cy=\"90.0\" r=\"40.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"270.0\" cy=\"90.0\" r=\"18.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"28.0\" y1=\"90.0\" x2=\"322.0\" y2=\"90.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><line class=\"ax\" x1=\"270.0\" y1=\"40.0\" x2=\"270.0\" y2=\"140.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>", "options": ["Oś symetrii poprowadzono jedną linią przez oba rzuty; każdy rzut powinien mieć własną oś", "Osie wystają poza zarys; powinny kończyć się dokładnie na zarysie", "Zarys otworu w widoku z przodu narysowano linią kreskową; powinna to być linia ciągła cienka", "Na widoku z boku otwór narysowano okręgiem ciągłym grubym; powinien być kreskowy"], "answer": 0, "explain": "Osi i płaszczyzn symetrii nie przeciąga się przez kilka rzutów, nawet gdy leżą na tej samej wysokości; przez rzuty wolno prowadzić tylko linie ciągłe cienkie pomocnicze. Wysunięcie osi poza zarys jest poprawne, a otwór widziany od czoła jest widoczny, więc ma zarys ciągły gruby.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-5", "t": "17.10 · Osie osobno"}], "partial": false}, {"id": "q25", "type": "multi", "tag": "pod.linie", "q": "Które zasady dotyczące linii pomocniczych i krawędzi niewidocznych są prawidłowe?", "options": ["Linie pomocnicze (wymiarowe, odnoszące) rysuje się zawsze linią ciągłą cienką", "Cienkie ciągłe linie pomocnicze wolno prowadzić przez kilka rzutów", "Nie wymiaruje się do krawędzi niewidocznych", "Linie odnoszące można rysować linią kreskową cienką, żeby odróżnić je od linii wymiarowych", "Do krawędzi niewidocznej wolno wymiarować, jeśli rysunek nie ma przekroju"], "answer": [0, 1, 2], "explain": "Linie pomocnicze są zawsze ciągłe cienkie, nigdy nieciągłe (kreskowe linie odnoszące z niektórych książek są błędne) i mogą przechodzić przez rzuty, w przeciwieństwie do osi. Krawędzie niewidoczne służą tylko poglądowo; do nich się nie wymiaruje.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-5", "t": "17.10 · Osie osobno"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-2", "t": "17.10 · Kreskowe"}], "partial": false}, {"id": "q26", "type": "abc", "tag": "pod.linie", "q": "W jakim stosunku pozostają grubości linii cienkiej, grubej i bardzo grubej?", "options": ["1 : 2 : 4 (np. 0,25 : 0,5 : 1 mm)", "1 : 1,5 : 2 (np. 0,35 : 0,5 : 0,7 mm)", "1 : 2 : 3 (np. 0,25 : 0,5 : 0,75 mm)", "1 : 3 : 4 (np. 0,18 : 0,5 : 0,7 mm)"], "answer": 0, "explain": "Grubości linii mają stosunek 1:2:4 (dopuszczalnie 1:3:6), więc linia cienka ma połowę grubości linii grubej; zalecane grupy to 0,5 i 0,7 mm. Wartości 0,35/0,5/0,7 to kolejne grupy linii (skok ok. √2), a nie odmiany w jednej grupie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-1", "t": "17.10 · Grubość linii"}], "partial": false}, {"id": "q27", "type": "abc", "tag": "pod.linie", "q": "Czym różni się zastosowanie linii ciągłej cienkiej odręcznej od linii ciągłej cienkiej zygzakowatej?", "options": ["Obie kończą przerwany lub cząstkowy widok, przekrój albo kład; odręczna przy kreśleniu ręcznym, zygzakowata przy rysunku z CAD, a na jednym rysunku zaleca się tylko jedną z nich", "Odręczną rysuje się przerwania długich elementów, a zygzakowatą wyrwania przekroju miejscowego; na jednym rysunku stosuje się obie", "Odręczna kończy widoki cząstkowe, a zygzakowata oznacza linie gięcia na rozwinięciach blach", "Zygzakowata jest gruba i kończy przekroje, a odręczna jest cienka i kończy widoki"], "answer": 0, "explain": "Obie linie mają to samo zastosowanie (granica widoku, przekroju lub kładu cząstkowego, gdy nie jest nią linia symetrii); różnią się sposobem wykonania. Zaleca się jeden rodzaj na jednym rysunku. Obie są cienkie.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-6", "t": "17.10 · Odręczna i zygzak"}], "partial": false}, {"id": "q28", "type": "abc", "tag": "pod.linie", "q": "W starszych podręcznikach osie i linie symetrii rysuje się linią nazywaną „punktową cienką”. Jak nazywa się linia o tym wyglądzie i zastosowaniu w aktualnym nazewnictwie?", "options": ["Linia cienka z długą kreską i kropką", "Linia gruba z długą kreską i kropką", "Linia cienka z długą kreską i dwiema kropkami", "Linia kreskowa cienka"], "answer": 0, "explain": "Zmieniła się tylko nazwa: dawna „punktowa” (osie, symetria) to obecna linia cienka z długą kreską i kropką, a dawna „falista” to obecna ciągła cienka odręczna. Odmiana gruba z kreską i kropką służy do płaszczyzn przekrojów i wymaganych obszarów obróbki, a dwukropkowa do części przyległych.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-3", "t": "17.10 · Cienka z kreską i kropką"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-6", "t": "17.10 · Odręczna i zygzak"}], "partial": false}, {"id": "q29", "type": "long", "tag": "pod.linie", "pts": 1, "q": "Opisz linię ciągłą grubą: jak wygląda, jaką ma grubość i do czego służy. Podaj jak najwięcej zastosowań.", "key": "<b>1 pkt:<\/b> poprawny wygląd i grubość (w tym zależność od grupy linii) oraz co najmniej 4 zastosowania, w tym krawędzie/zarysy widoczne i co najmniej jedno związane z gwintem. <b>0,5 pkt:<\/b> poprawny opis linii i 2–3 zastosowania albo pełna lista zastosowań z błędną grubością. <b>0 pkt:<\/b> tylko „zarys przedmiotu” bez opisu albo pomylenie z linią cienką (np. przypisanie jej linii wymiarowych lub kreskowania). <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>linia ciągła, bez przerw; nr 01.2; najczęściej stosowana linia rysunku<\/li><li>grubość wg grupy linii, zalecane 0,5 lub 0,7 mm (na A3/A4 zwykle 0,5); cienka = połowa grubej, stosunek cienka : gruba : bardzo gruba = 1 : 2 : 4<\/li><li>widoczne krawędzie i widoczne zarysy przedmiotu<\/li><li>wierzchołki gwintu (zewnętrznego i wewnętrznego)<\/li><li>granica długości gwintu pełnego (użytkowego)<\/li><li>główne przedstawienie na wykresach, planach, schematach; układ linii w konstrukcjach metalowych (np. kratownice)<\/li><li>linie podziału form na widokach; linie przekrojów i strzałki kładów (grube odcinki końcowe śladu płaszczyzny przekroju)<\/li><li>ramka arkusza (gruba 0,7 mm); w konstrukcjach graficznych linie wynikowe (pomocnicze są cienkie)<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-1", "t": "17.10 · Ciągła gruba"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-1", "t": "17.10 · Grubość linii"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#k-2", "t": "17.10 · Ramka"}], "partial": false}, {"id": "q30", "type": "long", "tag": "pod.linie", "pts": 1, "q": "Scharakteryzuj linię cienką z długą kreską i kropką: wygląd i wymiary jej elementów, zakres stosowania oraz zasady rysowania.", "key": "<b>1 pkt:<\/b> poprawny wygląd, co najmniej 3 zastosowania i co najmniej jedna zasada rysowania (kończenie/przecinanie kreskami, wysunięcie poza zarys albo osobne osie w każdym rzucie). <b>0,5 pkt:<\/b> wygląd i 1–2 zastosowania albo zastosowania bez żadnej zasady rysowania. <b>0 pkt:<\/b> pomylenie z linią dwukropkową lub z jej odmianą grubą (np. „ślad płaszczyzny przekroju” jako główne zastosowanie). <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>nr 04.1; dawniej nazywana „linią punktową cienką” (zmiana nazwy, zakres ten sam)<\/li><li>długa kreska ok. 10–12 mm, przerwa, punkt (krótka kreska ≤ 3 grubości linii, wizualnie kropka, nie kółko), przerwa; przerwy zależą od grubości linii<\/li><li>linie środkowe (osie otworów, walców, znacznik środka okręgu)<\/li><li>linie (osie) symetrii<\/li><li>okręgi podziałowe kół zębatych; okręgi podziałowe otworów<\/li><li>zaczyna się, kończy i przecina kreskami, nigdy kropką ani przerwą; środek okręgu na przecięciu dwóch kresek<\/li><li>oś wystaje poza zarys; nie przeciąga się jej przez wszystkie rzuty, każdy rzut ma własne osie<\/li><li>odróżnienie: odmiana gruba (04.2) oznacza płaszczyzny przekrojów i wymagane obszary obróbki powierzchniowej<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-3", "t": "17.10 · Cienka z kreską i kropką"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-2", "t": "17.10 · Odstępy i kropka"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-3", "t": "17.10 · Kreska na końcu"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-4", "t": "17.10 · Środek otworu"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-5", "t": "17.10 · Osie osobno"}], "partial": false}, {"id": "q31", "type": "long", "tag": "pod.linie", "pts": 1, "q": "Opisz linię ciągłą cienką: grubość, zastosowania (jak najwięcej) i zasady jej stosowania. Wymień też jej odmiany do przerywania widoków.", "key": "<b>1 pkt:<\/b> grubość (połowa linii grubej) i co najmniej 5 zastosowań, w tym linie wymiarowe/pomocnicze i kreskowanie, oraz wzmianka o odmianach odręcznej lub zygzakowatej. <b>0,5 pkt:<\/b> 3–4 poprawne zastosowania bez odmian albo z drobnym błędem. <b>0 pkt:<\/b> przypisanie jej krawędzi widocznych lub wierzchołków gwintu jako głównego zastosowania albo mniej niż 3 zastosowania. <b>Elementy wzorcowej odpowiedzi:<\/b><ul><li>nr 01.1; grubość połowy linii grubej (np. 0,25 mm przy grupie 0,5), dzięki czemu rysunek się nie zaciemnia<\/li><li>linie wymiarowe i pomocnicze linie wymiarowe; linie wskazujące i odniesienia (np. numery pozycji)<\/li><li>kreskowanie przekrojów (dla każdego materiału)<\/li><li>wyobrażalne linie przenikania; zarysy kładów miejscowych; krótkie linie środkowe<\/li><li>dno bruzdy gwintu; przekątne oznaczające powierzchnie płaskie; linie gięcia<\/li><li>obramowanie szczegółów; oznaczenie szczegółów powtarzanych; linie elementów zbieżnych; linie rzutowania, siatki<\/li><li>linie pomocnicze są zawsze ciągłe cienkie (nie kreskowe) i mogą przechodzić przez wszystkie rzuty<\/li><li>odmiany: ciągła cienka odręczna (dawniej falista, przy kreśleniu ręcznym) i zygzakowata (CAD) do zakończeń widoków, przekrojów i kładów cząstkowych oraz przerwań; na rysunku jedna z nich<\/li><\/ul>", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-4", "t": "17.10 · Ciągła cienka"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-6", "t": "17.10 · Odręczna i zygzak"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-1", "t": "17.10 · Grubość linii"}], "partial": false}, {"id": "q32", "type": "sketch", "tag": "pod.linie", "pts": 1, "q": "Narysuj ołówkiem jedna pod drugą sześć linii, każda o długości ok. 60 mm: ciągłą grubą, ciągłą cienką, kreskową cienką, cienką z długą kreską i kropką, cienką z długą kreską i dwiema kropkami oraz ciągłą cienką odręczną. Obok każdej wpisz jej nazwę i jedno zastosowanie.", "key": "<b>Musi być:<\/b> wyraźna różnica grubości (gruba ok. dwa razy grubsza od cienkich, obie czarne); kreskowa z kreskami ok. 3–6 mm i równymi krótkimi przerwami; z kreską i kropką: długie kreski ok. 10–12 mm i pojedyncze kropki (nie kółka), z dwiema kropkami: dwie kropki między długimi kreskami; każda linia nieciągła zaczyna się i kończy kreską; linia odręczna falista i cienka. Zastosowania np.: zarys widoczny; linia wymiarowa/kreskowanie; krawędź niewidoczna; oś symetrii; zarys części przyległej/skrajne położenie; przerwanie widoku. <b>1 pkt:<\/b> wszystkie 6 linii rozróżnialnych i poprawnie nazwanych, zastosowania poprawne. <b>0,5 pkt:<\/b> 1–2 błędy (np. brak różnicy grubości, kropki jako kreski, jedno złe zastosowanie). <b>0 pkt:<\/b> więcej błędów lub linie nie do odróżnienia. <b>Typowe błędy:<\/b> wszystkie linie tej samej grubości; linie zakończone kropką lub przerwą; kropka rysowana jako kółko; pomylenie zastosowań linii z jedną i z dwiema kropkami.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-plan", "t": "17.10 · Plansza: tuleja"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-5", "t": "17.10 · Pozostałe z kreską"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#l-6", "t": "17.10 · Odręczna i zygzak"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#gl-2", "t": "17.10 · Odstępy i kropka"}], "partial": false}, {"id": "q33", "type": "abc", "tag": "pod.pismo", "q": "Co jest wielkością nominalną pisma technicznego (h)?", "options": ["Wysokość wielkich liter", "Wysokość małych liter bez wydłużeń", "Odstęp między liniami bazowymi wierszy", "Grubość linii pisma"], "answer": 0, "explain": "Wielkość nominalna h to wysokość zarysu wielkich liter; pozostałe wymiary pisma są jej krotnościami. Małe litery mają 7/10 h.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-plan", "t": "17.10 · Plansza: pismo na siatce"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-2", "t": "17.10 · Wysokość pisma"}], "partial": false}, {"id": "q34", "type": "short", "tag": "pod.pismo", "q": "Pismo techniczne typu B o wysokości h = 5 mm. Jaka jest wysokość małych liter (bez części górnej i dolnej, np. „a”, „e”) w mm?", "answer": ["3,5", "3.5", "3,5mm", "3.5mm"], "explain": "W piśmie B małe litery mają 7/10 h, czyli 3,5 mm przy h = 5 mm. Część górna i dolna (np. w „h”, „g”) to dodatkowo po 3/10 h.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-plan", "t": "17.10 · Plansza: pismo na siatce"}], "partial": true}, {"id": "q35", "type": "multi", "tag": "pod.pismo", "q": "Które proporcje są prawdziwe dla pisma technicznego typu B (h = wysokość pisma)?", "options": ["wysokość małych liter = 7/10 h", "odstęp między wyrazami = 6/10 h", "odstęp między znakami = 2/10 h", "grubość linii = 1/14 h", "minimalny odstęp linii bazowych tekstu z polskimi znakami diakrytycznymi = 13/10 h"], "answer": [0, 1, 2], "explain": "W piśmie B grubość linii to h/10, a odstęp linii bazowych dla liter ze znakami diakrytycznymi to 19/10 h (13/10 h dotyczy tekstu z samych wielkich liter). Grubość h/14 odpowiada pismu typu A.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-3", "t": "17.10 · Cienka linia"}], "partial": true}, {"id": "q36", "type": "abc", "tag": "pod.pismo", "q": "Jaką wysokość pisma przewiduje tabela normy dla wymiarowania i uwag na arkuszach A3 i A4?", "options": ["3,5 lub 2,5 mm", "5 lub 3,5 mm", "7 lub 5 mm", "10 lub 7 mm"], "answer": 0, "explain": "Na A3 i A4 napisy główne mają 7 lub 5 mm, pomocnicze 5 lub 3,5 mm, a wymiarowanie i uwagi 3,5 lub 2,5 mm. W praktyce na tych formatach pisze się 5 i 3,5 mm, bo 7 mm nie mieści się w polach tabliczki.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-2", "t": "17.10 · Wysokość pisma"}], "partial": false}, {"id": "q37", "type": "abc", "tag": "pod.pismo", "q": "Która zasada pisania pismem technicznym jest prawidłowa?", "options": ["Każdą kreskę stawia się raz, linią cienką, i nie poprawia się ani nie pogrubia wpisanego tekstu", "Litery obwodzi się drugi raz, żeby były wyraźne na skanie i wydruku", "Najdokładniejsze litery uzyskuje się, rysując je przez szablon (wzornik) pisma", "Obowiązuje wyłącznie pismo pochyłe; pismo proste jest dopuszczalne tylko w tabliczce"], "answer": 0, "explain": "Kreska postawiona raz zostaje; poprawianie i pogrubianie zmienia grubość linii pisma. Szablonów się nie używa (mają inne kształty liter), a pismo proste jest odmianą uprzywilejowaną.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-3", "t": "17.10 · Cienka linia"}], "partial": false}, {"id": "q38", "type": "sketch", "tag": "pod.pismo", "pts": 1, "q": "Napisz ołówkiem pismem technicznym typu B prostym, h = 5 mm, na lekko zaznaczonych liniach pomocniczych, dwa wiersze: „GRAFIKA INŻYNIERSKA 1” oraz „Grafika inżynierska”. Pod spodem podaj wymiary, które przyjąłeś: wysokość małych liter, grubość linii, odstęp między znakami, między wyrazami i między liniami bazowymi.", "key": "<b>Wymiary (h = 5 mm):<\/b> małe litery 3,5 mm (7/10 h); część górna i dolna liter (k, f, g, j) 1,5 mm (3/10 h); grubość linii 0,5 mm (h/10); odstęp między znakami 1 mm (2/10 h); między wyrazami 3 mm (6/10 h); odstęp linii bazowych co najmniej 9,5 mm (19/10 h), bo tekst ma znaki diakrytyczne. <b>Kształty:<\/b> pismo proste (pionowe), jednakowa grubość kresek; litery A, M, N, P w kształcie z aktualnej normy; kropka nad Ż, ukośna kreska nad ń; wielkie i małe litery wyraźnie różnej wysokości. <b>1 pkt:<\/b> wysokości i odstępy zgodne z proporcjami (tolerancja wzrokowa), kształty liter zgodne z normą, brak poprawek. <b>0,5 pkt:<\/b> proporcje w przybliżeniu dobre, ale 1–2 rodzaje błędów (np. nierówna wysokość, złe znaki diakrytyczne, pogrubione kreski). <b>0 pkt:<\/b> pismo odręczne zwykłe, pochyłe bez zachowania proporcji albo brak rozróżnienia wielkich i małych liter. <b>Typowe błędy:<\/b> wodzenie ołówkiem kilka razy po tej samej kresce; małe litery prawie tak wysokie jak wielkie; za małe odstępy między wyrazami; dawne kształty liter z podręczników.", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-plan", "t": "17.10 · Plansza: pismo na siatce"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-3", "t": "17.10 · Cienka linia"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#ps-1", "t": "17.10 · Kształt liter"}], "partial": false}]}, {"id": "02_rzutowanie-i-widoki", "kind": "Dział 2", "title": "Rzutowanie prostokątne i widoki", "desc": "Zasady rzutowania prostokątnego, metody E i A, rozmieszczenie rzutów, dobór rzutu głównego, rodzaje widoków i półwidoki.", "intro": "Test sprawdza zasady rzutowania, metody E i A oraz rodzaje widoków. Pytania rysunkowe na końcu odpowiadają zadaniu, które na pewno pojawi się na kolokwium: półwidok, półwidok-półprzekrój i brakujące rzuty.", "tags": {"rzu.zasady": "Zasady rzutowania prostokątnego, rzut główny i liczba rzutów", "rzu.krok": "Rzutowanie krok po kroku: odpowiedniość rzutów, krawędzie niewidoczne, osie", "rzu.metody": "Metoda europejska (E) i amerykańska (A), rozmieszczenie rzutów", "rzu.widoki": "Rodzaje widoków: pomocniczy, cząstkowy, częściowy, szczegół, obrócony, rozwinięty", "rzu.polwidok": "Półwidok, ćwierćwidok, półwidok-półprzekrój"}, "questions": [{"type": "abc", "tag": "rzu.zasady", "q": "Jak przebiegają proste rzutujące w rzutowaniu prostokątnym?", "options": ["są równoległe do siebie i prostopadłe do rzutni", "zbiegają się w jednym punkcie (oku obserwatora)", "są równoległe do siebie i nachylone do rzutni pod stałym kątem", "są prostopadłe do głównych krawędzi przedmiotu, a rzutnia może być ustawiona dowolnie"], "answer": 0, "explain": "Rzutowanie prostokątne to rzutowanie równoległe, w którym kierunek rzutowania jest prostopadły do rzutni. Proste zbieżne dają rzut środkowy (perspektywę), a proste ukośne do rzutni dają rzut ukośny.", "id": "q01", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rz-1", "t": "17.10 · Prostopadle do rzutni"}], "partial": false}, {"type": "multi", "tag": "rzu.zasady", "q": "Które zasady dotyczą doboru rzutu głównego i liczby rzutów?", "options": ["rzut główny występuje na rysunku zawsze", "rzut główny pokazuje przedmiot, jeśli to możliwe, w położeniu użytkowym, od strony najbardziej charakterystycznej", "przedmiot ustawia się tak, by większość jego powierzchni płaskich i osi była równoległa lub prostopadła do rzutni", "aby kształt był jednoznaczny, rysuje się zawsze trzy rzuty: z przodu, z góry i z lewej", "rzut główny wybiera się tak, aby zawierał jak najwięcej krawędzi niewidocznych, bo wtedy niesie najwięcej informacji", "stożek rysuje się w rzucie głównym postawiony na wierzchołku, bo wtedy podstawa jest u góry i lepiej ją widać"], "answer": [0, 1, 2], "explain": "Liczbę rzutów ogranicza się do minimum: często wystarczają dwa rzuty, a dla bryły obrotowej z półwidokiem-półprzekrojem nawet jeden. Rzut główny ma mieć jak najwięcej krawędzi widocznych, nie niewidocznych, a przedmiot stawia się stabilnie (stożek na podstawie albo z osią poziomą).", "id": "q02", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-1", "t": "17.10 · Rzut główny"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-2", "t": "17.10 · Tylko niezbędne"}], "partial": false}, {"type": "abc", "tag": "rzu.zasady", "q": "Jak rysuje się długi przedmiot, który w położeniu użytkowym stoi pionowo (np. długi wałek)?", "options": ["w położeniu poziomym, a dolną część przedmiotu umieszcza się z prawej strony rzutu", "w położeniu poziomym, a dolną część przedmiotu umieszcza się z lewej strony rzutu", "pionowo, bo rzut główny zawsze pokazuje położenie użytkowe", "pionowo, ale tylko w półwidoku, żeby zmieścił się na arkuszu"], "answer": 0, "explain": "To dopuszczalne odstępstwo od zasady położenia użytkowego: przedmioty długie rysuje się poziomo, a ich dolna część trafia na prawą stronę rzutu. Położenie użytkowe obowiązuje tylko „jeżeli to możliwe”.", "id": "q03", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-1", "t": "17.10 · Rzut główny"}], "partial": false}, {"type": "abc", "tag": "rzu.zasady", "q": "Rzuty rozmieszczono zgodnie z rozwinięciem prostopadłościanu rzutni (normalny układ rzutów). Jak się je opisuje?", "options": ["nie dodaje się żadnych oznaczeń ani linii między rzutami", "nad każdym rzutem pisze się literę, a przy rzucie głównym strzałki kierunków patrzenia", "rzuty łączy się cienkimi liniami rzutującymi, żeby pokazać, które punkty sobie odpowiadają", "opisuje się tylko rzut główny literą A, pozostałe rzuty nie wymagają opisu"], "answer": 0, "explain": "W normalnym układzie położenie rzutu samo mówi, z którego kierunku go widać. Strzałki i litery stosuje się dopiero dla rzutów umieszczonych poza tym układem, a linii rzutujących między rzutami na rysunku technicznym się nie rysuje.", "id": "q04", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#zr-3", "t": "17.10 · Rzut przesunięty"}], "partial": false}, {"type": "abc", "tag": "rzu.krok", "q": "Która wielkość jest wspólna dla rzutu z góry i rzutu z lewej strony? (Przy konstrukcji przenosi się ją między tymi rzutami ćwiartką okręgu.)", "options": ["głębokość (odległość od rzutni pionowej, na której powstaje rzut z przodu)", "wysokość (odległość od rzutni poziomej)", "szerokość (odległość od rzutni bocznej)", "żadna, te dwa rzuty nie mają wspólnego wymiaru"], "answer": 0, "explain": "Rzut z przodu i z lewej mają wspólną wysokość (poziome linie odnoszące), rzut z przodu i z góry wspólną szerokość (pionowe linie odnoszące). Rzut z góry i z lewej łączy głębokość, którą przenosi łuk o środku w punkcie styku rzutni.", "id": "q05", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rz-4", "t": "17.10 · Rzuty punktu"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rx-3", "t": "17.10 · Bryła"}], "partial": false}, {"type": "multi", "tag": "rzu.krok", "q": "Prostokątna płytka jest prostopadła do rzutni bocznej (tej, na której powstaje rzut z lewej) i nachylona do rzutni pionowej i poziomej. Które zdania są prawdziwe?", "options": ["w rzucie z lewej płytka jest ukośnym odcinkiem", "w rzucie z przodu płytka jest prostokątem skróconym w stosunku do rzeczywistego", "w rzucie z góry płytka jest prostokątem skróconym w stosunku do rzeczywistego", "w rzucie z góry płytka ma naturalny kształt i wielkość", "w rzucie z przodu płytka jest odcinkiem, bo jest nachylona do rzutni pionowej"], "answer": [0, 1, 2], "explain": "Figura prostopadła do rzutni rzutuje się na nią jak odcinek, a figura ukośna do rzutni wychodzi w rzucie skrócona. Naturalny kształt daje tylko rzutnia równoległa do figury, a tu żadna nie jest.", "id": "q06", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rx-2", "t": "17.10 · Figura"}], "partial": false}, {"type": "abc", "tag": "rzu.krok", "q": "Bryła: prostopadłościan o szerokości 60, głębokości 40 i wysokości 40. Jego przedni pas o głębokości 15 jest obniżony do wysokości 20 (stopień). Który rysunek jest poprawnym rzutem z lewej strony w metodzie E (rzut leży po prawej stronie rzutu z przodu)?", "svg": "<svg viewBox=\"0 0 420 220\" role=\"img\" aria-label=\"Bryła w izometrii: prostopadłościan 60 na 40 na 40 z obniżonym przednim pasem (stopień o głębokości 15 i wysokości 20) oraz jej rzut z przodu: prostokąt z poziomą linią na wysokości 20.\"><polygon class=\"sh\" points=\"125.0,190.0 213.3,139.0 213.3,105.0 125.0,156.0\" style=\"stroke-width:2\"/><polygon class=\"sh\" points=\"125.0,156.0 213.3,105.0 191.3,92.2 102.9,143.2\" style=\"stroke-width:2\"/><polygon class=\"sh\" points=\"102.9,143.2 191.3,92.2 191.3,58.2 102.9,109.2\" style=\"stroke-width:2\"/><polygon class=\"sh\" points=\"102.9,109.2 191.3,58.2 154.4,37.0 66.1,88.0\" style=\"stroke-width:2\"/><polygon class=\"sh\" points=\"125.0,190.0 66.1,156.0 66.1,88.0 102.9,109.2 102.9,143.2 125.0,156.0\" style=\"stroke-width:2\"/><line class=\"ax\" x1=\"206.0\" y1=\"163.7\" x2=\"182.4\" y2=\"150.1\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"182.4,150.1 192.5,152.6 189.7,157.5\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"210.0\" y=\"177.7\" text-anchor=\"middle\" style=\"font-size:13px\">przód<\/text><line class=\"ax\" x1=\"60.0\" y1=\"163.0\" x2=\"83.8\" y2=\"140.7\" style=\"stroke-width:1\"/><polygon class=\"ax\" points=\"83.8,140.7 78.4,149.6 74.6,145.5\" style=\"fill:var(--mu)\"/><text class=\"\" x=\"58.0\" y=\"176.0\" text-anchor=\"end\" style=\"font-size:13px\">z lewej<\/text><rect class=\"sh\" x=\"290.0\" y=\"70.0\" width=\"102.0\" height=\"68.0\" style=\"stroke-width:2.6\"/><line class=\"sh\" x1=\"290.0\" y1=\"104.0\" x2=\"392.0\" y2=\"104.0\" style=\"stroke-width:2.6\"/><text class=\"\" x=\"341.0\" y=\"160.0\" text-anchor=\"middle\" style=\"font-size:13px\">rzut z przodu<\/text><\/svg>", "options": ["<svg viewBox=\"0 0 120 104\" role=\"img\" aria-label=\"Rzut z lewej strony: zarys schodkowy.\"><polyline class=\"sh\" points=\"20.0,92.0 100.0,92.0 100.0,52.0 70.0,52.0 70.0,12.0 20.0,12.0 20.0,92.0\" style=\"stroke-width:2.6\"/><\/svg>", "<svg viewBox=\"0 0 120 104\" role=\"img\" aria-label=\"Rzut z lewej strony: zarys schodkowy.\"><polyline class=\"sh\" points=\"20.0,92.0 100.0,92.0 100.0,12.0 50.0,12.0 50.0,52.0 20.0,52.0 20.0,92.0\" style=\"stroke-width:2.6\"/><\/svg>", "<svg viewBox=\"0 0 120 104\" role=\"img\" aria-label=\"Rzut z lewej strony: zarys schodkowy.\"><polyline class=\"sh\" points=\"20.0,92.0 100.0,92.0 100.0,52.0 50.0,52.0 50.0,12.0 20.0,12.0 20.0,92.0\" style=\"stroke-width:2.6\"/><\/svg>", "<svg viewBox=\"0 0 120 104\" role=\"img\" aria-label=\"Rzut z lewej strony: zarys schodkowy.\"><polyline class=\"sh\" points=\"20.0,92.0 100.0,92.0 100.0,32.0 70.0,32.0 70.0,12.0 20.0,12.0 20.0,92.0\" style=\"stroke-width:2.6\"/><\/svg>"], "answer": 0, "explain": "Patrząc z lewej, przód bryły ma się po prawej ręce, więc niski stopień jest po prawej stronie rzutu, czyli z dala od rzutu z przodu. Rzut odbity (stopień po lewej) to typowa pomyłka. Stopień musi mieć głębokość 15 i wysokość 20, tę samą co linia w rzucie z przodu.", "id": "q07", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rx-3", "t": "17.10 · Bryła"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-3", "t": "17.10 · Układ rzutów"}], "partial": false}, {"type": "abc", "tag": "rzu.krok", "q": "Na rysunku jest rzut z góry płytki o grubości 30 z pionowym otworem przelotowym Ø20. Który rysunek jest poprawnym rzutem z przodu?", "svg": "<svg viewBox=\"0 0 240 120\" role=\"img\" aria-label=\"Rzut z góry płytki 80 na 40 z okrągłym otworem przelotowym Ø20 w środku: prostokąt z okręgiem i osiami.\"><rect class=\"sh\" x=\"40.0\" y=\"20.0\" width=\"160.0\" height=\"80.0\" style=\"stroke-width:2.6\"/><circle class=\"sh\" cx=\"120.0\" cy=\"60.0\" r=\"20.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"92.0\" y1=\"60.0\" x2=\"106.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"32.0\" x2=\"120.0\" y2=\"46.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"108.5\" y1=\"60.0\" x2=\"109.5\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"48.5\" x2=\"120.0\" y2=\"49.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"112.0\" y1=\"60.0\" x2=\"128.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"52.0\" x2=\"120.0\" y2=\"68.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"130.5\" y1=\"60.0\" x2=\"131.5\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"70.5\" x2=\"120.0\" y2=\"71.5\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"134.0\" y1=\"60.0\" x2=\"148.0\" y2=\"60.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"74.0\" x2=\"120.0\" y2=\"88.0\" style=\"stroke-width:1\"/><\/svg>", "options": ["<svg viewBox=\"0 0 200 96\" role=\"img\" aria-label=\"Rzut z przodu płytki: prostokąt z dwiema pionowymi liniami otworu.\"><rect class=\"sh\" x=\"20.0\" y=\"18.0\" width=\"160.0\" height=\"60.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"80.0\" y1=\"18.0\" x2=\"80.0\" y2=\"78.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"120.0\" y1=\"18.0\" x2=\"120.0\" y2=\"78.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"100.0\" y1=\"9.0\" x2=\"100.0\" y2=\"87.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>", "<svg viewBox=\"0 0 200 96\" role=\"img\" aria-label=\"Rzut z przodu płytki: prostokąt z dwiema pionowymi liniami otworu.\"><rect class=\"sh\" x=\"20.0\" y=\"18.0\" width=\"160.0\" height=\"60.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"80.0\" y1=\"18.0\" x2=\"80.0\" y2=\"78.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"120.0\" y1=\"18.0\" x2=\"120.0\" y2=\"78.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"100.0\" y1=\"9.0\" x2=\"100.0\" y2=\"87.0\" style=\"stroke-width:1\"/><\/svg>", "<svg viewBox=\"0 0 200 96\" role=\"img\" aria-label=\"Rzut z przodu płytki: prostokąt z dwiema pionowymi liniami otworu.\"><rect class=\"sh\" x=\"20.0\" y=\"18.0\" width=\"160.0\" height=\"60.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"80.0\" y1=\"18.0\" x2=\"80.0\" y2=\"78.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"120.0\" y1=\"18.0\" x2=\"120.0\" y2=\"78.0\" style=\"stroke-width:1\"/><line class=\"ax\" x1=\"100.0\" y1=\"9.0\" x2=\"100.0\" y2=\"87.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>", "<svg viewBox=\"0 0 200 96\" role=\"img\" aria-label=\"Rzut z przodu płytki: prostokąt z dwiema pionowymi liniami otworu.\"><rect class=\"sh\" x=\"20.0\" y=\"18.0\" width=\"160.0\" height=\"60.0\" style=\"stroke-width:2.6\"/><line class=\"ax\" x1=\"90.0\" y1=\"18.0\" x2=\"90.0\" y2=\"78.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"110.0\" y1=\"18.0\" x2=\"110.0\" y2=\"78.0\" style=\"stroke-width:1.3;stroke-dasharray:6 3\"/><line class=\"ax\" x1=\"100.0\" y1=\"9.0\" x2=\"100.0\" y2=\"87.0\" style=\"stroke-width:1;stroke-dasharray:16 3 2 3\"/><\/svg>"], "answer": 0, "explain": "Ściany otworu są w rzucie z przodu zasłonięte, więc rysuje się je cienką linią kreskową, w odstępie równym średnicy, i dodaje oś otworu linią punktową cienką wysuniętą poza zarys. Oś narysowana linią ciągłą cienką jest błędem rodzaju linii, a ciągłe linie ścian otworu oznaczałyby krawędzie widoczne.", "id": "q08", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rx-plan", "t": "17.10 · Plansza: bryła z otworem"}, {"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#rx-3", "t": "17.10 · Bryła"}], "partial": false}, {"type": "abc", "tag": "rzu.metody", "q": "Czym różni się metoda europejska (E) od amerykańskiej (A)?", "options": ["w E przedmiot leży między obserwatorem a rzutnią, w A rzutnia leży między obserwatorem a przedmiotem", "w E rzutnia leży między obserwatorem a przedmiotem, w A przedmiot leży między obserwatorem a rzutnią", "w E proste rzutujące są prostopadłe do rzutni, w A są do niej ukośne", "w E obserwator stoi między przedmiotem a rzutnią, w A za rzutnią"], "answer": 0, "explain": "Metoda E to metoda pierwszego kąta: rzutnia jest za przedmiotem, jak ściana, na którą pada cień. W metodzie A (trzeciego kąta) rzutnia stoi przed przedmiotem. W obu metodach rzutowanie jest prostokątne, a różnica polega na rozmieszczeniu rzutów.", "id": "q09", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-1", "t": "17.10 · Kolejność"}], "partial": false}, {"type": "abc", "tag": "rzu.metody", "q": "Który zestaw to podstawowy układ rzutów w metodzie europejskiej?", "options": ["rzut z przodu, rzut z góry, rzut z lewej strony", "rzut z przodu, rzut z góry, rzut z prawej strony", "rzut z przodu, rzut z dołu, rzut z lewej strony", "rzut z przodu, rzut z lewej strony, rzut z prawej strony"], "answer": 0, "explain": "Rzut z lewej strony ma pierwszeństwo przed rzutem z prawej, a rzut z góry przed rzutem z dołu. Pozostałe rzuty dodaje się tylko wtedy, gdy brakuje informacji o kształcie lub wymiarach.", "id": "q10", "links": [{"u": "../../../grafika-inzynierska-1/2026-10-17_grafika-inzynierska-17-10-2026/index.html#e-4", "t": "17.10 · Podstawowy układ"}], "partial": fa
